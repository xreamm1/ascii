<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  pre {
    position: absolute;
    margin: 0;
    color: #fff;
    font: 16px/1 "JetBrains Mono", Consolas, "Courier New", monospace;
    font-size: var(--fs, 16px);
  }
  #crosshair {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #hotbar {
    left: 16px;
    bottom: 16px;
  }
  #hp { left: 16px; bottom: 110px; color: #f55; pointer-events: none; display: none; }
  #ammo { left: 16px; bottom: 150px; color: #ffd84a; pointer-events: none; display: none; }
  #scope {
    position: fixed; inset: 0; pointer-events: none; display: none;
    background:
      linear-gradient(#000, #000) center / 100% 1px no-repeat,
      linear-gradient(#000, #000) center / 1px 100% no-repeat,
      radial-gradient(circle at center, transparent 0 33vmin, #000 33.5vmin);
  }
  #flash { position: fixed; inset: 0; background: #f00; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  #death {
    left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; color: #f55;
    background: #000; border: 4px double #f55; padding: 10px 24px; display: none; pointer-events: none; font-size: 22px; white-space: normal;
  }
  #hotbar, #inv { white-space: normal; font-size: var(--fs, 14px); }
  .hbs { display: flex; gap: 2px; margin-top: 3px; }
  .slot, .cell { width: var(--slot, 44px); height: var(--slot, 44px); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; position: relative; cursor: pointer; border: 1px solid #555; background: rgba(0,0,0,0.55); }
  .slot.sel { border: 2px solid #fff; background: rgba(60,60,60,0.8); }
  .slot img, .cell img { width: 92%; height: 92%; object-fit: contain; pointer-events: none; }
  .slot b { position: absolute; left: 2px; bottom: 0; font-size: 10px; color: #bbb; pointer-events: none; }
  .ph { font-size: 9px; color: #888; pointer-events: none; }
  #hotbar .page { cursor: pointer; }
  #palette {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
  }
  #inv { left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; display: none; max-height: 96vh; overflow: auto; border: 2px solid #fff; padding: 10px; width: calc(var(--slot, 44px) * 9 + 56px); box-sizing: border-box; }
  #inv .invt { margin-bottom: 6px; }
  #inv .tabs { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
  #inv .tab { cursor: pointer; padding: 0 3px; }
  #inv .tab.on { background: #fff; color: #000; }
  #inv .grid { display: grid; grid-template-columns: repeat(9, var(--slot, 44px)); gap: 2px; max-height: 46vh; overflow-y: auto; align-content: start; }
  #inv .none { grid-column: 1 / -1; color: #888; padding: 6px 0; }
  #inv .invq { width: 100%; box-sizing: border-box; background: #111; color: #fff; border: 1px solid #666; padding: 5px 7px; font: inherit; margin-bottom: 8px; outline: none; }
  #inv .invq:focus { border-color: #fff; }
  #inv .cell:hover, #inv .tab:hover { background: #333; }
  #schem { left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; display: none; max-height: 96vh; overflow: auto; border: 2px solid #fff; padding: 10px; white-space: normal; font-size: 14px; max-width: 96vw; box-sizing: border-box; line-height: 1.5; }
  #schem .sact { cursor: pointer; }
  #schem .sact:hover { background: #333; }
  #inv .invname { margin: 8px 0 4px; min-height: 1.2em; }
  #inv .invhint { margin-top: 6px; color: #888; font-size: 12px; }

  /* Общий вид окон — как раньше в ASCII: чёрный фон, двойная белая рамка, кнопки в скобках, моноширинный шрифт */
  #menu, #game, #admin, #palette, #inv, #schem, #chess {
    white-space: normal; background: #000; border: 4px double #fff; border-radius: 0; box-shadow: none;
    padding: 10px 14px; color: #fff; font-size: var(--fs, 16px); line-height: 1.35; box-sizing: border-box;
    max-height: 94vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #menu { width: min(94vw, 420px); } #game { width: min(94vw, 400px); } #admin { width: min(96vw, 440px); } #palette { width: min(94vw, 340px); }
  .xbtn { display: none; position: absolute; top: 2px; right: 8px; cursor: pointer; padding: 2px 8px; z-index: 2; border: 1px solid #fff; background: #000; }
  @media (pointer: coarse) { .xbtn { display: block; } }
  body.panel-open #hint, body.panel-open #touch, body.panel-open #lobby, body.panel-open #coords, body.panel-open #hotbar, body.panel-open #hp, body.panel-open #ammo, body.panel-open #chat { display: none !important; }
  /* Низкий экран (телефон лёжа): окна сжимаем, лишние подписи убираем */
  @media (max-height: 520px) {
    #menu, #game, #admin, #palette, #inv, #schem, #chess, #ask { padding: 6px 10px; border-width: 3px; }
    #inv .invt, #inv .invhint, .gx { display: none; }
    #inv .grid { max-height: 36vh; }
    #inv .invq { margin-bottom: 4px; padding: 2px 6px; }
    #inv .tabs { margin-bottom: 4px; gap: 2px 8px; }
    #inv .invname { margin: 3px 0; }
    .gt { margin-bottom: 4px; }
    .gb { margin: 1px 0; }
  }
  #menu, #game, #admin, #palette, #inv, #schem, #chess, #p2p { touch-action: pan-y; overscroll-behavior: contain; }
  .gt { margin: 0 0 8px; text-align: center; }
  .gt::before { content: "═══ "; } .gt::after { content: " ═══"; }
  .gl { color: #fff; margin: 3px 0; }
  .gl.note { color: #ffd84a; }
  .gs { border-top: 1px solid #fff; margin: 8px 0 4px; padding-top: 2px; font-size: 0.85em; }
  .gb { display: block; padding: 0 4px; margin: 2px 0; background: none; border: none; border-radius: 0; cursor: pointer; text-align: left; color: #fff; }
  .gb::before { content: "[ "; } .gb::after { content: " ]"; }
  .gb:hover { background: #fff; color: #000; }
  .gb.small { display: inline-block; margin: 0 4px 0 0; padding: 0 2px; font-size: inherit; }
  .gb.on { font-weight: 700; }
  .gb.warn { text-decoration: underline; }
  .gg { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; margin: 2px 0; }
  .gg .gl { margin: 0 8px 0 0; }
  .slot i, .cell i { position: absolute; right: 2px; bottom: 0; font-style: normal; font-size: 11px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
  .slot.empty img { opacity: 0.3; }
  .hbs.armor { margin-top: 4px; } .hbs.armor small { font-size: 9px; color: #888; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--slot, 44px) + 70px); transform: translateX(-50%); z-index: 30; color: #ffd34d; text-align: center; pointer-events: none; display: none; text-shadow: 0 0 3px #000; }
  .crafts { display: flex; flex-direction: column; gap: 2px; max-height: 46vh; overflow: auto; text-align: left; }
  .craft { display: flex; align-items: center; gap: 8px; padding: 2px 4px; opacity: 0.5; cursor: pointer; line-height: 1.25; }
  .craft.ok { opacity: 1; } .craft.ok:hover { background: #333; }
  .craft img, .craft .ph { width: 30px; height: 30px; flex-shrink: 0; }
  .craft .miss { color: #f77; }
  #chess { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; width: min(96vw, 440px); font-family: "JetBrains Mono", Consolas, monospace; }  /* div, а не pre: свои отступы у клеток */
  .cstat { margin: 4px 0 6px; color: #ffd34d; }
  .cboard { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: min(86vw, 400px, 58vh); aspect-ratio: 1; margin: 0 auto 8px; border: 2px solid #4a3a28; }
  .cboard .sq { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; user-select: none; font-size: min(7.4vw, 38px, 5.4vh); line-height: 1; }
  .sq.l { background: #eeeed2; } .sq.d { background: #769656; }
  .sq.last.l { background: #f6f669; } .sq.last.d { background: #baca2b; }
  .sq.sel { box-shadow: inset 0 0 0 3px #f5c400; }
  .sq.to::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(0, 0, 0, 0.22); pointer-events: none; }
  .sq.chk { background: radial-gradient(circle, #ff4040 0, #ff404000 75%), #eeeed2; }
  .sq i { font-style: normal; font-family: "Segoe UI Symbol", "Noto Sans Symbols2", "DejaVu Sans", "Apple Symbols", serif; pointer-events: none; }
  .sq i.pw { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 1px 1px #333; }
  .sq i.pb { color: #262421; text-shadow: 0 0 1px rgba(255, 255, 255, 0.5); }
  .help { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 4px 0; }
  .help b { color: #ffd34d; font-weight: 700; white-space: nowrap; }
  .help span { color: #ddd; }
  #fps { position: fixed; left: 16px; top: 34px; z-index: 31; color: #fff; font-size: 14px; pointer-events: none; display: none; text-shadow: 0 0 3px #000; }
  #mine { position: fixed; left: 50%; top: calc(50% + 14px); transform: translateX(-50%); z-index: 30; color: #fff; pointer-events: none; display: none; font-size: 13px; }
  .gcols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .gx { margin-top: 8px; border-top: 1px solid #fff; padding-top: 2px; font-size: 0.85em; }
  .lobbyrow { display: flex; gap: 4px; align-items: center; }
  .lobbyrow .gb:first-child { flex: 1; text-align: left; }
  #palette .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 4px 0 8px; }
  #palette .option { aspect-ratio: 1; border: 2px solid #333; border-radius: 0; cursor: pointer; }
  #palette .option:hover { border-color: #fff; }
  #palette .option.sel { border: 3px double #fff; }
  #palette .cname { text-align: center; min-height: 1.3em; }
  #inv, #schem { border: 4px double #fff; }
  .slot, .cell { border-radius: 0; border: 1px solid #666; background: rgba(0, 0, 0, 0.6); }
  .slot.sel { border: 3px double #fff; background: rgba(40, 40, 40, 0.85); }
  .cell:hover { border-color: #fff; background: #222; }
  .ann { background: #000; border: 4px double #ffd84a; border-radius: 0; padding: 8px 20px; text-align: center; }
  .ann b { display: block; font-weight: 400; color: #ffd84a; margin-bottom: 2px; }
  #stick { width: 120px; height: 120px; border: 2px solid #fff; border-radius: 50%; background: rgba(255,255,255,0.06); font-size: 0; }
  #knob { width: 46px; height: 46px; border: 2px solid #fff; border-radius: 50%; background: rgba(255,255,255,0.5); font-size: 0; }

  /* Окошко ввода (ник, чат, текст) */
  #ask {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
    background: #000; border: 4px double #fff; color: #fff;
    font: 16px/1.35 "JetBrains Mono", Consolas, "Courier New", monospace; font-size: var(--fs, 16px); padding: 10px 14px; width: min(94vw, 380px); box-sizing: border-box; display: none;
  }
  #askTop { margin-bottom: 8px; text-align: center; }
  #askTop::before { content: "═══ "; } #askTop::after { content: " ═══"; }
  #ask input {
    width: 100%; box-sizing: border-box; padding: 2px 4px; font: inherit; color: #fff; background: #000; border: none; border-bottom: 1px solid #fff; outline: none;
    /* Без этого Safari на iPhone не даёт печатать: у страницы выделение текста выключено */
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #ask .askbtns { display: flex; gap: 16px; margin-top: 10px; border-top: 1px solid #fff; padding-top: 4px; }
  #ask .askbtns .gb { margin: 0; }

  #chat {
    left: 16px;
    bottom: 90px;
    max-width: 60ch;
    white-space: pre-wrap;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.45);
    padding: 2px 6px;
  }
  .nick {
    transform: translate(-50%, -100%);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Главное меню */
  #menu {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
  }
  #lobby { left: 16px; top: 16px; pointer-events: none; background: rgba(0, 0, 0, 0.55); padding: 2px 6px; }
  #lobby:empty, #chat:empty { display: none; }
  #admin {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
    max-height: 92vh;      /* панель длинная: на низком экране её можно листать */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #hint {
    left: 50%;
    top: 60%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 10px;
  }
  #announce {
    left: 50%;
    top: 18%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 20px;
    pointer-events: none;
    display: none;
    white-space: normal;
    max-width: 90vw;
  }
  .nick.dev { color: #ffd84a !important; }
  #game {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
  }
  /* Пока открыто меню, игровой интерфейс прячем */
  body.in-menu #hotbar, body.in-menu #hp, body.in-menu #ammo, body.in-menu #touch, body.in-menu #crosshair, body.in-menu #chat { display: none; }

  /* Управление для телефона: видно только на сенсорных экранах */
  #touch { display: none; }
  /* Кнопки собраны в два ряда, чтобы не наезжали друг на друга на любом экране:
     сверху справа — ЭКРАН, МЕНЮ, АДМИН, ЧАТ, ЦВЕТ; снизу справа — СЕСТЬ и ПРЫЖОК */
  #touch .row {
    position: absolute;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  #touch .row.top { top: 16px; flex-wrap: wrap; justify-content: flex-end; max-width: 58vw; }
  #touch .row.bottom { bottom: 16px; flex-direction: column; align-items: flex-end; }
  /* Вертикально экран узкий: нижние кнопки — над панелью предметов, чтобы не наезжали на неё */
  @media (orientation: portrait) { #touch .row.bottom { bottom: 90px; } }
  #touch .button {
    position: static;
    padding: 0.5em 0.7em;
    border: 2px solid #fff;
    border-radius: 0;
    background: rgba(0, 0, 0, 0.6);
    font-size: var(--fs, 14px);
  }
  #touch .button.big { padding: 0.9em 1.1em; }
  #touch .button { zoom: var(--btnk, 1); }  /* размер кнопок — из настроек */
  #touch .button.active { color: #000; background: #fff; }
  #lobby { max-width: 40vw; white-space: pre-wrap; }
  #stick, #knob {
    display: none;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  @media (pointer: coarse) {
    #touch { display: block; }
  }

  #inv.mcui { --mcslot: min(46px, calc((100vw - 44px)/9)); background:#c6c6c6; color:#292929; border:4px solid #252525; box-shadow:inset 3px 3px #fff,inset -3px -3px #555; padding:12px; width:calc(var(--mcslot)*9 + 38px); border-radius:5px; font-size:13px; }
  #inv.mcui .slot,#inv.mcui .cell { width:var(--mcslot); height:var(--mcslot); background:#8b8b8b; border:2px solid; border-color:#373737 #fff #fff #373737; }

  #inv.mcui .slot.sel { outline:2px solid #fff; outline-offset:-3px; }

  .chhead {display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .chhead .gt {flex:1;}

// Текстуры рисуем сами на canvas — так ничего не надо загружать
function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(LOWEND ? 1 : 4, renderer.capabilities.getMaxAnisotropy());
  return t;
}

      p(x,y,`rgb(${rgb.map(v=>Math.max(0,Math.min(255,Math.round(v+n)))).join(',')})`);

      const m = blocks.get(key(e.x + dx, e.y + dy, e.z + dz));

// Своё изменение: применяем у себя и рассылаем остальным игрокам
function share(e, replace = false) {
  if(e.op==="block"&&!e.by&&!e.g&&!e.t)e={...e,by:meId||myId};

// Склейка: обычные блоки рисуются кусками 8×8×8 (по цвету), а не тысячами отдельных вызовов отрисовки — так игра намного легче.

// Бюджет — миллисекунды за кадр, а не число кусков: на ходу (новая природа) кусков меняется много, а кадр не должен проседать.

}
function addSolid(mesh, e) {
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.edit = e;  // чем предмет был создан: нужно, чтобы его убрать и чтобы отправить новичкам
  mesh.userData.si = solids.length;
  solids.push(mesh);
  if (mesh.userData.mergeable) {  // рисуется куском: в сцене не нужен (так сцена лёгкая), для прицела хватает матрицы
    mesh.visible = false;
    mesh.matrixAutoUpdate = false;
    mesh.updateMatrix();
    mesh.matrixWorld.copy(mesh.matrix);
    chunkAdd(mesh);
  } else scene.add(mesh);
  gridAdd(mesh);
}

function removeSolid(mesh) {
  if (!mesh) return;
  scene.remove(mesh);
  chunkRemove(mesh);
  gridRemove(mesh);
  // Последний предмет встаёт на место убранного. Предмета уже нет в solids — ничего не трогаем
  // (раньше indexOf давал -1, и splice(-1) стирал последний предмет мира)
  const i = mesh.userData.si;
  if (solids[i] === mesh) {
    const last = solids.pop();
    if (last !== mesh) { solids[i] = last; last.userData.si = i; }
    mesh.userData.si = -1;
  }
  const e = mesh.userData.edit;
  if (e.op === "block") blocks.delete(key(e.x, e.y, e.z));
  if (e.k === "door") blocks.delete(key(e.x, e.y + 1, e.z));
  for (const c of extraCells(e)) blocks.delete(key(...c));
  if (e.op === "block") { rsRemove(e); if (rsRec.size) rsChanged(e.x, e.y, e.z); }
  if (e.op === "plank") planks.delete(e.id);
  if (e.op === "text") texts.delete(e.id);
  if (e.op === "car") { cars.delete(e.id); if (mesh === drivingCar) exitCar(); }
  if (e.op === "ball") balls.delete(e.id);
  if (e.op === "animal") animals.delete(e.id);
  if (e.op === "plane") { planes.delete(e.id); if (mesh === drivingPlane) exitPlane(); }
  if (e.op === "tank") { tanks.delete(e.id); if (mesh === drivingTank) exitTank(); }
  if (e.op === "cart") { carts.delete(e.id); if (mesh === drivingCart) exitCart(); }

}

// Рампа — клин, поднимающийся от низа клетки к верху. Сторона подъёма: r = 0..3, как у двери
// (0 — вперёд при взгляде по умолчанию, дальше против часовой стрелки)
const RAMP_DIR = [[0, -1], [-1, 0], [0, 1], [1, 0]];
const rampGeo = (() => {
  const P = (x, y, z) => [x - 0.5, y - 0.5, z - 0.5];

// Склеивает части [геометрия, x, y, z, материал] в один меш: по нему целятся лучом.

    nor.push(...g.attributes.normal.array);
    uv.push(...g.attributes.uv.array);

// Точка (x, z) в системе координат машины: вперёд — -z, кабина занимает z от -0.55 до 0.95
function carLocal(m, x, z) {
  const dx = x - m.position.x, dz = z - m.position.z, c = Math.cos(m.rotation.y), sn = Math.sin(m.rotation.y);
  return [dx * c - dz * sn, dx * sn + dz * c];
}
const carHits = (x, f, z, h) => !!carAt(x, f, z, h);
// Какая машина занимает это место (или null)
function carAt(x, f, z, h) {
  for (const m of cars.values()) {
    const bus = m.userData.edit.bus;
    if (m === drivingCar || (x - m.position.x) ** 2 + (z - m.position.z) ** 2 > (bus ? 48 : 20)) continue;
    const [lx, lz] = carLocal(m, x, z), y = m.position.y;
    if (bus) { if (Math.abs(lx) < 1.4 + RADIUS && Math.abs(lz) < 4.4 + RADIUS && f + h > y && f < y + 2.9) return m; continue; }
    if (Math.abs(lx) >= 0.9 + RADIUS || f + h <= y) continue;
    if (Math.abs(lz) < 1.8 + RADIUS && f < y + 0.92 - 0.01) return m;                          // капот, багажник, низ кузова
    if (lz > -0.55 - RADIUS && lz < 0.95 + RADIUS && f < y + 1.45 - 0.01) return m;             // кабина
  }
  return null;
}
// Высота крыши или капота под точкой — на машину можно встать (запрыгнуть с блока)
function carTop(x, z, f) {
  let top = -Infinity;
  for (const m of cars.values()) {
    const bus = m.userData.edit.bus;
    if (m === drivingCar || (x - m.position.x) ** 2 + (z - m.position.z) ** 2 > (bus ? 48 : 20)) continue;
    const [lx, lz] = carLocal(m, x, z);
    if (bus) { const t = m.position.y + 2.9; if (Math.abs(lx) < 1.4 && Math.abs(lz) < 4.4 && t <= f + STEP) top = Math.max(top, t); continue; }
    if (Math.abs(lx) >= 0.9 || Math.abs(lz) >= 1.8) continue;
    const t = m.position.y + (lz > -0.55 && lz < 0.95 ? 1.45 : 0.92);
    if (t <= f + STEP) top = Math.max(top, t);
  }
  return top;
}

// Какое животное задел луч (ближе maxDist): { m, dist, point } или null. Коробка с запасом: животные маленькие
function rayAnimal(origin, dir, maxDist) {
  let best = null;
  const ray = new THREE.Ray(origin, dir);
  for (const m of animals.values()) {
    const h = ANIMALS[m.userData.edit.t].h;
    rayBox.setFromCenterAndSize(new THREE.Vector3(m.position.x, m.position.y + h / 2, m.position.z), new THREE.Vector3(1.0, h + 0.2, 1.0));
    const pt = ray.intersectBox(rayBox, rayPt);
    if (!pt) continue;
    const d = origin.distanceTo(pt);
    if (d < maxDist && (!best || d < best.dist)) best = { m, dist: d, point: pt.clone() };
  }
  return best;
}

const LOW_TOP = { chess: 0.9, table: 0.75, chair: 0.45, bed: 0.5, sofa: 0.45, bench: 0.45 };
let onIce = false, iceVx = 0, iceVz = 0;  // лёд: игрок скользит
let ignoreJump = false;  // машина не упирается носом в трамплин: она по нему въезжает
function lowTop(cx, cy, cz, x, z) {
  const e = blocks.get(key(cx, cy, cz))?.userData.edit;
  if(e?.dim) return x+RADIUS>e.x && x-RADIUS<e.x+e.dim[0] && z+RADIUS>e.z && z-RADIUS<e.z+e.dim[2] ? e.y+e.dim[1] : null;
  if (ignoreJump && e?.k === "jump") return null;
  if (e?.k in LOW_TOP) return cy + LOW_TOP[e.k];
  const dir = (e?.k === "ramp" || e?.k === "stairs" || e?.k === "jump") && RAMP_DIR[e.r];
  // Склон считаем только там, где стоит центр игрока: иначе ступеньки, идущие подряд, не дают подняться
  if (!dir || Math.floor(x) !== cx || Math.floor(z) !== cz) return null;
  const t = Math.min(1, Math.max(0, 0.5 + (x - cx - 0.5) * dir[0] + (z - cz - 0.5) * dir[1]));
  return cy + (e.k === "stairs" ? (Math.floor(Math.min(t, 0.999) * 4) + 1) / 4 : t);
}

function blockMesh(e) {
  if (e.dim) {
    const m=new THREE.Mesh(boxGeo,e.k==="glass"?glassMaterial(e.c):e.k in BLOCK_TEX?blockMaterial(e.k,e.c):material(e.k==="flat"?plainTex:brickTex,e.c));
    m.scale.fromArray(e.dim); m.position.set(e.x+e.dim[0]/2,e.y+e.dim[1]/2,e.z+e.dim[2]/2); return m;
  }
  if (e.k?.startsWith("rs_")) return rsBuild(e);
  if (e.k in GLASSY) {
    const screen = e.k === "tv" ? tvMat : e.k === "terminal" ? kioskMat : glassMaterial(e.c);
    const m = new THREE.Mesh(GLASSY[e.k], [vmaterial(foodTex, e.c), screen]);
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    if (e.k === "tv") tvs.add(m);
    return m;
  }
  if (e.k in KITCHEN || e.k in STREET) {
    const m = new THREE.Mesh(KITCHEN[e.k] || STREET[e.k], vmaterial(e.k === "tnt" ? plainTex : foodTex, e.c));
    if (e.k === "streetlamp") { lamps.add(m); m.userData.lightY = 2.7; }
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    return m;
  }
  if (e.k in MORE) {
    const m = new THREE.Mesh(MORE[e.k], vmaterial(woodTex, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    return m;
  }
  if (e.k === "stairs" || e.k === "barrier" || e.k === "grate" || e.k in DECOR) {
    const geo = e.k === "grate" ? grateGeo : e.k === "stairs" ? stairsGeo : e.k === "barrier" ? barrierGeos[e.open ? BARRIER_STEPS : 0] : DECOR[e.k][0];
    const tex = e.k === "ball" ? ballTex : e.k in DECOR ? foodTex : brickTex;
    const m = new THREE.Mesh(geo, vmaterial(tex, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    if (e.k === "lamp") lamps.add(m);
    if (e.k === "barrier") { m.userData.step = e.open ? BARRIER_STEPS : 0; barriers.add(m); }
    return m;
  }
  if (e.k === "table" || e.k === "chair") {
    const m = new THREE.Mesh(e.k === "table" ? tableGeo : chairGeo, vmaterial(woodTex, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;  // стул смотрит туда же, куда и ты при установке
    return m;
  }
  if (e.k === "ramp" || e.k === "jump") {
    const m = new THREE.Mesh(rampGeo, material(brickTex, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    return m;
  }
  if (e.k === "glass") {
    const m = new THREE.Mesh(boxGeo, glassMaterial(e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    return m;
  }
  if (e.k === "stick") {
    const m = new THREE.Mesh(stickGeo, material(woodTex, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    return m;
  }
  if (e.k === "door") {
    // Петля у края клетки; открытая дверь повёрнута на 90° вокруг петли
    const a = (e.r || 0) * Math.PI / 2;
    const m = new THREE.Mesh(doorGeo, vmaterial(doorTex, e.c));
    m.position.set(e.x + 0.5 - 0.5 * Math.cos(a), e.y, e.z + 0.5 + 0.5 * Math.sin(a));
    m.rotation.y = a + (e.open ? Math.PI / 2 : 0);
    return m;
  }
  if (e.k === "vitsign") {
    const m = new THREE.Mesh(vitSignGeo, vitSignMats);
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    return m;
  }
  if (e.k === "chess") return chessMesh(e);
  if (e.k === "portal") {
    const m = new THREE.Mesh(portalPlane, portalMat);
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    m.rotation.y = (e.r || 0) * Math.PI / 2;
    return m;
  }
  if (e.k in BLOCK_TEX) {  // материалы: камень, лава, слизь и другие
    const m = new THREE.Mesh(boxGeo, blockMaterial(e.k, e.c));
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    if (!EMISSIVE.has(e.k)) { m.userData.mergeable = true; m.userData.tex = BLOCK_TEX[e.k]; m.userData.chunkKey = e.k + "|" + e.c; }
    return m;
  }
  if (e.k === "shield") {  // защитный блок: фиолетово-чёрная шахматка
    const m = new THREE.Mesh(boxGeo, shieldMat);
    m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    return m;
  }
  const flat = e.k === "flat";  // «Блок» без текстуры: просто выбранный цвет, как у ТНТ
  const m = new THREE.Mesh(boxGeo, material(flat ? plainTex : brickTex, e.c));
  m.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
  m.userData.mergeable = true;  // рисуется склейкой, см. rebuildChunks
  if (flat) { m.userData.tex = plainTex; m.userData.chunkKey = "flat|" + e.c; }
  return m;
}

// Надпись: текст рисуется на canvas и натягивается на плоскость. Сам текст светится,
// поэтому в ASCII он получается из ярких символов
function textMesh(text, c) {
  const h = 64;
  const font = `bold ${h * 0.8}px Consolas, 'Courier New', monospace`;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = font;
  canvas.width = Math.ceil(ctx.measureText(text).width) + 16;
  canvas.height = h;
  ctx.font = font;  // после смены размера canvas настройки сбрасываются
  ctx.fillStyle = "#fff";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 8, h / 2);

  const [r, g, b] = COLORS[c].rgb;
  const mesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(canvas),
    color: new THREE.Color(r / 255, g / 255, b / 255),
    transparent: true,
    alphaTest: 0.3,
    side: THREE.DoubleSide,
  }));
  mesh.scale.set(TEXT_H * canvas.width / canvas.height, TEXT_H, 1);
  return mesh;
}

// Куда и как повернуть новую надпись: на стене — лицом наружу, на полу — лёжа,
// низом к игроку, а в воздухе — стоя лицом к игроку
function textPlacement(hit) {
  const m = new THREE.Object3D();
  if (hit && Math.abs(hit.normal.y) > 0.9) {
    m.position.copy(hit.point).addScaledVector(hit.normal, 0.02);
    m.rotation.set(-Math.PI / 2 * Math.sign(hit.normal.y), yaw, 0, "YXZ");
  } else if (hit) {
    m.position.copy(hit.point).addScaledVector(hit.normal, 0.02);
    m.lookAt(m.position.clone().add(hit.normal));
  } else {
    m.position.copy(plankPoint(null));
    m.rotation.set(0, yaw, 0);
  }
  return {
    p: m.position.toArray().map(v => +v.toFixed(3)),
    q: m.quaternion.toArray().map(v => +v.toFixed(4)),
  };
}

// Кладёт доску между точками a и b (поверх поверхности, а не внутрь неё)
function fitPlank(mesh, a, b) {
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.position.y += PLANK_T / 2;
  mesh.scale.set(1, 1, a.distanceTo(b));
  mesh.lookAt(b.x, b.y + PLANK_T / 2, b.z);
}

// Подсказки: прозрачный блок там, куда он встанет, и прозрачная доска при выборе второй точки
const ghostMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.35, depthWrite: false });
const ghostBlock = new THREE.Mesh(new THREE.BoxGeometry(1.01, 1.01, 1.01), ghostMat);
const ghostPlank = new THREE.Mesh(plankGeo, ghostMat);
const ghostPoint = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), ghostMat);
scene.add(ghostBlock, ghostPlank, ghostPoint);

// ---------- Физика игрока ----------

// Мешает ли то, что стоит в клетке, игроку с центром (x, z): блок и стекло — всей клеткой,
// палка — только тонким столбиком посередине, открытая дверь — не мешает
function cellBlocks(cx, cy, cz, x, z) {
  const m = blocks.get(key(cx, cy, cz));
  if (!m) return false;
  const e = m.userData.edit;
  if (e.dim) return false;  // высоту и точные края считает lowTop
  if (e.k === "door" || e.k === "barrier") return !e.open;
  if (RS_THIN.has(e.k)) return false;
  if (e.k === "ramp" || e.k === "stairs" || e.k === "jump" || e.k === "portal" || e.k in LOW_TOP || e.k in DECOR) return false;  // их высоту считает lowTop
  if (e.k === "stick") return Math.abs(x - cx - 0.5) < RADIUS + STICK_HALF && Math.abs(z - cz - 0.5) < RADIUS + STICK_HALF;
  return true;
}

// Пересекается ли тело игрока (стоящего ступнями на высоте f, ростом h) с каким-нибудь блоком
function hitsBlock(x, f, z, h) {
  for (let cx = Math.floor(x - RADIUS); cx <= Math.floor(x + RADIUS); cx++)
    for (let cz = Math.floor(z - RADIUS); cz <= Math.floor(z + RADIUS); cz++)
      for (let cy = Math.floor(f + 0.01); cy <= Math.floor(f + h - 0.01); cy++)
        if (cellBlocks(cx, cy, cz, x, z) || (lowTop(cx, cy, cz, x, z) ?? -Infinity) > f + STEP + 0.01) return true;
  return false;
}

// Пересекает ли отрезок a → a+d коробку с центром в нуле и полуразмерами half
function segmentHitsBox(a, d, half) {
  let t0 = 0, t1 = 1;
  for (const k of ["x", "y", "z"]) {
    if (Math.abs(d[k]) < 1e-9) {
      if (Math.abs(a[k]) > half[k]) return false;
      continue;
    }
    let ta = (-half[k] - a[k]) / d[k], tb = (half[k] - a[k]) / d[k];
    if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta);
    t1 = Math.min(t1, tb);
    if (t0 > t1) return false;
  }
  return true;
}

// Пересекается ли тело игрока с доской. Тело — вертикальный отрезок от колен (feet + STEP,
// чтобы на низкие доски можно было заходить) до макушки. Переводим его в систему координат
// доски, где она — обычная коробка, и расширяем коробку на толщину игрока
const invQ = new THREE.Quaternion();
function hitsPlank(mesh, x, f, z, h = bodyH) {
  invQ.copy(mesh.quaternion).invert();
  const a = new THREE.Vector3(x, f + STEP, z).sub(mesh.position).applyQuaternion(invQ);
  const d = new THREE.Vector3(0, h - STEP, 0).applyQuaternion(invQ);
  const half = new THREE.Vector3(PLANK_W / 2 + RADIUS, PLANK_T / 2, mesh.scale.z / 2 + RADIUS);
  return segmentHitsBox(a, d, half);
}

function hitsSolid(x, f, z, h = bodyH) {
  if (hitsBlock(x, f, z, h) || carHits(x, f, z, h)) return true;
  for (const p of planks.values()) if (hitsPlank(p, x, f, z, h)) return true;
  return false;
}

// Высота самой верхней опоры под игроком, на которую можно встать с высоты f
const downRay = new THREE.Raycaster();
function groundHeight(x, f, z) {
  let g = -DEPTH - 5;
  for (let cx = Math.floor(x - RADIUS); cx <= Math.floor(x + RADIUS); cx++)
    for (let cz = Math.floor(z - RADIUS); cz <= Math.floor(z + RADIUS); cz++) {
      const hole = topDug(cx, cz), deep = hole || f + STEP < 0;
      if (!hole && f + STEP >= 0 && cx <= HELL_BORDER) g = Math.max(g, 0);  // плита (в аду её нет)
      for (let cy = Math.floor(f + STEP); cy >= (deep ? -DEPTH - 2 : 0); cy--) {
        // Рампа: встаём на её поверхность, если она не выше, чем можно шагнуть
        const top = lowTop(cx, cy, cz, x, z);
        if (top !== null) { if (top <= f + STEP) { g = Math.max(g, top); break; } continue; }
        if (cy < Math.floor(f + STEP) && cellBlocks(cx, cy, cz, x, z)) { g = Math.max(g, cy + 1); break; }
      }
    }

  g = Math.max(g, carTop(x, z, f));
  downRay.set(new THREE.Vector3(x, f + STEP, z), new THREE.Vector3(0, -1, 0));
  const hit = downRay.intersectObjects([...planks.values()])[0];
  if (hit) g = Math.max(g, f + STEP - hit.distance);
  return g;
}

const camRay = new THREE.Raycaster();

// ---------- Здоровье (только в обычном режиме) ----------
const hpEl = document.getElementById("hp");
const flashEl = document.getElementById("flash");
const deathEl = document.getElementById("death");
let lastHpText = "";
function drawHp() {
  const show = gameMode === "survival" && inGame;
  hpEl.style.display = show ? "block" : "none";
  if (!show) return;
  const ap = armorPoints(), arm = ap ? `\n▣ ${ap}\n` + "▣".repeat(Math.ceil(ap / 2)) + "·".repeat(10 - Math.ceil(ap / 2)) : "";
  const t = (isGod() ? "♥ БОГ\n" + "█".repeat(10) : `♥ ${Math.max(0, Math.ceil(hp))}\n` + "█".repeat(Math.ceil(hp / 10)) + "░".repeat(10 - Math.ceil(hp / 10))) + arm;
  if (t !== lastHpText) { lastHpText = t; hpEl.textContent = t; }
}

// Урон: в творческом режиме его нет. by — кто виноват (для сообщения о гибели)
function damage(n, by) {
  if (gameMode !== "survival" || dead || isGod() || performance.now() < invulnUntil || n <= 0) return;
  n *= Math.max(0.2, 1 - armorPoints() * 0.04);  // броня: каждое очко — минус 4% урона
  if(!Number.isFinite(n)||n<=0)return;
  hp -= n;
  sfx("hurt");
  lastHurt = performance.now();
  flashEl.style.transition = "none"; flashEl.style.opacity = 0.35;
  requestAnimationFrame(() => { flashEl.style.transition = "opacity 0.4s"; flashEl.style.opacity = 0; });
  if (hp <= 0 && !tryTotem()) die(by);
  drawHp();
}

// Здоровье понемногу восстанавливается, если несколько секунд никто не бил
let lastHurt = 0;
function updateRegen(dt) {
  if (gameMode !== "survival" || dead || hp >= MAX_HP || performance.now() - lastHurt < 5000) return;
  hp = Math.min(MAX_HP, hp + 4 * dt);
  drawHp();
}

function die(by) {
  hp = 0; dead = true;
  exitCar();
  exitCart();
  endDrone();
  for (const k in keys) keys[k] = false;
  respawnAt = performance.now() + 3000;
  const text = by ? `☠ ${nick} погиб от ${by}` : `☠ ${nick} погиб`;
  addChat(text);
  online?.sendChat(text);
  if (document.pointerLockElement) document.exitPointerLock();
}

function respawn() {
  dead = false; hp = MAX_HP;
  invulnUntil = performance.now() + 2500;  // сразу после возрождения недолго неуязвим
  px = pz = SIZE / 2; feet = 0; vy = 0;
  deathEl.style.display = "none";
  resetWeapons();
  drawHp();
  if (!TOUCH && !menuOpen) lockMouse();
}

// Модель дрона: корпус и четыре винта. Её видят другие игроки, пока ты летишь
function makeDrone() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.08, 0.34), new THREE.MeshLambertMaterial({ color: 0x555555 }));
  g.add(body);
  const propGeo = new THREE.BoxGeometry(0.22, 0.02, 0.22), propMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const prop = new THREE.Mesh(propGeo, propMat);
    prop.position.set(x * 0.3, 0.06, z * 0.3);
    g.add(prop);
  }
  scene.add(g);
  return g;
}

// Взрыв дрона ломает всё вокруг: блоки, доски и надписи
function explode(pos, radius = BOOM_RADIUS) {
  if (shields.size) return;  // защитный блок в мире: взрывы блоки не ломают
  const r2 = radius * radius, batch = [];
  for (const m of solidsNear(pos, radius)) {
    const e = m.userData.edit;
    if (e && !isTerr(e) && !(e.p && online && !isDev) && m.position.distanceToSquared(pos) < r2) batch.push(undo(e));
  }
  for (const e of batch) edit(e);
  if (batch.length) online?.sendEdits(batch);  // всё, что сломал взрыв, — одним запросом
}

// FPV дрон: камера отделяется от игрока и летит туда, куда смотришь. Коснулся блока, доски или пола — взрыв
const dronePos = new THREE.Vector3();
let boom = 0;  // сколько секунд взрыва осталось (0 — дрон летит)
const boomMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide, fog: false })
);
boomMesh.visible = false;
scene.add(boomMesh);

function endDrone() {
  if (camMode !== "drone") return;
  boom = 0;
  boomMesh.visible = false;
  camMode = "first";
}

function droneHits(p) {
  return p.y <= 0.1 || cellBlocks(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z), p.x, p.z) ||
    p.y <= (lowTop(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z), p.x, p.z) ?? -1) ||
    [...planks.values()].some(m => hitsPlank(m, p.x, p.y - STEP, p.z, STEP));
}

// Машина: W/S — газ и тормоз, A/D — руль, пробел — ручник (с ним машину заносит). E — сесть и выйти
let carV = { x: 0, z: 0 }, carYaw = 0, nitroOn = false, carVy = 0;

// Ближайшая машина, в которую можно сесть
function nearestCar() {
  let best = null, bestD = 6;
  for (const m of cars.values()) {
    const d = Math.hypot(m.position.x - px, m.position.z - pz) - (m.userData.edit.bus ? 3 : 0);
    if (d < bestD && Math.abs(m.position.y - feet) < 3) { best = m; bestD = d; }
  }
  return best;
}
function nearestPlane() {
  let best = null, bestD = 8;
  for (const m of planes.values()) {
    const d = Math.hypot(m.position.x - px, m.position.z - pz);
    if (d < bestD && Math.abs(m.position.y - feet) < 4) { best = m; bestD = d; }
  }
  return best;
}
function nearestTank() {
  let best = null, bestD = 8;
  for (const m of tanks.values()) {
    const d = Math.hypot(m.position.x - px, m.position.z - pz);
    if (d < bestD && Math.abs(m.position.y - feet) < 4) { best = m; bestD = d; }
  }
  return best;
}
function toggleCar() {
  if (drivingCart) return exitCart();
  if (drivingTank) return exitTank();
  if (drivingPlane) return exitPlane();
  if (drivingCar) return exitCar();
  if (camMode !== "first" || !inGame) return;
  const cart = nearestCart();
  if (cart) return enterCart(cart);
  const tank = nearestTank();
  if (tank) return enterTank(tank);
  const plane = nearestPlane();
  if (plane) return enterPlane(plane);
  const best = nearestCar();
  if (!best) return;
  drivingCar = best;
  carVy = 0;
  carYaw = best.rotation.y;
  carV = { x: 0, z: 0 };
  camMode = "car";
  crouching = true;  // другим игрокам видно, что ты сидишь
}

function exitCar() {
  if (!drivingCar) return;
  nitroOn = false;
  const m = drivingCar;
  drivingCar = null;
  // Выходим вбок от машины
  const side = m.userData.edit.bus ? 3.4 : 2.2;  // у автобуса выходим у правой двери
  px = m.position.x + Math.cos(carYaw) * side;
  pz = m.position.z - Math.sin(carYaw) * side;
  feet = Math.max(m.position.y, groundHeight(px, m.position.y + 1, pz));
  vy = 0;
  crouching = false;
  scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR;
  yaw = carYaw;
  if (camMode === "car") camMode = "first";
}

// Отлетающие машины: считает тот, кто врезался, остальные видят их через обычную рассылку машин
const flung = new Map();
const planes = new Map();
const tanks = new Map();
const balls = new Map();
function launchCar(m, vx, vz, speed) {
  const k = 0.3 + speed / 60;
  flung.set(m, { vx: vx * k, vz: vz * k, vy: 3 + speed * 0.25, spin: (Math.random() - 0.5) * 5, air: 0, send: 0 });
}
function updateFlying(dt) {
  for (const [m, f] of flung) {
    let { x, y, z } = m.position;
    if (!hitsBlock(x + f.vx * dt, y + 0.2, z, 1)) x += f.vx * dt; else f.vx *= -0.3;
    if (!hitsBlock(x, y + 0.2, z + f.vz * dt, 1)) z += f.vz * dt; else f.vz *= -0.3;
    f.vy -= 18 * dt;
    const air = Math.exp(-0.8 * dt);

    if (y <= ground) { y = ground; f.vy = f.vy < -3 ? -f.vy * 0.3 : 0; const g = Math.exp(-3 * dt); f.vx *= g; f.vz *= g; f.spin *= g; }
    f.air = y > ground + 0.05 ? f.air + dt : 0;
    m.position.set(x, y, z);
    m.rotation.y += f.spin * dt;
    m.rotation.z = y > ground + 0.05 ? Math.sin(f.air * 4) * 0.25 : 0;
    const e = m.userData.edit;
    Object.assign(e, { x: +x.toFixed(2), y: +y.toFixed(2), z: +z.toFixed(2), yaw: +m.rotation.y.toFixed(2) });
    f.send -= dt;
    const done = Math.hypot(f.vx, f.vz) < 0.3 && y <= ground + 0.01 && Math.abs(f.vy) < 0.1;
    if (done || f.send <= 0) { f.send = 0.125; online?.sendEdits([e]); }
    if (done) { m.rotation.z = 0; flung.delete(m); }
  }
}

// Животные: каждое ходит само (мозг считает тот, кто его поставил), от игроков убегает, собака идёт за ближним игроком
function updateAnimals(dt) {
  const players = [{ x: px, z: pz }, ...[...others.values()].filter(a => a.group.visible).map(a => ({ x: a.group.position.x, z: a.group.position.z }))];
  for (const m of animals.values()) {
    const s = m.userData.sim, e = m.userData.edit, A = ANIMALS[e.t], p = m.position;
    if (!s.owned) {
      const t = m.userData.target;
      if (t) {
        const k = Math.min(1, dt * 8);
        m.position.set(p.x + (t.x - p.x) * k, p.y + (t.y - p.y) * k, p.z + (t.z - p.z) * k);
        m.rotation.y += Math.atan2(Math.sin(t.yaw - m.rotation.y), Math.cos(t.yaw - m.rotation.y)) * k;
      }
      continue;
    }
    if (Math.hypot(p.x - px, p.z - pz) > 90) continue;  // далеко от игрока — стоит
    let near = null, nd = 1e9;
    for (const q of players) { const d = Math.hypot(q.x - p.x, q.z - p.z); if (d < nd) { nd = d; near = q; } }
    let speed = 0;
    s.timer -= dt;
    if (e.t === "dog" && near && nd < 14) {  // собака идёт к игроку и держится рядом
      if (nd > 2.6) { s.heading = Math.atan2(-(near.x - p.x), -(near.z - p.z)); speed = A.speed * (nd > 6 ? 2 : 1); }
    } else if (e.t !== "dog" && near && nd < 4.5) {  // остальные убегают
      s.heading = Math.atan2(-(p.x - near.x), -(p.z - near.z)); speed = A.speed * 2.3; s.timer = 0.5;
    } else {
      if (s.timer <= 0) {
        if (Math.random() < 0.4) { s.walk = 0; s.timer = 1.5 + Math.random() * 3; }
        else { s.walk = 1; s.heading = Math.random() * Math.PI * 2; s.timer = 2 + Math.random() * 3; }
      }
      speed = s.walk ? A.speed : 0;
    }
    if (speed) {
      const dx = -Math.sin(s.heading) * speed * dt, dz = -Math.cos(s.heading) * speed * dt;
      let moved = false;
      if (!hitsBlock(p.x + dx, p.y + 0.1, p.z, A.h)) { p.x += dx; moved = true; }
      if (!hitsBlock(p.x, p.y + 0.1, p.z + dz, A.h)) { p.z += dz; moved = true; }
      if (!moved) { s.heading += Math.PI * (0.5 + Math.random() * 0.5); s.timer = 1; }
      m.rotation.y += Math.atan2(Math.sin(s.heading - m.rotation.y), Math.cos(s.heading - m.rotation.y)) * Math.min(1, dt * 8);
      s.bob += dt * speed * 6;
    }
    // Земля: падаем с обрыва, поднимаемся на ступеньку
    const g = groundHeight(p.x, p.y + 0.3, p.z);
    if (p.y > g + 0.02) { s.vy -= 25 * dt; p.y = Math.max(g, p.y + s.vy * dt); if (p.y <= g) s.vy = 0; }
    else { p.y = g; s.vy = 0; }
    if (p.y < -DEPTH - 10) { share(undo(e)); continue; }
    m.rotation.z = speed ? Math.sin(s.bob) * 0.07 : 0;  // покачивается при ходьбе
    const was = s.moving; s.moving = !!speed;
    Object.assign(e, { x: +p.x.toFixed(2), y: +(p.y).toFixed(2), z: +p.z.toFixed(2), yaw: +m.rotation.y.toFixed(2), o: myId });
    s.send -= dt;
    if ((speed && s.send <= 0) || (was && !speed)) { s.send = 0.25; online?.sendEdits([e]); }
  }
}

// Шарики «Верити»: физика считается у того, кто толкнул шарик последним, остальные видят его через рассылку
let ballPx = 0, ballPz = 0;
function rollBall(m, dx, dz) {
  const len = Math.hypot(dx, dz);
  if (len > 1e-5) m.rotateOnWorldAxis(new THREE.Vector3(dz, 0, -dx).normalize(), len / m.userData.r);
}
function updateBalls(dt) {
  const pvx = (px - ballPx) / Math.max(dt, 1e-3), pvz = (pz - ballPz) / Math.max(dt, 1e-3);
  ballPx = px; ballPz = pz;
  for (const m of balls.values()) {
    const s = m.userData.sim, e = m.userData.edit, R = m.userData.r;
    if (!s.owned) {
      const t = m.userData.target;
      if (t) {
        const nx = m.position.x + (t.x - m.position.x) * Math.min(1, dt * 12), nz = m.position.z + (t.z - m.position.z) * Math.min(1, dt * 12);
        rollBall(m, nx - m.position.x, nz - m.position.z);
        m.position.set(nx, m.position.y + (t.y - m.position.y) * Math.min(1, dt * 12), nz);
      }
    }
    const p = m.position;
    // Толчок от игрока (ходьба) и от машины
    let pushX = 0, pushZ = 0, kickY = 0;
    const dx = p.x - px, dz = p.z - pz, d = Math.hypot(dx, dz);
    if (!dead && camMode !== "car" && d < R + RADIUS && p.y + R > feet && p.y - R < feet + HEIGHT) {
      const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0, rel = pvx * nx + pvz * nz;
      if (rel > 0.3) { pushX = nx * (rel * 1.3 + 1.5); pushZ = nz * (rel * 1.3 + 1.5); kickY = rel > 3 ? 2.5 : 0; }
      p.x += nx * (R + RADIUS - d); p.z += nz * (R + RADIUS - d);
    }
    if (drivingCar) {
      const cx = p.x - drivingCar.position.x, cz = p.z - drivingCar.position.z, cd = Math.hypot(cx, cz), sp = Math.hypot(carV.x, carV.z);
      if (cd < 1.5 + R && sp > 1 && Math.abs(p.y - drivingCar.position.y) < 1.5) { pushX = carV.x * 1.2 + (cx / cd) * 2; pushZ = carV.z * 1.2 + (cz / cd) * 2; kickY = 3; }
    }
    if (pushX || pushZ) {
      if (!s.owned) { s.owned = true; s.vx = s.vy = s.vz = 0; }
      s.vx = pushX; s.vz = pushZ; s.vy = Math.max(s.vy, kickY);
      s.moving = true;
    }
    if (!s.owned || !s.moving) continue;
    // Свои движения: гравитация, стены, пол, трение
    const air = Math.exp(-0.2 * dt);
    s.vx *= air; s.vz *= air; s.vy -= 20 * dt;
    const ox = p.x, oz = p.z;
    if (!hitsBlock(p.x + s.vx * dt, p.y - 0.3, p.z, 0.6)) p.x += s.vx * dt; else s.vx *= -0.6;
    if (!hitsBlock(p.x, p.y - 0.3, p.z + s.vz * dt, 0.6)) p.z += s.vz * dt; else s.vz *= -0.6;
    p.y += s.vy * dt;
    if (s.vy > 0 && hitsBlock(p.x, p.y + 0.3, p.z, 0.2)) s.vy *= -0.4;
    const ground = groundHeight(p.x, p.y - R + 0.3, p.z);
    let onGround = false;
    if (p.y - R <= ground) {
      p.y = ground + R; onGround = true;
      s.vy = s.vy < -2 ? -s.vy * 0.65 : 0;
      const g = Math.exp(-0.7 * dt); s.vx *= g; s.vz *= g;
    }
    rollBall(m, p.x - ox, p.z - oz);
    const rest = onGround && s.vy === 0 && Math.hypot(s.vx, s.vz) < 0.08;
    if (rest) { s.vx = s.vz = 0; s.moving = false; }
    Object.assign(e, { x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2), o: myId });
    s.send -= dt;
    if (rest || s.send <= 0) { s.send = 0.125; online?.sendEdits([e]); }
  }
}

// Танк: W/S — вперёд/назад, A/D — поворот корпуса, мышь (палец) — башня и ствол, ЛКМ или пробел — выстрел, E — выйти
let tankYaw = 0, tankSpeed = 0, tankFireAt = 0;
function poseTank(m, hullYaw, turretYaw, pitchUp) {
  m.rotation.y = hullYaw;
  m.userData.turret.rotation.y = turretYaw - hullYaw;
  m.userData.barrel.rotation.x = pitchUp;
}
function enterTank(m) {

  yaw = tankYaw; pitch = 0;
  camMode = "car";
  addChat(TOUCH ? "* танк: джойстик — ехать, палец — башня, ПРЫЖОК — выстрел" : "* танк: W/S — ехать, A/D — корпус, мышь — башня, ЛКМ или пробел — выстрел, E — выйти");
}

}
function fireTank() {
  const m = drivingTank, now = performance.now();
  if (!m || now < tankFireAt) return;
  tankFireAt = now + 1500;
  const tu = yaw, bp = Math.max(-0.25, Math.min(0.7, pitch));
  const dir = new THREE.Vector3(-Math.sin(tu) * Math.cos(bp), Math.sin(bp), -Math.cos(tu) * Math.cos(bp));
  const o = new THREE.Vector3(m.position.x, m.position.y + 2.0, m.position.z).addScaledVector(dir, 3.6);
  spawnRocket(o, dir, true, TANK_SHELL);
  online?.fx({ t: "rocket", o: o.toArray().map(v => +v.toFixed(2)), d: dir.toArray().map(v => +v.toFixed(3)), tank: 1 });
  tankSpeed -= 3;  // отдача
  addExplosion(o, 1.2);
}
function updateTank(dt) {
  const m = drivingTank;
  const throttle = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;
  const steer = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
  tankYaw -= steer * 1.1 * dt;
  tankSpeed += throttle * 9 * dt;
  if (!throttle) tankSpeed -= tankSpeed * Math.min(1, 3 * dt);
  tankSpeed = Math.max(-4, Math.min(8, tankSpeed));
  const f = [-Math.sin(tankYaw), -Math.cos(tankYaw)], r = [Math.cos(tankYaw), -Math.sin(tankYaw)], y = m.position.y;
  const blocked = (cx, cz) => [[0, 0], [2.3, 0], [-2.3, 0], [0, 1.3], [0, -1.3], [2.2, 1.2], [2.2, -1.2], [-2.2, 1.2], [-2.2, -1.2]]
    .some(([a, b]) => hitsSolid(cx + f[0] * a + r[0] * b, y, cz + f[1] * a + r[1] * b, 1.2));
  let x = m.position.x, z = m.position.z;
  const dx = f[0] * tankSpeed * dt, dz = f[1] * tankSpeed * dt;
  if (!blocked(x + dx, z)) x += dx; else tankSpeed *= 0.5;
  if (!blocked(x, z + dz)) z += dz; else tankSpeed *= 0.5;
  m.position.set(x, groundHeight(x, y, z), z);
  poseTank(m, tankYaw, yaw, Math.max(-0.25, Math.min(0.7, pitch)));
  Object.assign(m.userData.edit, { x: +x.toFixed(2), y: +m.position.y.toFixed(2), z: +z.toFixed(2), yaw: +tankYaw.toFixed(2), tu: +yaw.toFixed(2), bp: +m.userData.barrel.rotation.x.toFixed(2) });
  px = x; pz = z; feet = m.position.y;
  if (keys.Space) fireTank();
  // Камера за башней, куда смотрит ствол
  const head = new THREE.Vector3(x, m.position.y + 3, z), back = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), 0.15 - Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).normalize();
  camRay.set(head, back);
  camRay.far = 10;
  const hit = castSolids(camRay, true, m)[0];
  camera.position.copy(head).addScaledVector(back, hit ? Math.max(1, hit.distance - 0.3) : 10);
  camera.rotation.set(pitch, yaw, 0);
  scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR;
}

// Самолёт: A/D — поворот, W — нос вверх, S — вниз, пробел — сбросить ТНТ, E — выйти
let planeYaw = 0, planePitch = 0, planeRoll = 0, planeBombAt = 0;
const bombQueue = []; let bombSendAt = 0;
// Бомбы уходят остальным пачкой (до 6 штук в одном сообщении), а не по одной
function flushBombs() {
  if (bombQueue.length) online?.fx({ t: "tnts", l: bombQueue.splice(0, 8) });
  bombSendAt = performance.now() + 200;
}
function enterPlane(m) {
  drivingPlane = m;
  planeYaw = m.rotation.y; planePitch = m.userData.edit.pt || 0; planeRoll = 0;
  yaw = planeYaw; pitch = planePitch;
  camMode = "car";
  vy = 0;
  addChat(TOUCH ? "* самолёт: палец по экрану — куда лететь, джойстик вверх/вниз — высота, ПРЫЖОК — бомба" : "* самолёт: мышь — куда лететь, W/S — вверх/вниз, A/D — поворот, пробел — бомба, E — выйти");
}
function exitPlane() {
  const m = drivingPlane;
  if (!m) return;
  flushBombs();
  drivingPlane = null;
  // Самолёт садится на землю там, где его бросили; игрок выходит рядом
  const ground = groundHeight(m.position.x, m.position.y, m.position.z);
  m.position.y = ground + 0.8; planePitch = planeRoll = 0;
  m.rotation.set(0, planeYaw, 0);
  Object.assign(m.userData.edit, { y: +m.position.y.toFixed(2), pt: 0, rl: 0, yaw: +planeYaw.toFixed(2) });
  online?.sendEdits([m.userData.edit]);
  px = m.position.x + Math.cos(planeYaw) * 5; pz = m.position.z - Math.sin(planeYaw) * 5;
  feet = groundHeight(px, m.position.y + 1, pz); vy = 0;
  scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR;
  yaw = planeYaw;
  if (camMode === "car") camMode = "first";
}
function updatePlane(dt) {
  const m = drivingPlane;
  const steer = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
  const nose = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;  // >0 — нос вверх (W или джойстик вверх)
  // Мышь (палец) задаёт, куда лететь: самолёт плавно разворачивается за прицелом. A/D и W/S тоже двигают прицел
  yaw -= steer * 1.1 * dt;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + nose * 1.0 * dt));
  const dyaw = Math.atan2(Math.sin(yaw - planeYaw), Math.cos(yaw - planeYaw));
  planeYaw += dyaw * Math.min(1, dt * 2.5);
  planePitch += (pitch - planePitch) * Math.min(1, dt * 2.5);
  planeRoll += (Math.max(-0.9, Math.min(0.9, dyaw * 1.2)) - planeRoll) * Math.min(1, dt * 4);
  const speed = Math.max(12, 22 - 10 * Math.sin(planePitch));
  const dir = new THREE.Vector3(-Math.sin(planeYaw) * Math.cos(planePitch), Math.sin(planePitch), -Math.cos(planeYaw) * Math.cos(planePitch));
  let { x, y, z } = m.position;
  if (!hitsBlock(x + dir.x * speed * dt, y - 0.3, z, 1)) x += dir.x * speed * dt;
  if (!hitsBlock(x, y - 0.3, z + dir.z * speed * dt, 1)) z += dir.z * speed * dt;
  if (!hitsBlock(x, y + dir.y * speed * dt - 0.3, z, 1)) y += dir.y * speed * dt;
  const ground = groundHeight(x, y, z) + 0.8;
  if (y < ground) { y = ground; if (planePitch < 0) planePitch = 0; }
  m.position.set(x, y, z);
  m.rotation.set(planePitch, planeYaw, planeRoll);
  Object.assign(m.userData.edit, { x: +x.toFixed(2), y: +y.toFixed(2), z: +z.toFixed(2), yaw: +planeYaw.toFixed(2), pt: +planePitch.toFixed(2), rl: +planeRoll.toFixed(2) });
  px = x; pz = z; feet = y;
  if (bombQueue.length && performance.now() > bombSendAt) flushBombs();
  // Бомба: падает вместе с самолётом и взрывается при ударе
  if (keys.Space && performance.now() > planeBombAt) {
    planeBombAt = performance.now() + 80;  // почти без паузы: зажал пробел — сыплются одна за другой
    const v = [dir.x * speed, dir.y * speed - 2, dir.z * speed], bx = x, by = y - 1.1, bz = z;
    startPrimed(bx, by, bz, 8, true, v, true);

  camRay.set(head, back);
  camRay.far = 14;
  const hit = castSolids(camRay, true, m)[0];
  camera.position.copy(head).addScaledVector(back, hit ? Math.max(1, hit.distance - 0.3) : 14);
  camera.lookAt(x + dir.x * 8, y + dir.y * 8 + 1, z + dir.z * 8);
  scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR;
}

function updateCar(dt) {
  const m = drivingCar;
  const throttle = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;
  const steer = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
  const hand = !!keys.Space;
  const dirs = () => [[-Math.sin(carYaw), -Math.cos(carYaw)], [Math.cos(carYaw), -Math.sin(carYaw)]];  // вперёд и вправо
  let [f, r] = dirs();
  // Руль работает, только пока машина едет; ручник поворачивает резче
  const vf0 = carV.x * f[0] + carV.z * f[1];
  const bus = !!m.userData.edit.bus;  // автобус: тяжелее, медленнее и поворачивает плавнее
  carYaw -= steer * (bus ? 1.1 : 1.9) * Math.max(-1, Math.min(1, vf0 / 6)) * (hand ? 1.4 : 1) * dt;
  [f, r] = dirs();
  // Скорость остаётся прежней, а нос повернулся: часть скорости оказывается "вбок" — это и есть занос
  let vf = carV.x * f[0] + carV.z * f[1], vl = carV.x * r[0] + carV.z * r[1];
  nitroOn = !!(keys.ShiftLeft || keys.ShiftRight) && throttle > 0;  // нитро на Shift: сильнее разгон и выше потолок скорости
  const iceUnder = blocks.get(key(Math.floor(m.position.x), Math.floor(m.position.y - 0.1), Math.floor(m.position.z)))?.userData.edit.k === "ice";  // лёд: мало сцепления
  vf += throttle * (bus ? (nitroOn ? 16 : 8) : nitroOn ? 34 : 14) * (iceUnder ? 0.6 : 1) * dt;
  if (!throttle) vf -= vf * Math.min(1, (iceUnder ? 0.15 : 1.2) * dt);
  vf = Math.max(-6, Math.min(bus ? (nitroOn ? 24 : 15) : nitroOn ? 40 : 24, vf));
  vl *= Math.exp(-(hand ? 1 : iceUnder ? 0.5 : 8) * dt);  // обычно колёса держат вбок, с ручником — скользят
