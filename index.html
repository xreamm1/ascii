  if (a.startsWith("tpto:")) {
    const t = others.get(a.slice(5))?.target;
    if (t) { px = t.x; feet = t.y; pz = t.z; vy = 0; }
  }
  if (a.startsWith("sz-:") || a.startsWith("sz+:")) {
    const id = a.slice(4), cur = SIZES.indexOf(others.get(id)?.size || 1);
    const next = SIZES[Math.min(SIZES.length - 1, Math.max(0, cur + (a[2] === "+" ? 1 : -1)))];
    online?.setSize(id, next);
  }
  if (a.startsWith("tpme:")) { online?.summon(a.slice(5)); addChat(`* ${others.get(a.slice(5))?.nick} вызван к тебе`); }
  if (a.startsWith("pre:")) {
    const id = a.slice(4);
    ask("ПРЕФИКС (- УБРАТЬ)", prefixes[id] || "", 12).then(t => t && online?.setPrefix(id, t === "-" ? "" : t));
  }
  if (a.startsWith("kick:")) { online?.kick(a.slice(5)); addChat(`* ${others.get(a.slice(5))?.nick} кикнут`); }
  if (a.startsWith("ban:")) { online?.ban(a.slice(4)); addChat(`* ${others.get(a.slice(4))?.nick} забанен в лобби`); }
  drawAdmin();
});

// Плавно двигаем чужие фигурки к последним присланным позициям, ставим ники над головами
// и 8 раз в секунду шлём свою позицию
// Ник над головой фигурки: точка над головой → координаты на экране.
// За спиной, за краем экрана или далеко ник прячем
function placeLabel(label, pos, visible, h = 2) {
  const p = pos.clone();
  p.y += h;
  const far = p.distanceTo(camera.position) > 40;
  p.project(camera);
  const screen = renderer.domElement.getBoundingClientRect();
  label.style.display = !visible || far || p.z > 1 || Math.abs(p.x) > 1 || Math.abs(p.y) > 1 ? "none" : "block";
  label.style.left = screen.left + (p.x + 1) / 2 * screen.width + "px";
  label.style.top = screen.top + (1 - p.y) / 2 * screen.height + "px";
}

function updateOnline(dt) {
  const k = Math.min(1, dt * 12);
  for (const a of others.values()) {
    const bx = a.group.position.x, bz = a.group.position.z;
    a.group.position.lerp(a.target, k);
    rollFigure(a.group, a.group.position.x - bx, a.group.position.z - bz);
    if (a.drone?.visible) a.drone.position.lerp(a.droneTarget, k);
    const turn = Math.atan2(Math.sin(a.yaw - a.group.rotation.y), Math.cos(a.yaw - a.group.rotation.y));
    a.group.rotation.y += turn * k;

    placeLabel(a.label, a.group.position, !a.invis && !a.group.userData.cull?.hidden, 2 * (a.size || 1));
  }
  for (const m of cars.values()) {
    const t = m.userData.target;
    if (!t || m === drivingCar || flung.has(m)) continue;
    m.position.lerp(new THREE.Vector3(t.x, t.y, t.z), k);
    m.rotation.y += Math.atan2(Math.sin(t.yaw - m.rotation.y), Math.cos(t.yaw - m.rotation.y)) * k;
  }
  for (const m of planes.values()) {
    const t = m.userData.target;
    if (!t || m === drivingPlane) continue;
    m.position.lerp(new THREE.Vector3(t.x, t.y, t.z), k);
    m.rotation.y += Math.atan2(Math.sin(t.yaw - m.rotation.y), Math.cos(t.yaw - m.rotation.y)) * k;
    m.rotation.x += ((t.pt || 0) - m.rotation.x) * k; m.rotation.z += ((t.rl || 0) - m.rotation.z) * k;
  }
  for (const m of tanks.values()) {
    const t = m.userData.target;
    if (!t || m === drivingTank) continue;
    m.position.lerp(new THREE.Vector3(t.x, t.y, t.z), k);
    const turretAbs = m.userData.turret.rotation.y + m.rotation.y;
    m.rotation.y += Math.atan2(Math.sin(t.yaw - m.rotation.y), Math.cos(t.yaw - m.rotation.y)) * k;
    const nt = turretAbs + Math.atan2(Math.sin((t.tu ?? t.yaw) - turretAbs), Math.cos((t.tu ?? t.yaw) - turretAbs)) * k;
    m.userData.turret.rotation.y = nt - m.rotation.y;
    m.userData.barrel.rotation.x += ((t.bp || 0) - m.userData.barrel.rotation.x) * k;
  }
  poseTimer += dt;
  if (online && !idle && poseTimer > (online.poseEvery || 1 / 8)) {
    poseTimer = 0;
    online.sendPose();
    // Транспорт под тобой: шлём, только если он сдвинулся (стоящая машина ничего не отправляет)
    for (const v of [drivingCar, drivingPlane, drivingTank, drivingCart]) {
      if (!v) continue;
      const json = JSON.stringify(v.userData.edit);
      if (json !== v.userData.sent) { v.userData.sent = json; online.sendEdits([v.userData.edit]); }
    }
  }
}

// ---------- Неактивный игрок: 5 минут без действий (свернул вкладку или отошёл) — отключаемся от Firebase ----------
// Место в лобби освобождается (сервер сам убирает отключившегося), трафик не тратится. Любое действие — подключаемся снова
const IDLE_MS = 5 * 60 * 1000;
let idle = false, lastInput = Date.now();
function markActive() {
  lastInput = Date.now();
  if (!idle) return;
  idle = false;
  online?.wake?.();
  addChat("* снова в сети");
}
for (const ev of ["keydown", "pointerdown", "mousemove", "touchstart", "wheel"]) addEventListener(ev, markActive, { passive: true, capture: true });
document.addEventListener("visibilitychange", () => { if (!document.hidden) markActive(); });
// В свёрнутой вкладке браузер редко будит таймеры (раз в минуту), поэтому проверяем по часам, а не считаем тики
setInterval(() => {
  if (idle || !inGame || !online?.sleep || Date.now() - lastInput < IDLE_MS) return;
  idle = true;
  online.sleep();
  addChat(TOUCH ? "* 5 минут без действий — отключились от сервера. Коснись экрана, чтобы вернуться" : "* 5 минут без действий — отключились от сервера. Шевельни мышью, чтобы вернуться");
}, 10000);

const menuEl = document.getElementById("menu");
const lobbyEl = document.getElementById("lobby");
let menuScreen = "main";   // "main", "online", "mode" (выбор режима), "worlds", "newworld", "settings", "help"
let worldList = null, wdelArmed = null;  // свои миры (null — ещё грузятся) и какой мир ждёт второго нажатия «удалить»
function refreshWorlds() {
  worldList = null;
  listWorlds().then(l => { worldList = l; if (menuScreen === "worlds") drawMenu(); }, () => { worldList = []; showNote("хранилище миров недоступно"); });
}
let pendingMode = null;    // что делаем после выбора режима: "single" — одиночная игра, "create" — создаём лобби
let pendingNature = false;  // лобби или игра без интернета с бесконечной природой

let stopLobbyList = null;  // отписка от обновлений списка лобби
let menuNote = "";         // подсказка внизу: "загрузка…", ошибки

// Всё, что пришло из сети (названия лобби), экранируем, прежде чем вставить в HTML меню
const esc = t => String(t).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// Кнопки и строки окон. Текст вида «[ готово ]» показываем без скобок
const unbracket = t => String(t).replace(/^\[\s*|\s*\]$/g, "");
const gbtn = (text, act, cls = "", attr = "data-a") => `<span class="gb ${attr === "data-a" ? "act " : ""}${cls}" ${attr}="${esc(act)}">${esc(unbracket(text))}</span>`;
const mbtn = (text, act, cls = "") => gbtn(text, act, "item " + cls, "data-act");
const glabel = t => `<div class="gl">${esc(t)}</div>`;
const gsep = (t = "") => `<div class="gs">${esc(t)}</div>`;
const gtitle = (t, cls = "") => `<div class="gt ${cls}">${esc(t)}</div>`;

function drawMenu() {
  let h = "";
  const note = menuNote ? `<div class="gl note">${esc(menuNote)}</div>` : "";
  if (menuScreen === "main") {
    h = gtitle("BASEPLATE", "big") + mbtn("ОДИНОЧНАЯ ИГРА", "single", "big") + mbtn("СЕТЕВАЯ ИГРА", "online", "big") + mbtn("ИГРА БЕЗ ИНТЕРНЕТА", "p2p", "big") +
      mbtn(`ГРАФИКА: ${gfxName()}`, "gfx") + (requestFullscreen ? mbtn("ПОЛНЫЙ ЭКРАН", "fullscreen") : "") + mbtn("НАСТРОЙКИ", "settings") + mbtn("УПРАВЛЕНИЕ", "help") + note;
  } else if (menuScreen === "settings") {
    h = settingsHtml(mbtn);
  } else if (menuScreen === "help") {
    h = helpHtml(mbtn);
  } else if (menuScreen === "worlds") {
    h = gtitle("МОИ МИРЫ") + mbtn("НОВЫЙ МИР", "newworld", "big");
    if (!worldList) h += glabel("загрузка…");
    else if (!worldList.length) h += glabel("миров пока нет — создай первый");
    for (const w of worldList || []) {
      const kind = w.res ? "выживание" : w.mode === "survival" ? "HP" : "творческий";
      const text = `${String(w.name).slice(0, 18)} · ${kind} · ${new Date(w.updated).toLocaleDateString()}`;
      h += `<div class="lobbyrow">${mbtn(text, "play:" + w.id)}${mbtn("имя", "wren:" + w.id, "small")}${mbtn(wdelArmed === w.id ? "точно?" : "×", "wdel:" + w.id, "small warn")}</div>`;
    }
    h += note + mbtn("НАЗАД", "back");
  } else if (menuScreen === "newworld") {
    h = gtitle("НОВЫЙ МИР") + mbtn("ВЫЖИВАНИЕ", "nw:survival", "big") + glabel("природа, добыча, крафт, HP: всё надо добыть самому") +
      mbtn("ТВОРЧЕСКИЙ", "nw:creative", "big") + glabel("плоский мир, все предметы, урона нет") +
      mbtn("ТВОРЧЕСКИЙ С ПРИРОДОЙ", "nw:creative-nature") + glabel("холмы, деревья, животные и все предметы") +
      mbtn("ОБЫЧНЫЙ (ТОЛЬКО HP)", "nw:hp") + glabel("плоский мир, все предметы, можно погибнуть") + mbtn("НАЗАД", "worlds");
  } else if (menuScreen === "p2p") {
    h = gtitle("БЕЗ ИНТЕРНЕТА") + glabel("Игра вдвоём и больше напрямую, интернет не нужен (можно в самолёте).") + mbtn("СОЗДАТЬ ИГРУ", "p2phost", "big") + mbtn("ПОДКЛЮЧИТЬСЯ К ДРУГУ", "p2pjoin", "big") +
      glabel("Нужна общая сеть: хотспот одного телефона или его Bluetooth-модем. Подробнее в README.") + note + mbtn("НАЗАД", "back");
  } else if (menuScreen === "mode") {
    h = gtitle("РЕЖИМ ИГРЫ") + mbtn("ТВОРЧЕСКИЙ", "mode:creative", "big") + glabel("строй и летай, урона нет") + mbtn("ОБЫЧНЫЙ", "mode:survival", "big") + glabel("есть HP, можно погибнуть") +
      mbtn(`ПРИРОДА: ${pendingNature ? "ДА" : "НЕТ"}`, "nature") + glabel(pendingNature ? "бесконечный мир: холмы, деревья, пещеры с рудой" : "плоская плита, как раньше") + mbtn("НАЗАД", "backmode");
  } else {
    h = gtitle("СЕТЕВАЯ ИГРА") + `<div class="gg"><span class="gl">Ник: ${esc(nick)}</span>${mbtn("сменить", "nick", "small")}</div>`;
    if (!FIREBASE_CONFIG) h += glabel("Сетевая игра ещё не настроена: нужны настройки Firebase.");
    else {
      h += (isDev ? mbtn("СОЗДАТЬ ЛОББИ", "create", "big") : "") + mbtn("ВОЙТИ ПО КОДУ", "code") + gsep("ЛОББИ");
      if (!lobbyList.length) h += glabel("пока пусто — создай своё лобби");
      const canDelete = isDev;  // кнопки только у вошедшего по паролю; сервер всё равно проверит
      for (const l of lobbyList) {
        const text = `${l.code}  ${l.name.slice(0, 16)}${l.nature ? "  природа" : ""}  ${l.players} чел.  ${ACCESS_NAME[l.access]}`;
        h += `<div class="lobbyrow">${mbtn(text, "join:" + l.code)}${canDelete ? mbtn("имя", "ren:" + l.code, "small") + mbtn("доступ", "acc:" + l.code, "small") + mbtn("×", "del:" + l.code, "small warn") : ""}</div>`;

menuEl.addEventListener("click", e => {
  const act = e.target.closest(".item")?.dataset.act;
  if (!act || typing) return;
  if (act === "single" || act === "worlds") { menuScreen = "worlds"; menuNote = ""; refreshWorlds(); }
  if (act === "newworld") menuScreen = "newworld";
  if (act === "nature") pendingNature = !pendingNature;
  if (act.startsWith("nw:")) createWorld(act.slice(3)).catch(() => showNote("не удалось создать мир"));
  const world = worldList?.find(w => w.id === act.slice(5));
  if (act.startsWith("play:") && world) playWorld(world);
  if (act.startsWith("wren:") && world) ask("НАЗВАНИЕ МИРА", world.name, 24).then(n => n && renameWorld(world, n).then(refreshWorlds));
  if (act.startsWith("wdel:")) {  // удаление — по второму нажатию
    const id = act.slice(5);
    if (wdelArmed === id) { wdelArmed = null; deleteWorld(id).then(refreshWorlds, () => showNote("не удалось удалить мир")); }
    else { wdelArmed = id; setTimeout(() => { if (wdelArmed === id) { wdelArmed = null; drawMenu(); } }, 4000); }
  }
  if (act === "settings" || act === "help") menuScreen = act;
  if (act === "setback" || act === "helpclose") menuScreen = "main";
  applySetting(act);
  if (act === "backmode") menuScreen = pendingMode === "create" ? "online" : pendingMode === "p2phost" ? "p2p" : "main";
  if (act === "p2p") { menuScreen = "p2p"; menuNote = ""; }
  if (act === "p2phost") { menuScreen = "mode"; pendingMode = "p2phost"; }
  if (act === "p2pjoin") p2pJoin();
  if (act.startsWith("mode:")) {
    const m = act.slice(5);
    if (pendingMode === "single") { gameMode = m; startGame(); }
    else if (pendingMode === "p2phost") p2pHost(m);
    else createLobby(m).catch(err => showNote(err.message.length < 38 ? err.message : "не удалось создать лобби"));
  }
  if (act === "gfx") toggleGfx();
  if (act === "fullscreen") toggleFullscreen();
  if (act === "online") { menuScreen = "online"; menuNote = ""; watchLobbies(); }
  if (act === "back") { menuScreen = "main"; stopLobbyList?.(); stopLobbyList = null; menuNote = ""; }
  if (act === "nick") changeNick().then(() => { stopLobbyList?.(); stopLobbyList = null; isDev = false; drawMenu(); watchLobbies(); });
  if (act === "create") { menuScreen = "mode"; pendingMode = "create"; }
  if (act === "code") ask("КОД ЛОББИ", "", 4).then(c => c && enterLobby(c));
  if (act.startsWith("join:")) enterLobby(act.slice(5));
  if (act.startsWith("del:")) confirmDeleteLobby(act.slice(4));
  if (act.startsWith("ren:") || act.startsWith("acc:")) {
    const l = lobbyList.find(x => x.code === act.slice(4));
    if (l) (act.startsWith("ren:") ? renameLobby(l.code, l.name) : patchLobby(l.code, { access: nextAccess(l.access) }))
      ?.catch(err => showNote(err.message.length < 38 ? err.message : "не вышло: обнови правила базы"));
  }
  drawMenu();
});

function showNote(text) {
  menuNote = text;
  drawMenu();
}

// Список лобби обновляется сам: сверху те, где сейчас больше всего игроков
async function watchLobbies() {
  if (!FIREBASE_CONFIG || stopLobbyList) return;
  showNote("загрузка…");
  try {
    // Входим заранее: разработчику нужен пароль, а админов лобби узнаём по своему id
    let me = null;
    try { me = await signIn(); } catch (err) { showNote(err.message.length < 38 ? err.message : "не удалось войти"); }
    drawMenu();
    const { db, ref, get, query, orderByChild, limitToLast, onValue } = await loadFirebase();
    let seq = 0;
    stopLobbyList = onValue(query(ref(db, "lobbyInfo"), orderByChild("created"), limitToLast(20)), async snap => {
      const mine = ++seq, all = [];
      snap.forEach(l => {
        const v = l.val();
        all.push({ code: l.key, nature: v.nature === true, name: String(v.name || l.key), players: Object.keys(v.online || {}).length, access: ACCESS.includes(v.access) ? v.access : "all" });
      });
      // «Только я» видит один разработчик, «админы» — разработчик и админы этого лобби, обычные — все
      const seen = await Promise.all(all.map(async l => {
        if (l.access === "all" || isDev) return true;
        if (l.access === "dev" || !me) return false;
        return get(ref(db, `admins/${l.code}/${me}`)).then(x => x.exists(), () => false);
      }));
      if (mine !== seq) return;
      lobbyList = all.filter((_, i) => seen[i]).sort((a, b) => b.players - a.players).slice(0, 8);
      if (!inGame) showNote("");
    }, () => showNote("нет связи с сервером"));
  } catch {
    showNote("не удалось загрузить Firebase");
  }
}

async function createLobby(mode) {
  const me = await signIn();
  if (!isDev) throw new Error("создавать лобби: только разработчик");
  const name = await ask("НАЗВАНИЕ ЛОББИ", `Лобби ${nick}`, 22);
  if (!name) return;
  const { db, ref, update, get } = await loadFirebase();
  // Код из 4 символов без похожих друг на друга (нет O/0, I/1)
  const ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code;
  do code = Array.from({ length: 4 }, () => ABC[Math.floor(Math.random() * ABC.length)]).join("");
  while ((await get(ref(db, `lobbyInfo/${code}`))).exists());
  // update пишет поля по отдельности — так их проверяют правила базы
  const seed = Math.floor(Math.random() * 1e9);
  await update(ref(db, `lobbyInfo/${code}`), { name, created: Date.now(), mode, access: "all", ...(pendingNature ? { nature: true, seed } : {}) });
  gameMode = mode;
  startGame(code, name, me);
  if (pendingNature) setInfinite(true, null, seed, true);
}

// Удаляет лобби целиком: название, игроков, постройки, чат, кики, баны и объявление.
// Правила базы разрешают это только аккаунту разработчика
async function deleteLobby(code) {
  await signIn();
  if (!isDev) throw new Error("удалять лобби может только разработчик");
  const { db, ref, remove } = await loadFirebase();
  // Удаляем каждый раздел отдельно: если сервер что-то не даст, будет видно, что именно
  const parts = ["players", "world", "chat", "kicks", "bans", "announce", "admins", "prefixes", "tp", "troll", "gods", "sizes", "hits", "fx", "lobbyInfo"];
  const results = await Promise.allSettled(parts.map(part => remove(ref(db, `${part}/${code}`))));
  const denied = parts.filter((_, i) => results[i].status === "rejected");
  if (denied.length) throw new Error(`сервер не дал удалить: ${denied.join(", ")} — обнови правила базы`);
}

function confirmDeleteLobby(code) {
  return deleteLobby(code).then(
    () => showNote(`лобби ${code} удалено`),
    // Длинное объяснение — в чат (в игре) или в подсказку меню, по кусочку на строку
    err => inGame ? addChat("* " + err.message) : showNote(err.message));
}

async function enterLobby(code) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!code) return;
  showNote("подключаюсь…");
  try {
    const me = await signIn();
    const { db, ref, get } = await loadFirebase();
    const info = await get(ref(db, `lobbyInfo/${code}`));
    if (!info.exists()) return showNote(`лобби ${code} не найдено`);
    const access = ACCESS.includes(info.val().access) ? info.val().access : "all";
    if (access === "dev" && !isDev) return showNote("это лобби только для разработчика");
    if (access === "admins" && !isDev && !(await get(ref(db, `admins/${code}/${me}`))).exists()) return showNote("это лобби только для админов");
    gameMode = info.val().mode === "survival" ? "survival" : "creative";  // у старых лобби режима нет — они творческие
    startGame(code, String(info.val().name || code), me);
    if (info.val().nature === true && Number.isFinite(info.val().seed)) setInfinite(true, null, info.val().seed, true);
  } catch (err) {
    showNote(err.message.length < 38 ? err.message : "нет связи с сервером");
  }
}

// code не задан — одиночная игра
let lobbyCode = null;  // код лобби, в котором сейчас игра (null — одиночная игра)
let lobbyName = "", lobbyAccess = "all";
// Кто может войти: все, разработчик и админы, только разработчик
const ACCESS = ["all", "admins", "dev"];
const ACCESS_NAME = { all: "все", admins: "админы", dev: "только я" };
const nextAccess = a => ACCESS[(ACCESS.indexOf(a) + 1) % ACCESS.length];
// Название и доступ меняет только разработчик: правила базы остальным не дадут
async function patchLobby(code, patch) {
  await signIn();
  if (!isDev) throw new Error("это может только разработчик");
  const { db, ref, update } = await loadFirebase();
  await update(ref(db, `lobbyInfo/${code}`), patch);

  if (!u || !p || !f || !c.length) throw new Error("не удалось получить адрес устройства: включи хотспот или Bluetooth-модем");
  return JSON.stringify({ k: desc.type === "offer" ? "o" : "a", u, p, f: f.replace(/:/g, ""), c });

function unpackSignal(text) {

  if (!d || !d.u || !d.p || !/^[0-9A-Fa-f]{64}$/.test(d.f) || !Array.isArray(d.c)) throw new Error("это не код соединения");
  const fp = d.f.match(/../g).join(":").toUpperCase();

// Новое соединение. У хозяина id гостя выдаём мы (g1…g3), у гостя хозяин всегда "host"
function p2pAddPeer(link, fixedId) {
  const host = p2p.role === "host";
  const id = fixedId || ["g1", "g2", "g3"].find(i => !p2p.peers.has(i));
  const peer = { dc: link.dc, fast: link.fast, pc: link.pc, bots: new Set() };
  p2p.peers.set(id, peer);
  const onmsg = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (!m || typeof m.t !== "string") return;
    if (host) {
      if (!P2P_FROM_GUEST.has(m.t)) return;
      m.from = id;  // от кого — знаем мы, а не отправитель
      // Метку разработчика и префикс гость сам себе не выдаёт: разработчик тут только хозяин, префиксы раздаёт он же
      if (m.t === "chat") { m.dev = false; m.pre = prefixes[id] || null; }
      if (m.t === "pose") {
        if (typeof m.id !== "string" || !m.p || typeof m.p !== "object") return;
        m.p.dev = false;
        if (isNpc(m.id)) {
          m.id = m.id.slice(0, 24);
          // Ботов хозяина и других гостей не трогаем: гость водит только своих
          if (bots.has(m.id) || [...p2p.peers.values()].some(pr => pr !== peer && pr.bots.has(m.id))) return;
          peer.bots.add(m.id);
        } else m.id = id;
      }
      if (m.t === "gone" && !(typeof m.id === "string" && peer.bots.has(m.id.slice(0, 24)))) return;  // убрать можно только своего бота
      if (m.to && m.to !== "host") {  // адресное сообщение другому гостю
        if (m.t === "hit") { const to = p2p.peers.get(m.to); if (to) p2pSendTo(to, m); }
        return;
      }
    } else if (typeof m.from !== "string") m.from = "host";
    p2pHandle(m, m.from);
    if (host && P2P_RELAY.has(m.t)) p2pOut(m, m.t === "pose", id);
  };
  link.dc.onmessage = onmsg;
  if (link.fast) link.fast.onmessage = onmsg;
  else if (link.pc) link.pc.ondatachannel = e => { if (e.channel.label === "fast") { peer.fast = e.channel; e.channel.onmessage = onmsg; } };  // быстрый канал мог прийти позже надёжного
  const onclose = () => {
    if (p2p.peers.get(id) !== peer) return;
    p2p.peers.delete(id);
    if (host) {
      addChat("* друг отключился");
      for (const g of [id, ...peer.bots]) { poseSent.delete(g); poseCache.delete(g); removeAvatar(g); p2pOut({ t: "gone", id: g }); }
    } else {
      addChat("* связь с хозяином потеряна");
      for (const g of [...others.keys()]) removeAvatar(g);
      online = null;
    }
  };
  link.dc.onclose = onclose;
  if (link.pc) link.pc.onconnectionstatechange = () => { if (["failed", "closed"].includes(link.pc.connectionState)) onclose(); };
  if (host) {
    const send = (type, list) => { for (let i = 0; i < list.length; i += 150) p2pSendTo(peer, { t: type, l: list.slice(i, i + 150) }); };
    p2pSendTo(peer, { t: "hello", mode: gameMode, id, ...(gen ? { seed: gen.seed } : {}) });
    if (banned.size) p2pSendTo(peer, { t: "ban", l: [...banned] });
    const list = [...new Set(solids.map(m => m.userData.edit).filter(e => e && !isTerr(e) && !e.tr)), ...[...dug].map(k => k.split(",").map(Number)).map(([x, y, z]) => ({ op: "dig", x, y, z }))];
    send("edits", list);  // мир хозяина — только новому другу
    poseSent.clear();
    p2pOut({ t: "needfull" });  // остальные пришлют позы целиком, чтобы новичок увидел всех
  }
}

function buildHell() {

// Проверяем каждую запись из файла: берём только известные поля, id заводим свои, чтобы не пересеклись с чужими
const KIND_SET = new Set([...Object.values(KINDS).filter(Boolean), "flat", "portal", ...Object.values(RS_ITEMS).map(i => i.k)]);
const num = (...v) => v.every(Number.isFinite);

// Правка из сети (Firebase или друг без интернета): проверяем форму, чтобы кривая или подделанная запись
// не ломала мир (NaN в координатах, чужие поля не того типа). Лишние поля не вырезаем — только отбрасываем негодное
const NET_OPS = new Set(["block", "unblock", "dig", "undig", "text", "untext", "plank", "unplank", "car", "uncar", "plane", "unplane", "tank", "untank", "animal", "unanimal", "ball", "unball", "cart", "uncart", "item", "unitem", "mined"]);
const netCell = v => Number.isInteger(v) && Math.abs(v) < 1e6;
const netId = v => typeof v === "string" && v.length > 0 && v.length <= 64;
const optNum = (...v) => v.every(x => x === undefined || Number.isFinite(x));
function validEdit(e) {
  if (!e || typeof e !== "object" || !NET_OPS.has(e.op)) return false;
  if (!dimsValid(e)) return false;
  if (e.c !== undefined && !(Number.isInteger(e.c) && e.c >= 0 && e.c < COLORS.length)) return false;
  switch (e.op) {
    case "block": return [e.x, e.y, e.z].every(netCell) && (e.k === undefined || KIND_SET.has(e.k)) && (e.r === undefined || (Number.isInteger(e.r) && e.r >= 0 && e.r < 4));
    case "unblock": case "dig": case "undig": case "mined": return [e.x, e.y, e.z].every(netCell);
    case "text": return netId(e.id) && typeof e.text === "string" && Array.isArray(e.p) && e.p.length === 3 && num(...e.p) && Array.isArray(e.q) && e.q.length === 4 && num(...e.q);
    case "plank": return netId(e.id) && Array.isArray(e.ends) && e.ends.length === 6 && num(...e.ends);
    case "car": return netId(e.id) && num(e.x, e.y, e.z, e.yaw);
    case "plane": return netId(e.id) && num(e.x, e.y, e.z) && optNum(e.yaw, e.pt, e.rl);
    case "tank": return netId(e.id) && num(e.x, e.y, e.z) && optNum(e.yaw, e.tu, e.bp);
    case "animal": case "ball": case "cart": return netId(e.id) && num(e.x, e.y, e.z) && optNum(e.yaw);
    case "item": return netId(e.id) && num(e.x, e.y, e.z) && optNum(e.vx, e.vy, e.vz) && ITEMS.includes(e.n) && (e.k === undefined || (Number.isInteger(e.k) && e.k > 0 && e.k < 10000));
    default: return netId(e.id);  // un… — убрать предмет по id
  }
}
// Применить правку из сети. Ошибку не глотаем молча: в консоли видно, какая запись её вызвала
function netEdit(e, replace = false) {
  if (!validEdit(e)) return console.warn("пропущена неверная правка из сети", e);
  try { edit(e, replace); } catch (err) { console.warn("правка из сети не применилась", e, err); }
}
const newId = () => `${myId}-${idCount++}`;
function cleanEdit(e) {
  if (!e || typeof e !== "object") return null;
  const c = Number.isInteger(e.c) && e.c >= 0 && e.c < COLORS.length ? e.c : 0;
  if (e.op === "block") {
    if (![e.x, e.y, e.z].every(v => Number.isInteger(v) && Math.abs(v) < 5000) || e.y < 0) return null;
    const out = { op: "block", x: e.x, y: e.y, z: e.z, c };
    if (e.k !== undefined) { if (!KIND_SET.has(e.k)) return null; out.k = e.k; }
    if (Number.isInteger(e.r) && e.r >= 0 && e.r < 4) out.r = e.r;
    if (e.k === "door" || e.k === "barrier") out.open = e.open === true;
    if (e.k === "door" && e.i === 1) out.i = 1;
    for (const f of ["a", "f"]) if (Number.isInteger(e[f]) && e[f] >= 0 && e[f] < 6) out[f] = e[f];
    if (e.on === true) out.on = true;
    if (Number.isInteger(e.d) && e.d >= 1 && e.d <= 4) out.d = e.d;
    if (e.m === 1) out.m = 1;
    if (Number.isInteger(e.n) && e.n >= 0 && e.n < 25) out.n = e.n;
    if (e.dim !== undefined) { if(!dimsValid(e))return null; out.dim=[...e.dim]; }
    if (typeof e.by === "string" && e.by.length<=128) out.by=e.by;
    if (e.p === true && (!online || isDev)) out.p = true;  // прочный блок в сети ставит только разработчик: иначе база отклонит весь кусок импорта
    return out;
  }
  if (e.op === "dig" && [e.x, e.y, e.z].every(Number.isInteger) && e.y >= -DEPTH && e.y <= -1 && inDigArea(e.x, e.z)) return { op: "dig", x: e.x, y: e.y, z: e.z };
  if (e.op === "plank" && Array.isArray(e.ends) && e.ends.length === 6 && num(...e.ends)) return { op: "plank", id: newId(), ends: e.ends, c };
  if (e.op === "text" && typeof e.text === "string" && Array.isArray(e.p) && e.p.length === 3 && num(...e.p) && Array.isArray(e.q) && e.q.length === 4 && num(...e.q))
    return { op: "text", id: newId(), p: e.p, q: e.q, text: e.text.slice(0, 40), c };
  if (e.op === "animal" && ANIMALS[e.t] && num(e.x, e.y, e.z)) return { op: "animal", id: newId(), t: e.t, x: e.x, y: e.y, z: e.z, yaw: Number.isFinite(e.yaw) ? e.yaw : 0, o: myId };
  if (e.op === "ball" && num(e.x, e.y, e.z)) return { op: "ball", id: newId(), t: BALL_TYPES[e.t] ? e.t : "verity", x: e.x, y: e.y, z: e.z, yaw: Number.isFinite(e.yaw) ? e.yaw : 0, o: myId };
  if (e.op === "cart" && num(e.x, e.y, e.z)) return { op: "cart", id: newId(), x: e.x, y: e.y, z: e.z, yaw: Number.isFinite(e.yaw) ? e.yaw : 0, o: myId };
  if (e.op === "car" && num(e.x, e.y, e.z, e.yaw)) return { op: "car", id: newId(), x: e.x, y: e.y, z: e.z, yaw: e.yaw, c, ...(e.bus === 1 ? { bus: 1 } : {}) };
  return null;
}

// Мир добавляется к тому, что уже есть (занятые клетки не трогаем). Создаём кусками, чтобы игра не зависла
function importWorld(text) {
  let data;
  try { data = JSON.parse(text); } catch { return addChat("* это не файл мира"); }
  if (data?.format !== "baseAscii" || !Array.isArray(data.edits)) return addChat("* это не файл мира .baseAscii");
  const list = data.edits.slice(0, MAX_WORLD).map(cleanEdit).filter(Boolean);
  const skipped = data.edits.length - list.length;
  addChat(`* импорт: ${list.length} предметов${skipped ? `, пропущено ${skipped}` : ""}`);
  let i = 0;
  (function chunk() {
    const part = list.slice(i, i += 400), placed = [];
    for (const e of part) {
      // Занятые клетки не трогаем ни у себя, ни в базе: раньше в сетевой игре импорт перезаписывал чужие блоки
      if (e.op === "block" && (blocks.has(key(e.x, e.y, e.z)) || occupiedExtra(e))) continue;
      if (e.op === "dig" && dug.has(`${e.x},${e.y},${e.z}`)) continue;
      try { edit(e); placed.push(e); } catch (err) { console.warn("предмет из файла не встал", e, err); }
    }
    online?.sendEdits(placed);
    if (i < list.length) setTimeout(chunk, online ? 250 : 16); else addChat("* мир импортирован");
  })();
}

// ---------- Схематика (как Litematica): схема из .baseAscii показывается призраком в мире, видно, чего не хватает; клавиша M, только разработчик ----------
const schemEl = document.getElementById("schem");
const schem = { list: [], name: "", ox: 0, oy: 0, oz: 0, rot: 0, show: true, layer: -1, miss: 0, wrong: 0, mesh: null, cells: [], h: 0, timer: 0 };
const schemFileEl = Object.assign(document.createElement("input"), { type: "file", hidden: true });
document.body.append(schemFileEl);
const schemAllowed = () => !online || isDev;
const ROT_DIR = { 0: 4, 4: 1, 1: 5, 5: 0 };  // поворот на 90°: +x → +z → −x → −z
// Блоки схемы в мире: поворачиваем вокруг вертикали и сдвигаем так, чтобы угол схемы стоял в (ox, oy, oz)
function schemCells() {
  const src = schem.list;
  if (!src.length) return [];
  const minx = Math.min(...src.map(e => e.x)), miny = Math.min(...src.map(e => e.y)), minz = Math.min(...src.map(e => e.z));
  const rot = (x, z) => { for (let i = 0; i < schem.rot; i++) [x, z] = [-z, x]; return [x, z]; };
  const moved = src.map(e => { const [x, z] = rot(e.x - minx, e.z - minz); return { e, x, y: e.y - miny, z }; });
  const mx = Math.min(...moved.map(m => m.x)), mz = Math.min(...moved.map(m => m.z));
  schem.h = Math.max(...moved.map(m => m.y)) + 1;
  return moved.map(({ e, x, y, z }) => {
    const n = { ...e, x: schem.ox + x - mx, y: schem.oy + y, z: schem.oz + z - mz };
    for (let i = 0; i < schem.rot; i++) { if (n.r !== undefined) n.r = (n.r + 1) % 4; for (const f of ["f", "a"]) if (n[f] !== undefined && n[f] in ROT_DIR) n[f] = ROT_DIR[n[f]]; }
    return n;
  });
}
const schemSame = (have, want) => have.k === want.k && (want.k?.startsWith("rs_") || (have.c | 0) === (want.c | 0));
function schemRefresh() {
  schem.cells = schemCells();
  const n = schem.cells.length;
  if (!schem.mesh || schem.mesh.instanceMatrix.count < n) {
    if (schem.mesh) { scene.remove(schem.mesh); schem.mesh.dispose(); }
    schem.mesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.4, depthWrite: false }), Math.max(n, 1));
    schem.mesh.frustumCulled = false;
    schem.mesh.renderOrder = 5;
    scene.add(schem.mesh);
  }
  const mesh = schem.mesh, m4 = new THREE.Matrix4(), col = new THREE.Color();
  let shown = 0, miss = 0, wrong = 0;
  schem.cells.forEach((c, i) => {
    const have = rsAt(c.x, c.y, c.z) ?? blocks.get(key(c.x, c.y, c.z))?.userData.edit;
    const state = !have ? 1 : schemSame(have, c) ? 0 : 2;
    c.state = state;
    if (state === 1) miss++; else if (state === 2) wrong++;
    if (!state || !schem.show || (schem.layer >= 0 && c.y !== schem.oy + schem.layer)) return;
    m4.makeScale(0.94, 0.94, 0.94).setPosition(c.x + 0.5, c.y + 0.5, c.z + 0.5);
    mesh.setMatrixAt(shown, m4);
    mesh.setColorAt(shown, col.set(state === 1 ? 0x3a8bff : 0xff3a3a));
    shown++;
  });
  schem.miss = miss; schem.wrong = wrong;
  mesh.count = shown;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.visible = schem.show && shown > 0;
}
function updateSchem(dt) {
  if (!schem.list.length) return;
  schem.timer -= dt;
  if (schem.timer > 0) return;
  schem.timer = panel === schemEl ? 0.5 : 1.5;
  schemRefresh();
  if (panel === schemEl) drawSchem();
}
function schemLoad(text, name) {
  let data;
  try { data = JSON.parse(text); } catch { return addChat("* это не файл схемы"); }
  if (data?.format !== "baseAscii" || !Array.isArray(data.edits)) return addChat("* это не файл схемы .baseAscii");
  schem.list = data.edits.slice(0, MAX_WORLD).map(cleanEdit).filter(e => e && e.op === "block");
  if (!schem.list.length) return addChat("* в схеме нет блоков");
  schem.name = name; schem.rot = 0; schem.layer = -1; schem.show = true;
  schemPlace();
  addChat(`* схема «${name}»: ${schem.list.length} блоков. M — панель`);
}
// Угол схемы встаёт туда, куда смотришь (или под ноги)
function schemPlace() {
  const hit = aim();
  const cell = hit && !isTerr(hit.object.userData.edit ?? {}) ? blockCell(hit) : null;
  [schem.ox, schem.oy, schem.oz] = cell ?? [Math.floor(px), Math.max(0, Math.floor(feet)), Math.floor(pz)];
  schemRefresh();
}
function schemBuild(fixWrong) {
  if (!schemAllowed()) return;
  const edits = [];
  for (const c of schem.cells) {
    if (!c.state || (c.state === 2 && !fixWrong)) continue;
    if (c.state === 2) { const old = blocks.get(key(c.x, c.y, c.z))?.userData.edit; if (old && !isTerr(old)) edits.push(undo(old)); }
    const { state, ...clean } = c;
    edits.push(clean);
  }
  if (!edits.length) return addChat("* строить нечего");
  addChat(`* строю: ${edits.length}`);
  let i = 0;
  (function chunk() {
    const part = edits.slice(i, i += 400);
    for (const e of part) try { edit(e); } catch {}
    online?.sendEdits(part);
    if (i < edits.length) setTimeout(chunk, online ? 250 : 16); else { addChat("* готово"); schemRefresh(); }
  })();
}
function schemMaterials() {
  const names = {};
  for (const [n, k] of Object.entries(KINDS)) if (k) names[k] = n;
  for (const [n, it] of Object.entries(RS_ITEMS)) names[it.k] = n;
  const count = new Map();
  for (const c of schem.cells) if (c.state) { const n = names[c.k] ?? (c.k === "flat" ? "Блок (гладкий)" : "Блок"); count.set(n, (count.get(n) || 0) + 1); }
  if (!count.size) return addChat("* всё на месте");
  addChat("* не хватает: " + [...count].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([n, v]) => `${n} ×${v}`).join(", "));
}
function drawSchem() {
  const act = (a, t) => `<span class="sact" data-a="${a}">${t}</span>`;
  schemEl.innerHTML = `<div class="invt">СХЕМАТИКА (M)</div>
<div>${schem.list.length ? `${schem.name}: ${schem.list.length} блоков, не хватает ${schem.miss}, не те ${schem.wrong}` : "схема не загружена"}</div>
<div>${act("load", "[ загрузить схему ]")} ${act("clear", "[ убрать ]")}</div>
<div>${act("place", "[ поставить сюда: куда смотришь ]")}</div>
<div>место: x ${schem.ox}, y ${schem.oy}, z ${schem.oz}</div>
<div>сдвиг: ${act("m:x-", "[x−]")} ${act("m:x+", "[x+]")} ${act("m:y-", "[y−]")} ${act("m:y+", "[y+]")} ${act("m:z-", "[z−]")} ${act("m:z+", "[z+]")}</div>
<div>${act("rot", "[ повернуть ]")} поворот ${schem.rot * 90}°</div>
<div>слой: ${act("l-", "[−]")} ${schem.layer < 0 ? "все" : schem.layer + 1 + " из " + schem.h} ${act("l+", "[+]")}   ${act("show", `[ показ: ${schem.show ? "да" : "нет"} ]`)}</div>
<div>${act("mat", "[ чего не хватает → чат ]")}</div>
<div>${act("build", "[ достроить недостающее ]")}</div>
<div>${act("fix", "[ достроить и заменить неправильное ]")}</div>
<div class="invhint">M — закрыть. Синее — нет блока, красное — стоит не тот</div><span class="xbtn">✕</span>`;
}
function toggleSchem() {
  if (!schemAllowed()) return addChat("* схематика только у разработчика");
  togglePanel(schemEl, drawSchem);
}
schemEl.addEventListener("click", e => {
  const a = e.target.closest(".sact")?.dataset.a;
  if (!a) return;
  if (a === "load") schemFileEl.click();
  else if (a === "clear") { schem.list = []; schem.cells = []; if (schem.mesh) schem.mesh.visible = false; schem.miss = schem.wrong = 0; }
  else if (a === "place") { if (schem.list.length) { const hit = aim(); const cell = hit ? blockCell(hit) : null; [schem.ox, schem.oy, schem.oz] = cell ?? [Math.floor(px), Math.max(0, Math.floor(feet)), Math.floor(pz)]; schemRefresh(); } }
  else if (a.startsWith("m:")) { const v = a[2] === "x" ? "ox" : a[2] === "y" ? "oy" : "oz"; schem[v] += a[3] === "+" ? 1 : -1; schemRefresh(); }
  else if (a === "rot") { schem.rot = (schem.rot + 1) % 4; schemRefresh(); }
  else if (a === "l-") { schem.layer = Math.max(-1, schem.layer - 1); schemRefresh(); }
  else if (a === "l+") { schem.layer = Math.min(schem.h - 1, schem.layer + 1); schemRefresh(); }
  else if (a === "show") { schem.show = !schem.show; schemRefresh(); }
  else if (a === "mat") schemMaterials();
  else if (a === "build") schemBuild(false);
  else if (a === "fix") schemBuild(true);
  drawSchem();
});
schemFileEl.addEventListener("change", () => {
  const file = schemFileEl.files[0];
  schemFileEl.value = "";
  if (file) file.text().then(t => { schemLoad(t, file.name.replace(/\.baseascii$/i, "")); drawSchem(); }, () => addChat("* не удалось прочитать файл"));
});

  const a = e.target.closest(".act")?.dataset.a;
  if(a==="assist")return toggleAssist();
  if(a?.startsWith("ruler:"))return rulerAction(a.slice(6));
  if (a?.startsWith("smelt:")) return smelt(a.slice(6));
  if (a === "resume") toggleGameMenu();
  if (a === "gfx") { toggleGfx(); drawGameMenu(); }
  if (a === "export") exportWorld();
  if (a === "import") worldFileEl.click();
  if (a === "exit") saveWorld().finally(() => leave(""));  // свой мир сначала сохраняем
  if (a === "settings" || a === "help") { gameScreen = a; drawGameMenu(); }
  if (a === "setback" || a === "helpclose") { gameScreen = "main"; drawGameMenu(); }
  if (a && applySetting(a)) drawGameMenu();
  if (a === "saveworld") saveWorld(true);
  if (a === "addfriend") p2pAddGuest();
  if (a === "invite" && lobbyCode) {
    const url = `${location.origin}${location.pathname}?lobby=${lobbyCode}`;
    navigator.clipboard?.writeText(url).then(() => addChat("* ссылка скопирована"), () => addChat("* не удалось скопировать — возьми ссылку из чата"));
    addChat(url);
  }
  if (a === "renlobby" && lobbyCode) renameLobby(lobbyCode, lobbyName)?.catch(() => addChat("* не вышло: обнови правила базы в Firebase"));
  if (a === "acclobby" && lobbyCode) patchLobby(lobbyCode, { access: nextAccess(lobbyAccess) }).catch(() => addChat("* не вышло: обнови правила базы в Firebase"));
});

// Модели собраны из десятков частей. Материалы: 0 — металл, 1 — тёмный пластик и воронёная сталь, 2 — дерево и кожа, 3 — светлая сталь (клинки, линзы).
// У всех оружий ствол или клинок смотрит в -z, начало координат — у рукояти.

const zcyl = (r, len, x, y, z, mat, seg = 16) => [new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2), x, y, z, mat];
// Конус вдоль z: rFront — радиус у переднего (-z) конца, rBack — у заднего
const zcone = (rFront, rBack, len, x, y, z, mat, seg = 16) => [new THREE.CylinderGeometry(rBack, rFront, len, seg).rotateX(Math.PI / 2), x, y, z, mat];
const xcyl = (r, len, x, y, z, mat) => [new THREE.CylinderGeometry(r, r, len, 10).rotateZ(Math.PI / 2), x, y, z, mat];
const ring = (r, tube, x, y, z, mat) => [new THREE.TorusGeometry(r, tube, 6, 18), x, y, z, mat];
const sph = (r, x, y, z, mat, sx = 1, sy = 1, sz = 1) => [new THREE.SphereGeometry(r, 12, 10).scale(sx, sy, sz), x, y, z, mat];
const rbox = (w, h, d, x, y, z, rx, mat) => [new THREE.BoxGeometry(w, h, d).rotateX(rx), x, y, z, mat];
const blade = (w, len, z, mat) => [new THREE.ConeGeometry(w * 0.72, len, 4).rotateY(Math.PI / 4).rotateX(-Math.PI / 2).scale(1, 0.2, 1), 0, 0, z, mat];
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i));

// --- Урон по игрокам. Тело другого игрока — коробка вокруг его фигурки
const shotRay = new THREE.Raycaster();
const tmpV = new THREE.Vector3();
const tmpBox = new THREE.Box3();
function bodyBox(a) {
  const bt = a.group.userData.lookType && BALL_TYPES[a.group.userData.lookType];
  const p = a.group.position, w = (bt ? bt.hbR + 0.02 : 0.35) * (a.size || 1), h = (bt ? bt.hbH + 0.06 : 1.9) * a.group.scale.y;
  return tmpBox.set(new THREE.Vector3(p.x - w, p.y, p.z - w), new THREE.Vector3(p.x + w, p.y + h, p.z + w));
}
// Кого и куда задел луч: ближайший игрок, не закрытый стеной. Возвращает { target: { id, a, dist, point, head } | null, wallDist }
function rayTarget(origin, dir, rangeLen) {
  shotRay.set(origin, dir);
  shotRay.far = rangeLen;
  const wall = castSolids(shotRay, false)[0];
  const wallDist = wall ? wall.distance : rangeLen;
  let best = null;
  for (const [id, a] of others) {
    if (!a.group.visible) continue;
    const pt = shotRay.ray.intersectBox(bodyBox(a), tmpV);
    if (!pt) continue;
    const dist = origin.distanceTo(pt);
    if (dist < wallDist && (!best || dist < best.dist)) {
      best = { id, a, dist, point: pt.clone(), head: pt.y > a.group.position.y + 1.45 * a.group.scale.y };
    }
  }
  return { target: best, wallDist };
}

const camDir = () => new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

function startReload() {
  const n = currentWeapon(), W = n && WEAPONS[n];
  if (!W || W.kind === "melee" || reloadEnd || ammo[n] >= W.mag) return;
  reloadEnd = performance.now() / 1000 + W.reload;
  reloadName = n;
  scoped = false;
}

function tryFire() {
  const n = currentWeapon();
  if (!n || dead || camMode !== "first" || menuOpen || typing || !inGame) return;
  const W = WEAPONS[n], now = performance.now() / 1000;
  if (W.dev && online && !isDev) return addChat("* это оружие только у разработчика");
  if (itemBanned(n)) return;
  if (now < nextShot || reloadEnd) return;
  if (W.kind !== "melee" && ammo[n] <= 0 && !W.inf) return startReload();
  nextShot = now + W.cd;
  if (W.kind === "melee") { swing = 1; meleeHit(n, W); return; }
  if (!W.inf) ammo[n]--;  // у некоторых предметов патроны бесконечные
  kick = 1;
  if (W.kind === "gun") fireGun(n, W); else if (W.kind === "rocket") fireRocket(n, W); else throwGrenade(n, W);
  if (ammo[n] <= 0 && !W.inf) startReload();
}

function meleeHit(n, W) {
  const { target } = rayTarget(camera.position.clone(), camDir(), W.range);
  const an = rayAnimal(camera.position.clone(), camDir(), Math.min(W.range, target ? target.dist : Infinity));
  if (an) return hurtAnimal(an.m, W.dmg);
  if (target) { hitPlayer(target.id, W.dmg, n, false); addImpact(target.point); }
}

function fireGun(n, W) {
  const o = camera.position.clone();
  const spread = W.scope && !scoped ? 0.05 : W.spread;
  const from = o.clone().addScaledVector(camDir(), 0.8).add(new THREE.Vector3(0.12, -0.1, 0).applyQuaternion(camera.quaternion));
  const dmgById = new Map(), ends = [];
  for (let i = 0; i < (W.pellets || 1); i++) {
    const dir = camDir();
    dir.x += (Math.random() - 0.5) * spread * 2; dir.y += (Math.random() - 0.5) * spread * 2; dir.z += (Math.random() - 0.5) * spread * 2;
    dir.normalize();
    const { target, wallDist } = rayTarget(o, dir, W.range);
    const an = rayAnimal(o, dir, Math.min(wallDist, target ? target.dist : Infinity, W.range));
    const end = o.clone().addScaledVector(dir, an ? an.dist : target ? target.dist : Math.min(wallDist, W.range));
    ends.push(end);
    spawnTracer(from, end);
    if (an) { hurtAnimal(an.m, W.dmg); continue; }
    if (target) {
      const d = target.head ? W.dmg * 2 : W.dmg, prev = dmgById.get(target.id);
      dmgById.set(target.id, { dmg: (prev?.dmg || 0) + d, head: prev?.head || target.head });
      addImpact(target.point);
    } else if (wallDist < W.range) addImpact(end);
  }
  for (const [id, h] of dmgById) hitPlayer(id, h.dmg, n, h.head);
  online?.fx({ t: "shot", o: from.toArray().map(v => +v.toFixed(2)), ps: ends.slice(0, 4).map(e => e.toArray().map(v => +v.toFixed(2))) });
  // Отдача: ствол подбрасывает вверх и чуть в сторону
  pitch = Math.min(Math.PI / 2 - 0.01, pitch + W.kick);
  yaw += (Math.random() - 0.5) * W.kick * 0.6;
}

// --- Ракеты и гранаты: летят и взрываются
const rockets = [];
function spawnRocket(o, dir, own, W) {

function fireRocket(n, W) {

function spawnGrenade(o, vel, own, W) {

  mesh.position.copy(o);
  scene.add(mesh);

}
function throwGrenade(n, W) {

  vel.y += 3;

}
// Точка внутри чего-то твёрдого: пол, блок, машина
function solidPoint(p) {
  if (p.y < 0.05 && p.y >= 0 && p.x <= HELL_BORDER && !topDug(Math.floor(p.x), Math.floor(p.z))) return true;
  const cx = Math.floor(p.x), cy = Math.floor(p.y), cz = Math.floor(p.z);
  if (cellBlocks(cx, cy, cz, p.x, p.z)) return true;
  const top = lowTop(cx, cy, cz, p.x, p.z);
  return (top !== null && p.y < top) || carHits(p.x, p.y - 0.1, p.z, 0.2);
}
function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.life -= dt;
    let boom = r.life <= 0;
    if (r.vel) {  // граната: падает по дуге и отскакивает от стен и пола
      r.vel.y -= 22 * dt;
      for (const axis of ["x", "y", "z"]) {
        const test = r.mesh.position.clone();
        test[axis] += r.vel[axis] * dt;
        if (solidPoint(test)) { r.vel[axis] *= -0.45; if (axis === "y") { r.vel.x *= 0.75; r.vel.z *= 0.75; } }
        else r.mesh.position[axis] = test[axis];
      }
      r.mesh.rotation.x += r.spin.x * dt; r.mesh.rotation.y += r.spin.y * dt; r.mesh.rotation.z += r.spin.z * dt;
    } else {
      const steps = Math.ceil(r.W.speed * dt / 0.4);
      for (let s = 0; s < steps && !boom; s++) {
        r.mesh.position.addScaledVector(r.dir, r.W.speed * dt / steps);
        boom = solidPoint(r.mesh.position) || [...others.values()].some(a => a.group.visible && bodyBox(a).containsPoint(r.mesh.position));
      }
    }
    if (boom) { scene.remove(r.mesh); rockets.splice(i, 1); rocketBoom(r.mesh.position.clone(), r.own, r.W); }
  }
}
// ТНТ: огниво поджигает блок, он превращается в мигающий заряд и через пару секунд взрывается. Рядом стоящие ТНТ детонируют цепочкой.
// Мир ломает тот, кто поджёг (остальные получают изменения через общий мир), а картинку взрыва и урон каждый считает у себя
const TNT_R = 4.5, TNT_DMG = 70;
const primed = [];
const shieldTex = canvasTexture(16, 16, ctx => {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 16, 16);
  ctx.fillStyle = "#b020ff"; ctx.fillRect(0, 0, 8, 8); ctx.fillRect(8, 8, 8, 8);
});
shieldTex.magFilter = shieldTex.minFilter = THREE.NearestFilter;
const shieldMat = new THREE.MeshLambertMaterial({ map: shieldTex });
const shields = new Set();  // пока стоит хоть один защитный блок, взрывы ничего не разрушают
const flashGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01), flashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });  // общие на все заряды
let lastCrater = 0;
function startPrimed(x, y, z, fuse, own, v, impact) {
  if (primed.length > 60) return;  // слишком много зарядов сразу — лишние не создаём
  const mesh = new THREE.Mesh(tntGeo, vmaterial(plainTex, 0));
  const flash = new THREE.Mesh(flashGeo, flashMat);  // мигает белым
  mesh.add(flash);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  primed.push({ mesh, flash, t: fuse, own, impact: !!impact, age: 0, vx: v?.[0] || 0, vy: v?.[1] || 0, vz: v?.[2] || 0 });
}
function igniteTnt(e, fuse, v) {
  if (blocks.get(key(e.x, e.y, e.z))?.userData.edit.k !== "tnt") return;
  share(undo(e));  // блока больше нет — вместо него горит заряд (его может отбросить взрывом)
  startPrimed(e.x + 0.5, e.y + 0.5, e.z + 0.5, fuse, true, v);
  online?.fx({ t: "tnt", x: e.x + 0.5, y: e.y + 0.5, z: e.z + 0.5, f: fuse, ...(v ? { v: v.map(n => +n.toFixed(2)) } : {}) });
}
function tntBoom(p, own, bomb) {
  addExplosion(p, TNT_R);
  const d = Math.hypot(px - p.x, feet + 1 - p.y, pz - p.z);
  if (d < TNT_R) damage(TNT_DMG * (1 - d / TNT_R), "ТНТ");
  if (!own) return;
  for (const [id, a] of others) {  // ботов взрыв тоже ранит (игроки получают урон у себя сами)
    const bd = a.group.position.clone().add(new THREE.Vector3(0, 0.9, 0)).distanceTo(p);
    if (id.startsWith("bot-") && bd < TNT_R) hitPlayer(id, TNT_DMG * (1 - bd / TNT_R), "ТНТ", false);
  }
  for (const m of solidsNear(p, TNT_R * 1.3)) {  // соседние ТНТ загораются
    const e = m.userData.edit;
    if (e?.k === "tnt" && m.position.distanceTo(p) < TNT_R * 1.3) {
      // Соседний ТНТ загорается и отлетает от взрыва
      const away = m.position.clone().sub(p);
      const len = Math.max(0.5, away.length());
      const k = (1.6 - len / TNT_R) * 7;
      igniteTnt(e, 1 + Math.random() * 0.6, [away.x / len * k, 4 + k * 0.5, away.z / len * k]);
    }
  }
  explode(p, TNT_R);
  // Воронка в земле. Бомбы с самолёта роют поменьше и не чаще четырёх раз в секунду — иначе слишком много работы
  if (shields.size) return;  // и землю не роют
  const nowMs = performance.now(), cr = bomb ? 3 : TNT_R;
  if (bomb && nowMs - lastCrater < 250) return;
  lastCrater = nowMs;
  const crater = [];
  const [cx, cy, cz] = [Math.floor(p.x), Math.floor(p.y), Math.floor(p.z)];
  for (let x = cx - 5; x <= cx + 5; x++) for (let y = cy - 5; y <= cy + 5; y++) for (let z = cz - 5; z <= cz + 5; z++) {
    if (y > -1 || y < -DEPTH || !inDigArea(x, z) || dug.has(`${x},${y},${z}`)) continue;
    if (Math.hypot(x + 0.5 - p.x, y + 0.5 - p.y, z + 0.5 - p.z) <= cr - 0.5) crater.push({ op: "dig", x, y, z });
  }
  for (const e of crater) edit(e);
  if (crater.length) online?.sendEdits(crater);
}
function updatePrimed(dt) {
  for (let i = primed.length - 1; i >= 0; i--) {
    const t = primed[i];
    t.t -= dt;
    t.flash.visible = Math.floor(t.t * 5) % 2 === 0;
    // Отброшенный заряд летит по дуге, бьётся о стены и катится по земле
    const p = t.mesh.position;
    t.age += dt;
    let grounded = false;
    if (t.vx || t.vy || t.vz || p.y - 0.5 > groundHeight(p.x, p.y - 0.2, p.z) + 0.01) {
      t.vy -= 20 * dt;
      if (!hitsBlock(p.x + t.vx * dt, p.y - 0.45, p.z, 0.9)) p.x += t.vx * dt; else { t.vx *= -0.3; t.hit = true; }
      if (!hitsBlock(p.x, p.y - 0.45, p.z + t.vz * dt, 0.9)) p.z += t.vz * dt; else { t.vz *= -0.3; t.hit = true; }
      p.y += t.vy * dt;
      const ground = groundHeight(p.x, p.y - 0.2, p.z);
      if (p.y - 0.5 <= ground) {
        p.y = ground + 0.5;
        grounded = true;
        t.vy = t.vy < -4 ? -t.vy * 0.3 : 0;
        const g = Math.exp(-5 * dt); t.vx *= g; t.vz *= g;
        if (Math.hypot(t.vx, t.vz) < 0.05) t.vx = t.vz = 0;
      }
    }
    if (t.impact && t.age > 0.3 && (grounded || t.hit)) t.t = 0;  // бомба взрывается при ударе
    if (t.t <= 0) { scene.remove(t.mesh); primed.splice(i, 1); tntBoom(t.mesh.position.clone(), t.own, t.impact); }
  }
}

// Взрыв: у себя ломает блоки (остальные увидят это через мир) и бьёт игроков вокруг, чем ближе — тем сильнее
// Шарик-закопатель: зарывает все выкопанные клетки рядом с тем местом, где он упал (по вертикали берёт вдвое глубже)
function fillBoom(pos, own, W) {
  addImpact(pos);
  if (!own) return;
  const list = [], R = W.radius;
  for (const k of dug) {
    const [x, y, z] = k.split(",").map(Number);
    if ((x + 0.5 - pos.x) ** 2 + (z + 0.5 - pos.z) ** 2 + ((y + 0.5 - pos.y) * 0.5) ** 2 <= R * R) list.push({ op: "undig", x, y, z });
  }
  for (const e of list) try { edit(e); } catch {}
  online?.sendEdits(list);
  addChat(list.length ? `* закопано клеток: ${list.length}` : "* тут нечего закапывать");
}
function rocketBoom(pos, own, W) {
  if (W.fill) return fillBoom(pos, own, W);
  addExplosion(pos, W.radius);
  if (!own) return;
  if (W.vit) return summonHelpers(pos);
  explode(pos, W.radius - 1);
  const hurt = (d) => W.dmg * (1 - d / W.radius);
  const me = Math.hypot(px - pos.x, feet + 1 - pos.y, pz - pos.z);
  if (me < W.radius) damage(hurt(me) * 0.6, W.kind === "grenade" ? "своей гранаты" : "своей ракеты");
  for (const [id, a] of others) {
    const d = a.group.position.clone().add(new THREE.Vector3(0, 0.9, 0)).distanceTo(pos);
    if (a.group.visible && d < W.radius) hitPlayer(id, Math.round(hurt(d)), W.kind === "grenade" ? "Граната" : "Базука", false);
  }

}

// --- Боты: ходят, строят и (боевые) стреляют, как живые игроки. Считает их тот, кто поставил; остальные видят ботов как обычных игроков (id bot-N)

// План стройки: домик, стена, башня или помост из случайных материалов; в них окна, двери, ступеньки, доски и палки. Каждый шаг — готовое изменение мира
function botPlan(b) {
  const x0 = Math.floor(b.x) + (Math.random() < 0.5 ? -1 : 1) * (4 + Math.floor(Math.random() * 4)), z0 = Math.floor(b.z) + (Math.random() < 0.5 ? -1 : 1) * (4 + Math.floor(Math.random() * 4));
  const y0 = Math.round(groundHeight(x0 + 0.5, b.f + 0.5, z0 + 0.5));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const mat = pick(BOT_MATS), c = mat ? 0 : 1 + Math.floor(Math.random() * (COLORS.length - 1)), glass = pick(["glass", "window"]), roofC = 1 + Math.floor(Math.random() * (COLORS.length - 1));

  } else if (type === 2) {  // башня с дверью и стеклянными щелями
    for (let y = 0; y < 6; y++) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      if (i === 1 && j === 1) continue;

function botPlace(b) {

    if (cells.some(k => blocks.has(key(...k)))) return;

    const bodies = [{ x: px, f: feet, z: pz }, ...[...others.values()].map(a => ({ x: a.group.position.x, f: a.group.position.y, z: a.group.position.z }))];
    if (bodies.some(o => Math.abs(e.x + 0.5 - o.x) < 0.85 && Math.abs(e.z + 0.5 - o.z) < 0.85 && e.y + 1 > o.f && e.y < o.f + 1.9)) { b.plan.list.push(q); return; }

// --- Помощники «Вкусно и точка»: ракета зовёт главного, он зовёт ещё пятерых, все строят мир из файла и исчезают.
// Блоки создаём у себя и рассылаем всем, как при импорте; сами фигурки помощников видны только у стрелявшего
const HELPER_WORLD = "worlds/vkusno-i-tochka-3-etazha.baseAscii";
const HELPER_NAME = "вкусно и точка helper";
const HELPER_SPEED = 12;  // предметов в секунду на каждого помощника
let helpers = null, helperSync = 0;

function shiftEdit(e, dx, dz) {
  if (e.op === "block" || e.op === "car") return { ...e, x: e.x + dx, z: e.z + dz };
  if (e.op === "plank" && Array.isArray(e.ends)) return { ...e, ends: e.ends.map((v, i) => i % 3 === 1 ? v : v + (i % 3 === 0 ? dx : dz)) };
  if (e.op === "text" && Array.isArray(e.p)) return { ...e, p: [e.p[0] + dx, e.p[1], e.p[2] + dz] };
  return e;
}
function makeHelper(i, pos) {
  const mat = new THREE.MeshLambertMaterial({ color: i ? 0xffc300 : 0x21a038 });
  const group = makeFigure(mat);
  group.position.copy(pos);
  const label = document.createElement("pre");
  label.className = "nick";
  label.textContent = i ? `${HELPER_NAME} ${i}` : HELPER_NAME;
  labels.append(label);
  return { group, label, target: pos.clone(), cool: 0, i };
}
async function summonHelpers(pos) {
  if (helpers) return addChat("* помощники уже строят");
  helpers = [];
  helpers.queue = [];
  let data;
  try { data = window.HELPER_WORLD_DATA ?? await (await fetch(HELPER_WORLD)).json(); } catch { helpers = null; return addChat("* не удалось загрузить файл мира для помощников"); }
  const raw = (data?.edits || []).filter(e => e && typeof e === "object");
  const blocks = raw.filter(e => e.op === "block" && Number.isFinite(e.x));
  if (!blocks.length) { helpers = null; return addChat("* в файле помощников нет предметов"); }
  const dx = Math.floor(pos.x) - Math.min(...blocks.map(e => e.x)), dz = Math.floor(pos.z) - Math.min(...blocks.map(e => e.z));
  const queue = raw.map(e => shiftEdit(e, dx, dz)).map(cleanEdit).filter(Boolean).sort((a, b) => itemY(a) - itemY(b));
  const main = makeHelper(0, pos);
  helpers.push(main);
  helpers.queue = queue;
  addChat(`* ${HELPER_NAME} появился`);
  setTimeout(() => {
    if (!helpers) return;
    for (let i = 1; i <= 5; i++) helpers.push(makeHelper(i, main.group.position.clone().add(new THREE.Vector3(Math.cos(i * 1.26) * 1.5, 0, Math.sin(i * 1.26) * 1.5))));
    addChat(`* ${HELPER_NAME} призвал ещё пятерых: ${HELPER_NAME} 1–5`);
  }, 700);
}
function updateHelpers(dt) {
  if (!helpers) return;
  const batch = [];
  for (const h of helpers) {
    h.group.position.lerp(h.target, Math.min(1, dt * 14));
    placeLabel(h.label, h.group.position, true, 2);
    h.cool -= dt;
    while (h.cool <= 0 && helpers.queue.length) {
      const e = helpers.queue.shift();
      batch.push(e);
      const at = e.op === "plank" ? e.ends : e.op === "text" ? e.p : [e.x, e.y, e.z];
      h.target.set(at[0] + 0.5, Math.max(0, itemY(e)), at[2] + 0.5);

    }
    const d = h.target.clone().sub(h.group.position);
    if (Math.hypot(d.x, d.z) > 0.3) h.group.rotation.y = Math.atan2(-d.x, -d.z);
  }
  helperSync -= dt;

  }
  for (const e of batch) try { edit(e); } catch {}
  if (batch.length) online?.sendEdits(batch);
  if (!helpers.queue.length && helpers.length > 1 && helpers.every(h => h.cool <= 0)) {
    for (const h of helpers) { addImpact(h.group.position.clone().add(new THREE.Vector3(0, 1, 0))); scene.remove(h.group); h.label.remove(); }
    helpers = null;
    online?.clearHelpers();
    addChat(`* ${HELPER_NAME} и его помощники закончили стройку и исчезли`);
  }
}

// --- Короткие эффекты: трассеры пуль, искры попаданий, вспышки взрывов
const fxList = [];
const tracerGeo = new THREE.BoxGeometry(0.02, 0.02, 1);
const tracerMat = new THREE.MeshBasicMaterial({ color: 0xfff0a0 });
function spawnTracer(from, to) {
  const m = new THREE.Mesh(tracerGeo, tracerMat);
  m.position.copy(from).add(to).multiplyScalar(0.5);

}

function addImpact(p) {
  const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: 0xffd070, transparent: true }));
  m.position.copy(p);

}
const boomGeo = new THREE.SphereGeometry(1, 12, 8);
function addExplosion(p, radius) {
  const m = new THREE.Mesh(boomGeo, new THREE.MeshBasicMaterial({ color: 0xffc060, transparent: true }));
  m.position.copy(p);
  scene.add(m);
  fxList.push({ mesh: m, life: 0.45, max: 0.45, kind: "boom", radius });
}
function updateFx(dt) {
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i];
    f.life -= dt;
    if (f.kind === "spark") { f.mesh.material.opacity = f.life / f.max; }
    if (f.kind === "boom") { const t = 1 - f.life / f.max; f.mesh.scale.setScalar(0.5 + t * f.radius); f.mesh.material.opacity = 1 - t; }
    if (f.life <= 0) { scene.remove(f.mesh); if (f.kind !== "tracer") f.mesh.material.dispose(); fxList.splice(i, 1); }
  }
}
// Выстрел, ракета или граната другого игрока (пришло по сети): только картинка, урон считает стрелявший
function handleFx(f) {
  const v3 = a => Array.isArray(a) && a.length === 3 && a.every(Number.isFinite) ? new THREE.Vector3(...a) : null;
  if (f.t === "shot" && v3(f.o)) for (const p of (f.ps || [f.p]).slice(0, 4)) if (v3(p)) spawnTracer(v3(f.o), v3(p));
  if (f.t === "rocket" && v3(f.o) && v3(f.d)) spawnRocket(v3(f.o), v3(f.d), false, f.tank ? TANK_SHELL : WEAPONS[f.vit ? "Базука и точка" : "Базука"]);
  if (f.t === "tnts" && Array.isArray(f.l)) for (const b of f.l.slice(0, 8)) if (Array.isArray(b) && b.length === 6 && b.every(Number.isFinite)) startPrimed(b[0], b[1], b[2], 8, false, [b[3], b[4], b[5]], true);
  if (f.t === "tnt" && [f.x, f.y, f.z].every(Number.isFinite)) startPrimed(f.x, f.y, f.z, Math.min(5, +f.f || 3), false, Array.isArray(f.v) && f.v.length === 3 && f.v.every(Number.isFinite) ? f.v : null, !!f.imp);
  if (f.t === "rsbtn" && [f.x, f.y, f.z].every(Number.isInteger)) rsPress(f.x, f.y, f.z);
  if (f.t === "bothit" && typeof f.id === "string" && bots.has(f.id) && Number.isFinite(f.dmg)) hurtBot(bots.get(f.id), Math.min(250, Math.max(0, f.dmg)));

// Отдельный Stockfish 18 для подсказки: не конкурирует с движком соперника за UCI-ответы.
const SF18_ROOT="https://unpkg.com/stockfish@18.0.8/bin/";
let sf18Ready=null,sf18Worker=null;
let chessHint=null,chessHintLoading=false,chessHintError="";
function stockfish18(){
 if(sf18Ready)return sf18Ready;
 sf18Ready=new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(new Blob([`importScripts(${JSON.stringify(SF18_ROOT+"stockfish-18-lite-single.js")});`],{type:"text/javascript"}));
  const worker=sf18Worker=new Worker(url+"#"+encodeURIComponent(SF18_ROOT+"stockfish-18-lite-single.wasm"));
  const timer=setTimeout(()=>fail(new Error("Stockfish 18 не загрузился. Проверь интернет и повтори.")),90000);
  let version=false;
  function fail(error){clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);sf18Ready=null;sf18Worker=null;reject(error);}
  worker.onerror=()=>fail(new Error("Не удалось запустить Stockfish 18"));
  worker.onmessage=event=>{
    const line=String(event.data);
    if(/^id name Stockfish 18\b/.test(line))version=true;
    if(line==="uciok"){worker.postMessage("setoption name Hash value 16");worker.postMessage("setoption name MultiPV value 1");worker.postMessage("setoption name UCI_AnalyseMode value true");worker.postMessage("isready");}
    if(line==="readyok"){if(!version)return fail(new Error("Версия движка не Stockfish 18"));clearTimeout(timer);URL.revokeObjectURL(url);resolve(worker);}
  };

}
let sf18Queue=Promise.resolve();
function analyseBestMove18(fen,options={}){

}
async function runAnalysis18(fen,{time=1600,depthLimit=22}={}){

 return new Promise((resolve,reject)=>{
  let score="",depth=0,pv="",cp=null,mate=null;
  const timer=setTimeout(()=>{worker.postMessage("stop");worker.terminate();sf18Worker=null;sf18Ready=null;reject(new Error("Анализ занял слишком долго. Повтори запрос."));},15000);
  worker.onmessage=event=>{
    const line=String(event.data),depthMatch=line.match(/\bdepth (\d+)/),scoreMatch=line.match(/\bscore (cp|mate) (-?\d+)/),pvMatch=line.match(/\bpv (.+)/);
    if(depthMatch)depth=+depthMatch[1];if(pvMatch)pv=pvMatch[1];
    if(scoreMatch){mate=scoreMatch[1]==="mate"?+scoreMatch[2]:null;cp=scoreMatch[1]==="cp"?+scoreMatch[2]:null;score=mate!==null?`мат ${mate}`:(cp/100).toFixed(2);}
    const best=line.match(/^bestmove ([a-h][1-8][a-h][1-8][qrbn]?|\(none\)|0000)/);
    if(best){clearTimeout(timer);resolve({move:best[1],score,depth,pv,cp,mate});}
  };
  worker.postMessage("setoption name Skill Level value 20");
  worker.postMessage("setoption name UCI_LimitStrength value false");
  worker.postMessage("position fen "+fen);

}

const reviewScore=r=>r.mate!==null&&r.mate!==undefined?(r.mate>0?100000:-100000):r.cp;
function classifyChessMove(before,after,move,{checkmate=false,forced=false}={}){

}

 // Анализ локальный: не задерживает ход и не перезаписывает новую позицию в сетевой партии.

// ---------- Данжи: подземная комната, пирамида в пустыне, разрушенный портал. В каждом — добыча (в одиночной игре) ----------
// Подземная комната: одна на область 48×48 (не во всех), внутри 7×4×7 пусто, стены из мшистого булыжника; пещеры могут её прорезать
function dungeonInfo(x, z) {
  const rx = Math.floor(x / 48), rz = Math.floor(z / 48), s = gen.seed + 20;
  if (hashN(s, rx, 0, rz) > 0.55) return null;
  return { cx: rx * 48 + 8 + Math.floor(hashN(s + 1, rx, 0, rz) * 32), cy: -18 - Math.floor(hashN(s + 2, rx, 0, rz) * 26), cz: rz * 48 + 8 + Math.floor(hashN(s + 3, rx, 0, rz) * 32), id: `d${rx},${rz}` };
}
function dungeonAt(x, y, z) {  // 0 — не данж, 1 — пустота внутри, 2 — стена
  const d = dungeonInfo(x, z);
  if (!d || Math.abs(x - d.cx) > 4 || Math.abs(z - d.cz) > 4 || y < d.cy - 1 || y > d.cy + 4) return 0;
  return Math.abs(x - d.cx) <= 3 && Math.abs(z - d.cz) <= 3 && y >= d.cy && y <= d.cy + 3 ? 1 : 2;
}
// Добыча: детерминирована по месту, чтобы перезагрузка не давала её снова (взятые данжи помнит gen.looted)
function spawnLoot(id, x, y, z, rich) {
  if (!gen || gen.net || gen.looted.has(id)) return;
  gen.looted.add(id);
  worldDirty = true;
  const r = i => hashN(gen.seed + 40, id.length + i, x, z), table = [
    ["Металл", 2 + Math.floor(r(1) * 5)], ["Золото", 1 + Math.floor(r(2) * 3)], ["Редстоун", 2 + Math.floor(r(3) * 6)], ["Рельсы", 8],
    r(4) < 0.45 ? ["Алмаз", 1 + Math.floor(r(5) * 2)] : null, r(6) < (rich ? 0.6 : 0.25) ? ["Тотем бессмертия", 1] : null,
    r(7) < 0.3 ? ["Железная кирка", 1] : null, r(8) < 0.25 ? ["Железный нагрудник", 1] : null, ["Обсидиан", r(9) < 0.5 ? 0 : 4]].filter(t => t && t[1] > 0);
  table.forEach(([n, k], i) => edit({ op: "item", id: `${myId}-${idCount++}`, n, k, x: x + 0.5 + Math.cos(i * 1.7) * 0.8, y: y + 0.6, z: z + 0.5 + Math.sin(i * 1.7) * 0.8, vy: 1 }));
}
// Пирамида (в пустыне) и разрушенный портал (где угодно) — прямо в куске природы. put — постановка блока природы этого куска
function genStructures(cx, cz, put) {
  const s = gen.seed + 30, x0 = cx * GEN, z0 = cz * GEN, mx = x0 + 8, mz = z0 + 8, col = genColumn(mx, mz);
  if (Math.hypot(mx - SIZE / 2, mz - SIZE / 2) < 24 || col.h > 1) return;
  const roll = hashN(s, cx, 0, cz);
  if (col.desert && roll < 0.12) {  // ступенчатая пирамида 11×11, внутри зал 5×3×5 с добычей, вход с севера
    for (let l = 0; l < 6; l++) for (let x = mx - 5 + l; x <= mx + 5 - l; x++) for (let z = mz - 5 + l; z <= mz + 5 - l; z++) {
      const hollow = l < 3 && Math.abs(x - mx) <= 2 && Math.abs(z - mz) <= 2, door = l < 2 && x === mx && z < mz - 2;
      if (!hollow && !door) put(x, col.h + l, z, l === 2 || (x + z) % 7 === 0 ? "clay" : "sand");
    }
    put(mx, col.h, mz, "gold");
    spawnLoot(`p${cx},${cz}`, mx, col.h + 1, mz, true);
  } else if (!col.desert && roll < 0.05) {  // разрушенный портал: рамка 4×5 с выпавшими блоками, вокруг адский камень
    for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) {
      const edge = i === 0 || i === 3 || j === 0 || j === 4;
      if (edge && hashN(s + 1, mx + i, j, mz) > 0.3) put(mx + i, col.h + j, mz, "obsidian");
    }
    for (let i = 0; i < 14; i++) put(mx - 3 + Math.floor(hashN(s + 2, cx, i, cz) * 10), col.h, mz - 3 + Math.floor(hashN(s + 3, cx, i, cz) * 7), "netherrack");
    spawnLoot(`r${cx},${cz}`, mx + 1, col.h + 1, mz + 2, false);
  }
}

// ---------- Ад в бесконечном мире: тоже создаётся кусками, без края. Озёра лавы, холмы и пики незерака, светокамень ----------
function generateHellColumn(x, z, put) {
  const s = gen.seed + 500, d = Math.hypot(x + 0.5 - HELL_X - 0.5, z + 0.5 - HELL_Z - 6), fade = Math.min(1, Math.max(0, (d - 7) / 10));
  const n = noise2(x, z, 22, s) * 0.7 + noise2(x, z, 7, s + 1) * 0.3, h = Math.floor(n * 8 * fade - 1.5);  // холмы до ~5: выше — слишком много блоков
  put(x, 0, z, fade > 0.6 && n < 0.3 ? "lava" : "netherrack");  // в низинах — лава
  for (let y = 1; y < h; y++) put(x, y, z, "netherrack");
  if (fade > 0.8 && hashN(s + 3, x, 0, z) < 0.004) { for (let y = Math.max(1, h); y < h + 7; y++) put(x, y, z, "netherrack"); put(x, h + 7, z, "glowstone"); }

}

 if(coords.some(c=>blocks.has(key(...c))&&blocks.get(key(...c))!==old))return toast("Соседний блок мешает"),false;
 const d=next.dim||[1,1,1];
 if(next.x<px+RADIUS&&next.x+d[0]>px-RADIUS&&next.z<pz+RADIUS&&next.z+d[2]>pz-RADIUS&&next.y<feet+bodyH&&next.y+d[1]>feet)return toast("Блок пересечёт игрока"),false;
 const volume=a=>Math.ceil((a.dim||[1,1,1]).reduce((v,x)=>v*x,1));
 const diff=volume(next)-volume(e),item=dropFor(e);
 if(bag&&diff>0&&(!item||(bag[item]||0)<diff))return toast(`Нужно ещё ${diff} ${item||"блоков"}`),false;
 if(next.x===e.x&&next.y===e.y&&next.z===e.z) share(next,true);
 else {share(undo(e));share(next);}
 if(bag&&item){if(diff>0)take(item,diff);else if(diff<0)give(item,-diff,true);}
 rulerTarget={x:next.x,y:next.y,z:next.z};rulerHighlight();return true;
}
function rulerAction(a){
 const e=rulerEdit();if(!e)return;
 if(a.startsWith("axis:"))rulerAxis=+a.slice(5);
 else if(a==="step")rulerStep=({.25:.5,.5:1,1:.25})[rulerStep];
 else {const n={...e,dim:[...(e.dim||[1,1,1])]};
  if(a==="grow"||a==="shrink")n.dim[rulerAxis]=Math.max(.25,Math.min(16,n.dim[rulerAxis]+(a==="grow"?rulerStep:-rulerStep)));
  if(a.startsWith("move:"))n[["x","y","z"][rulerAxis]]+=+a.slice(5);
  if(a==="turn")[n.dim[0],n.dim[2]]=[n.dim[2],n.dim[0]];
  rulerTransform(n);
 }drawGameMenu();
}
gameEl.addEventListener("change",event=>{if(!event.target.matches('[data-ruler-range]'))return;const e=rulerEdit();if(!e)return;const n={...e,dim:[...(e.dim||[1,1,1])]};n.dim[rulerAxis]=Math.round(+event.target.value*4)/4;rulerTransform(n);drawGameMenu();});

// Добровольное управление текущим клиентом для браузерной проверки. Нет исполнения строк или обхода прав.
let assistUntil=0;
const assistEnabled=()=>Date.now()<assistUntil;
function toggleAssist(){assistUntil=assistEnabled()?0:Date.now()+10*60*1000;toast(assistEnabled()?"Помощник: разрешено на 10 минут":"Помощник отключён");drawGameMenu();}
const assistGuard=()=>{if(!assistEnabled())throw Error("Разреши помощника в меню паузы (10 минут)");};
Object.defineProperty(window,"baseplateControl",{value:Object.freeze({
 version:1,
 enabled:()=>assistEnabled(),
 inspect(){assistGuard();return {lobby:lobbyCode,mode:gameMode,position:{x:px,y:feet+Y_SHOW,z:pz},yaw,pitch,hp,bag:bag?{...bag}:null,hotbar:[...HOTBAR],players:[...others].map(([id,p])=>({id,nick:p.nick,x:p.group.position.x,y:p.group.position.y+Y_SHOW,z:p.group.position.z})),target:aim()?.object?.userData.edit?JSON.parse(JSON.stringify(aim().object.userData.edit)):null};},
 async join(code){assistGuard();if(inGame)throw Error("Сначала выйди в меню");if(!/^[A-Z0-9]{4}$/i.test(code))throw Error("Неверный код лобби");await enterLobby(code.toUpperCase());},
 look(y,p){assistGuard();if(!Number.isFinite(y)||!Number.isFinite(p))throw Error("Неверный угол");yaw=y;pitch=Math.max(-1.5,Math.min(1.5,p));},
 async walk(direction,ms=500){assistGuard();const code={forward:"KeyW",back:"KeyS",left:"KeyA",right:"KeyD",jump:"Space"}[direction];if(!code)throw Error("Неверное направление");if(menuOpen||!inGame)throw Error("Закрой меню и войди в мир");keys[code]=true;try{await new Promise(r=>setTimeout(r,Math.max(0,Math.min(2000,Number(ms)||0))));}finally{keys[code]=false;}},
 select(i){assistGuard();if(!Number.isInteger(i)||i<0||i>=9)throw Error("Слот 0–8");selectSlot(i);},
 place(){assistGuard();use("place");},
 async mine(ms=1000){assistGuard();startBreak();try{await new Promise(r=>setTimeout(r,Math.max(0,Math.min(3000,Number(ms)||0))));}finally{stopBreak();}},
 stop(){assistUntil=0;for(const k in keys)keys[k]=false;stopBreak();}
})});

// ---------- Главный цикл ----------

let last = performance.now();
let refreshMs = 100, refreshN = 0, frameAtPrev = 0;  // самый короткий кадр = частота экрана (на 90 Гц слабым телефонам рисуем через кадр)
let tvTimer = 0, lampTimer = 0, frameNo = 0, goodSince = 0, lastUpgrade = 0, noUpgradeUntil = 0, frameMs = 16, frameAt = last, lastQuality = 0;
const frame = now => {
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));  // время назад (смена вкладки, часы) не даёт отрицательного шага
  last = now;
  updateTroll(dt);
  updateCoords();
  update(dt);
  applyTrollCam();
  updateGhosts();
  updateOnline(dt);
  updateWorld(dt);
  updatePortal(dt);
  updateWeapons(dt);
  updateGameplay(dt);
  rulerHighlight();
  lampTimer += dt;
  if (lampTimer > 0.25) { lampTimer = 0; updateLamps(); }
  // Шлагбаумы поднимаются и опускаются плавно
  for (const m of barriers) {
    const target = m.userData.edit.open ? BARRIER_STEPS : 0, s = m.userData.step;
    if (s !== target) {
      m.userData.step = s + Math.sign(target - s) * Math.min(Math.abs(target - s), dt * 10);
      m.geometry = barrierGeos[Math.round(m.userData.step)];
    }
  }
  // Экран телевизора перерисовываем 5 раз в секунду
  tvTimer += dt;
  if (tvs.size && tvTimer > 0.2) { tvTimer = 0; drawTv(now / 1000); tvTex.needsUpdate = true; }

  // Подстраиваем качество. Кадр дольше ~24 мс — символы крупнее. Ровные 60 кадров 8 секунд подряд — пробуем мельче;
  // если после такой пробы снова тормозит, мелкую сетку не трогаем 2 минуты
  frameMs += (Math.min(now - frameAt, 100) - frameMs) * 0.05;
  frameAt = now;
  if (now > 3000 && document.visibilityState === "visible") {
    if (frameMs > 30 && quality < worstQuality() && now - lastQuality > 2500) {
      quality++;
      if (now - lastUpgrade < 6000) noUpgradeUntil = now + 120000;
      lastQuality = now; goodSince = 0; frameMs = 16;
      setQuality();
    } else if (frameMs < 18.5) {
      goodSince ||= now;
      if (now - goodSince > 8000 && quality > bestQuality() && now > noUpgradeUntil && now - lastQuality > 8000) {
        quality--;
        lastQuality = lastUpgrade = now; goodSince = 0; frameMs = 16;
        setQuality();
      }
    } else goodSince = 0;
  }
  // Зум на C: угол обзора плавно сужается, пока клавиша зажата
  if (!keys.KeyC) zoomFov = ZOOM_FOV;
  const fovTarget = nitroOn ? 88 : trollOn("fisheye") ? 140 : trollOn("binoc") ? 12 : trollOn("pulse") ? 75 + Math.sin(performance.now() / 200) * 35 : scoped ? SCOPE_FOV : keys.KeyC && !typing ? zoomFov : FOV;
  if (Math.abs(camera.fov - fovTarget) > 0.05) {
    camera.fov += (fovTarget - camera.fov) * Math.min(1, dt * 12);
    camera.updateProjectionMatrix();
  }
  // Тени обновляем через кадр-два: это почти не заметно, а отрисовка теней — самая дорогая часть кадра
  if (++frameNo % 3 === 0) renderer.shadowMap.needsUpdate = true;

  rebuildChunks();
  if (++refreshN > 10 && refreshN < 240) refreshMs = Math.min(refreshMs, now - frameAtPrev);
  frameAtPrev = now;
  if (LOWEND && is3d() && refreshMs < 13.5 && frameNo % 2) return;  // экран 90 Гц: 45 кадров в секунду вместо рваных 90
  if (is3d()) {  // без символов; со сглаживанием — через цель с MSAA, потом на экран
    if (target3d) { renderer.setRenderTarget(target3d); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(blitScene, asciiCamera); }
    else { renderer.setRenderTarget(null); renderer.render(scene, camera); }
    return;
  }
  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(asciiScene, asciiCamera);
};
// Без ограничения FPS (настройки): кадры идут не по сигналу экрана (requestAnimationFrame), а сразу друг за другом через MessageChannel.
// Монитор всё равно покажет столько кадров, сколько умеет, но кадр готов раньше, а счётчик видит настоящую скорость. В свёрнутой вкладке — обычный режим
const loopCh = new MessageChannel();
let uncapOn = false;
loopCh.port1.onmessage = () => { if (!uncapOn) return; frame(performance.now()); loopCh.port2.postMessage(0); };
function setFrameLoop() {
  const on = settings.uncap && !document.hidden, was = uncapOn;
  uncapOn = on;
  renderer.setAnimationLoop(on ? null : frame);
  if (on && !was) loopCh.port2.postMessage(0);  // цепочка одна: повторный вызов вторую не запускает
}
document.addEventListener("visibilitychange", setFrameLoop);
setFrameLoop();
// Тени можно выключить: это самая дорогая часть кадра после самой картинки
function applyShadows() {
  renderer.shadowMap.enabled = settings.shadows;
  sun.castShadow = settings.shadows;
  scene.traverse(o => { if (o.material) for (const m of [].concat(o.material)) m.needsUpdate = true; });
}
if (!settings.shadows) applyShadows();

</script>
