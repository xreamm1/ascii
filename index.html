<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Baseplate</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  pre {
    position: absolute;
    margin: 0;
    color: #fff;
    font: 16px/1 Consolas, "Courier New", monospace;
    user-select: none;
  }
  #crosshair {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #hotbar {
    left: 16px;
    bottom: 16px;
    pointer-events: none;
  }
  #palette {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
  }
  #palette .option { cursor: pointer; }
  #palette .option:hover { background: #333; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<pre id="crosshair">+</pre>
<pre id="hotbar"></pre>
<pre id="palette"></pre>
<script>
// Цвета палитры
const COLORS = [
  { name: "Белый",      rgb: [255, 255, 255] },
  { name: "Красный",    rgb: [255,  60,  60] },
  { name: "Оранжевый",  rgb: [255, 150,  40] },
  { name: "Жёлтый",     rgb: [255, 230,  60] },
  { name: "Зелёный",    rgb: [ 70, 230,  90] },
  { name: "Голубой",    rgb: [ 70, 220, 255] },
  { name: "Синий",      rgb: [ 70, 110, 255] },
  { name: "Фиолетовый", rgb: [190,  90, 255] },
  { name: "Розовый",    rgb: [255, 110, 200] },
];

// Панель предметов: в первом слоте стена, остальные пустые
const HOTBAR = ["Стена", null, null, null, null];

const SIZE = 48;         // размер плиты в клетках
const CELL_W = 7;        // ширина одного символа в пикселях (меньше — детальнее)
const CELL_H = 12;       // высота одного символа в пикселях
const FOV = 0.66;        // ширина обзора (длина вектора камеры)
const MOVE_SPEED = 3;    // клеток в секунду
const MOUSE_SPEED = 0.0025;  // поворот на пиксель движения мыши
const RADIUS = 0.2;      // "толщина" игрока, чтобы не упираться носом в стену
const REACH = 6;         // как далеко можно ставить и убирать стены
const EYE = 0.5;         // высота глаз над полом (стена высотой 1)
const JUMP_SPEED = 3.5;  // начальная скорость прыжка
const GRAVITY = 14;

// Символы от самого тёмного к самому яркому
const RAMP = " .,:;-~=+*░#%@▒▓█";

// Мир: пустая плита. В клетке либо null (пусто), либо номер цвета стены
const world = Array.from({ length: SIZE }, () => new Array(SIZE).fill(null));

// Игрок стартует в центре плиты
let px = SIZE / 2 + 0.5, py = SIZE / 2 + 0.5;
let angle = 0;      // поворот влево-вправо
let pitch = 0;      // наклон вверх-вниз (сдвиг горизонта в долях экрана)
let z = 0, vz = 0;  // высота прыжка и вертикальная скорость
let slot = 0;       // выбранный слот панели
let color = 0;      // выбранный цвет
let menuOpen = false;
let target = null;  // клетки под прицелом: куда поставить и что убрать

function inside(x, y) {
  return x >= 0 && y >= 0 && x < SIZE && y < SIZE;
}

// За краем плиты — невидимая граница, туда не пройти
function isWall(x, y) {
  x = Math.floor(x); y = Math.floor(y);
  return !inside(x, y) || world[y][x] !== null;
}

// DDA: шагаем по клеткам сетки вдоль луча, пока не упрёмся в стену.
// prevX/prevY — последняя пустая клетка перед стеной (туда ставится новый блок).
// Если луч ушёл за край плиты, стены нет — возвращаем null.
function castRay(rayX, rayY) {
  let mapX = Math.floor(px), mapY = Math.floor(py);
  let prevX, prevY, side;
  const deltaX = Math.abs(1 / rayX), deltaY = Math.abs(1 / rayY);
  const stepX = rayX < 0 ? -1 : 1, stepY = rayY < 0 ? -1 : 1;
  let sideX = (rayX < 0 ? px - mapX : mapX + 1 - px) * deltaX;
  let sideY = (rayY < 0 ? py - mapY : mapY + 1 - py) * deltaY;

  for (;;) {
    prevX = mapX; prevY = mapY;
    if (sideX < sideY) { sideX += deltaX; mapX += stepX; side = 0; }
    else               { sideY += deltaY; mapY += stepY; side = 1; }
    if (!inside(mapX, mapY)) return null;
    if (world[mapY][mapX] !== null) break;
  }

  // Расстояние до стены перпендикулярно экрану (без эффекта "рыбьего глаза")
  const dist = side === 0 ? sideX - deltaX : sideY - deltaY;
  return { mapX, mapY, prevX, prevY, side, dist };
}

function update(dt) {
  let step = 0;
  if (keys.KeyW) step += MOVE_SPEED * dt;
  if (keys.KeyS) step -= MOVE_SPEED * dt;

  const dx = Math.cos(angle) * step;
  const dy = Math.sin(angle) * step;

  // Двигаемся по каждой оси отдельно — так можно скользить вдоль стены
  if (!isWall(px + dx + Math.sign(dx) * RADIUS, py)) px += dx;
  if (!isWall(px, py + dy + Math.sign(dy) * RADIUS)) py += dy;

  // Прыжок: на земле пробел даёт скорость вверх, дальше тянет гравитация
  if (keys.Space && z === 0) vz = JUMP_SPEED;
  vz -= GRAVITY * dt;
  z = Math.max(0, z + vz * dt);
  if (z === 0) vz = 0;
}

// ---------- Управление ----------

const canvas = document.getElementById("screen");
const keys = {};

addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code.startsWith("Digit")) {
    const n = Number(e.code.slice(5)) - 1;
    if (n >= 0 && n < HOTBAR.length) { slot = n; drawHotbar(); }
  }
  if (e.code === "KeyF" && !e.repeat) {
    if (menuOpen) closePalette(); else openPalette();
  }
});
addEventListener("keyup", e => keys[e.code] = false);

// Клик по экрану захватывает мышь, после этого камера крутится мышью
canvas.addEventListener("click", () => {
  if (!menuOpen) canvas.requestPointerLock();
});
addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;
  angle += e.movementX * MOUSE_SPEED;
  pitch = Math.max(-0.6, Math.min(0.6, pitch - e.movementY * MOUSE_SPEED * 0.6));
});
addEventListener("contextmenu", e => e.preventDefault());

// ЛКМ — поставить стену выбранного цвета, ПКМ — убрать стену
addEventListener("mousedown", e => {
  if (document.pointerLockElement !== canvas || HOTBAR[slot] !== "Стена" || !target) return;

  if (e.button === 0) {
    const [x, y] = target.place;
    const inPlayerCell = x === Math.floor(px) && y === Math.floor(py);
    if (!inPlayerCell) world[y][x] = color;
  }
  if (e.button === 2 && target.remove) {
    const [x, y] = target.remove;
    world[y][x] = null;
  }
});

// ---------- ASCII-интерфейс: панель предметов и палитра ----------

const hotbar = document.getElementById("hotbar");
const palette = document.getElementById("palette");

function rgb(c) {
  return `rgb(${COLORS[c].rgb.join(",")})`;
}

function drawHotbar() {
  const lines = ["", "", ""];
  HOTBAR.forEach((item, i) => {
    const [tl, h, tr, v, bl, br] = i === slot ? "╔═╗║╚╝" : "┌─┐│└┘";
    const icon = item ? `<span style="color:${rgb(color)}">████</span>` : "    ";
    const style = i === slot ? "" : ' style="color:#666"';
    lines[0] += `<span${style}>${tl}${h.repeat(4)}${tr}</span>`;
    lines[1] += `<span${style}>${v}</span>${icon}<span${style}>${v}</span>`;
    lines[2] += `<span${style}>${bl}${h}${i + 1}${h}${h}${br}</span>`;
  });
  hotbar.innerHTML = (HOTBAR[slot] || "—") + "\n" + lines.join("\n");
}

function drawPalette() {
  const W = 22;  // ширина внутри рамки
  let html = "╔" + "═".repeat(W) + "╗\n";
  html += "║" + "ПАЛИТРА".padStart(14).padEnd(W) + "║\n";
  html += "╟" + "─".repeat(W) + "╢\n";
  COLORS.forEach((c, i) => {
    const text = ` ${i === color ? "►" : " "} ${c.name}`.padEnd(W - 4);
    html += `║ <span class="option" data-color="${i}"><span style="color:${rgb(i)}">██</span>${text}</span> ║\n`;
  });
  html += "╟" + "─".repeat(W) + "╢\n";
  html += "║" + " F — закрыть".padEnd(W) + "║\n";
  html += "╚" + "═".repeat(W) + "╝";
  palette.innerHTML = html;
}

function openPalette() {
  menuOpen = true;
  document.exitPointerLock();
  drawPalette();
  palette.style.display = "block";
}

function closePalette() {
  menuOpen = false;
  palette.style.display = "none";
  canvas.requestPointerLock();
}

palette.addEventListener("click", e => {
  const option = e.target.closest(".option");
  if (!option) return;
  color = Number(option.dataset.color);
  drawHotbar();
  closePalette();
});

drawHotbar();

// ---------- WebGL: превращает сетку клеток в символы прямо на видеокарте ----------

const gl = canvas.getContext("webgl");

function shader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, `
  attribute vec2 pos;
  varying vec2 uv;
  void main() {
    uv = vec2(pos.x * 0.5 + 0.5, 0.5 - pos.y * 0.5);  // (0,0) — левый верхний угол
    gl_Position = vec4(pos, 0.0, 1.0);
  }
`));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
  precision highp float;
  uniform sampler2D cellsTex;  // клетки экрана: rgb — цвет, a — яркость
  uniform sampler2D fontTex;   // все символы RAMP в одну строку
  uniform vec2 grid;           // колонок и строк
  uniform float glyphs;        // сколько символов в RAMP
  varying vec2 uv;
  void main() {
    vec2 cell = floor(uv * grid);
    vec2 inCell = fract(uv * grid);
    vec4 c = texture2D(cellsTex, (cell + 0.5) / grid);
    float g = floor(c.a * (glyphs - 1.0) + 0.5);
    float ink = texture2D(fontTex, vec2((g + inCell.x) / glyphs, inCell.y)).r;
    gl_FragColor = vec4(c.rgb * ink * (0.3 + 0.7 * c.a), 1.0);  // дальше — темнее
  }
`));
gl.linkProgram(program);
gl.useProgram(program);

// Прямоугольник на весь экран
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, "pos");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

function texture(unit) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
texture(0);  // клетки экрана
texture(1);  // шрифт
gl.uniform1i(gl.getUniformLocation(program, "cellsTex"), 0);
gl.uniform1i(gl.getUniformLocation(program, "fontTex"), 1);
gl.uniform1f(gl.getUniformLocation(program, "glyphs"), RAMP.length);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

let cols, rows, cells, K;

// Подгоняем сетку под окно и заново рисуем шрифт под плотность пикселей экрана
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(CELL_W * dpr), ch = Math.round(CELL_H * dpr);
  cols = Math.floor(innerWidth / CELL_W);
  rows = Math.floor(innerHeight / CELL_H);
  cells = new Uint8Array(cols * rows * 4);
  K = (cols * CELL_W) / (2 * FOV * CELL_H);  // высота стены в строках на расстоянии 1

  canvas.width = cols * cw;
  canvas.height = rows * ch;
  canvas.style.width = canvas.width / dpr + "px";
  canvas.style.height = canvas.height / dpr + "px";
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(gl.getUniformLocation(program, "grid"), cols, rows);

  const font = document.createElement("canvas");
  font.width = cw * RAMP.length;
  font.height = ch;
  const ctx = font.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, font.width, font.height);
  ctx.fillStyle = "#fff";
  ctx.font = Math.min(ch, cw / 0.6) + "px Consolas, 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < RAMP.length; i++) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(i * cw, 0, cw, ch);  // символ не вылезает за свою клетку
    ctx.clip();
    if (RAMP[i] === "█") ctx.fillRect(i * cw, 0, cw, ch);  // сплошной блок без щелей
    else ctx.fillText(RAMP[i], i * cw + cw / 2, ch / 2);
    ctx.restore();
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, font);
}
addEventListener("resize", resize);
resize();

// Что под прицелом (центр экрана): стена или клетка пола в пределах досягаемости
function findTarget(dirX, dirY, horizon, eye) {
  const hit = castRay(dirX, dirY);
  const center = rows / 2;
  const floorDist = center > horizon ? eye * K / (center - horizon) : Infinity;

  if (hit && hit.dist < floorDist) {
    return hit.dist <= REACH ? { place: [hit.prevX, hit.prevY], remove: [hit.mapX, hit.mapY] } : null;
  }
  if (floorDist <= REACH) {
    const x = Math.floor(px + dirX * floorDist), y = Math.floor(py + dirY * floorDist);
    if (inside(x, y)) return { place: [x, y], remove: null };
  }
  return null;
}

// ---------- Raycasting: считаем цвет и яркость каждой клетки экрана ----------

function render() {
  const dirX = Math.cos(angle), dirY = Math.sin(angle);
  const planeX = -dirY * FOV, planeY = dirX * FOV;
  const horizon = rows * (0.5 + pitch);
  const eye = EYE + z;  // высота камеры с учётом прыжка

  target = HOTBAR[slot] === "Стена" ? findTarget(dirX, dirY, horizon, eye) : null;

  for (let x = 0; x < cols; x++) {
    // Направление луча для этого столбца
    const camX = 2 * (x + 0.5) / cols - 1;
    const rayX = dirX + planeX * camX;
    const rayY = dirY + planeY * camX;
    const hit = castRay(rayX, rayY);

    // Где на экране верх и низ стены (если луч в неё попал)
    let top = Infinity, bottom = horizon, wallX = 0, light = 0, wallRgb;
    if (hit) {
      const lineH = K / hit.dist;
      top = horizon - (1 - eye) * lineH;
      bottom = horizon + eye * lineH;
      // Где именно на стене попал луч (0..1 вдоль стены) — нужно для кирпичей
      wallX = hit.side === 0 ? py + hit.dist * rayY : px + hit.dist * rayX;
      wallX -= Math.floor(wallX);
      // Чем дальше, тем темнее; боковые стены чуть темнее, чтобы были видны углы
      light = Math.exp(-hit.dist * 0.08) * (hit.side === 1 ? 0.7 : 1);
      wallRgb = COLORS[world[hit.mapY][hit.mapX]].rgb;
    }

    for (let y = 0; y < rows; y++) {
      const sy = y + 0.5;
      let b = 0;  // небо — чёрное
      let tint = COLORS[0].rgb;

      if (sy >= top && sy < bottom) {
        // Стена из кирпичей: 4 ряда по высоте, 2 кирпича по ширине, ряды со сдвигом
        const v = (sy - top) / (bottom - top);
        const brickRow = Math.floor(v * 4);
        const u = (wallX * 2 + (brickRow % 2) * 0.5) % 1;
        const mortar = bottom - top > 12 && ((v * 4) % 1 < 0.08 || u < 0.05);
        b = light * (mortar ? 0.45 : 1);
        tint = wallRgb;
      } else if (sy >= bottom) {
        // Пол: находим точку на плите под этой клеткой экрана
        const d = eye * K / (sy - horizon);
        const fx = px + rayX * d, fy = py + rayY * d;
        if (inside(fx, fy)) {
          // Плитка в шахматном порядке; вдали она сливается, иначе там рябит
          const checker = (Math.floor(fx) + Math.floor(fy)) % 2;
          const fade = Math.max(0, 1 - d / 8);
          b = (0.28 + 0.12 * checker * fade) * Math.exp(-d * 0.06);
          // Клетка под прицелом подсвечивается выбранным цветом
          if (target && Math.floor(fx) === target.place[0] && Math.floor(fy) === target.place[1]) {
            b = 0.6;
            tint = COLORS[color].rgb;
          }
        }
      }

      const i = (y * cols + x) * 4;
      cells[i] = tint[0];
      cells[i + 1] = tint[1];
      cells[i + 2] = tint[2];
      cells[i + 3] = b * 255;
    }
  }

  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, cells);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
