  // Едем по каждой оси отдельно; в стену — отскок. Машина большая, поэтому проверяем пять точек:
  // центр, нос, зад и оба борта
  const y = m.position.y;
  const blocked = (cx, cz) => {
    ignoreJump = true;
    const hit = (bus ? [[0, 0], [4.2, 0], [-4.2, 0], [2.4, 1.3], [2.4, -1.3], [-2.4, 1.3], [-2.4, -1.3], [0, 1.3], [0, -1.3]] : [[0, 0], [1.4, 0], [-1.4, 0], [0, 0.7], [0, -0.7]])
      .some(([a, b]) => hitsSolid(cx + f[0] * a + r[0] * b, y, cz + f[1] * a + r[1] * b, bus ? 2.6 : 1));
    ignoreJump = false;
    return hit;
  };
  let x = m.position.x, z = m.position.z;
  const speed = Math.hypot(carV.x, carV.z);
  // Врезались в чужую машину на скорости — она отлетает
  const rammed = (cx, cz) => {
    for (const [a, b] of (bus ? [[0, 0], [4.2, 0], [-4.2, 0], [0, 1.3], [0, -1.3]] : [[0, 0], [1.4, 0], [-1.4, 0], [0, 0.7], [0, -0.7]])) {
      const o = carAt(cx + f[0] * a + r[0] * b, y, cz + f[1] * a + r[1] * b, bus ? 2.6 : 1);
      if (o && o !== m) return o;
    }
    return null;
  };
  const hitCar = (cx, cz) => { const o = speed > 7 && rammed(cx, cz); if (o && !flung.has(o)) launchCar(o, carV.x, carV.z, speed); };
  if (!blocked(x + carV.x * dt, z)) x += carV.x * dt; else { hitCar(x + carV.x * dt, z); carV.x *= -0.3; }
  if (!blocked(x, z + carV.z * dt)) z += carV.z * dt; else { hitCar(x, z + carV.z * dt); carV.z *= -0.3; }
  // Вертикаль: на земле машина прилипает к поверхности, а с трамплина или обрыва летит по дуге
  let ny = groundHeight(x, y, z);
  const jc = blocks.get(key(Math.floor(x), Math.floor(y + 0.05), Math.floor(z)));
  if (carVy === 0 && jc?.userData.edit.k === "jump" && y - jc.userData.edit.y > 0.6 && speed > 3) carVy = 5 + speed * 0.45;  // верх трамплина — взлёт
  if (carVy !== 0 || y > ny + 0.05) {
    carVy -= 25 * dt;
    const up = y + carVy * dt;
    if (carVy <= 0 && up <= ny) carVy = 0; else ny = up;  // приземлился или ещё в воздухе
  }
  m.position.set(x, ny, z);
  m.rotation.y = carYaw;
  Object.assign(m.userData.edit, { x: +x.toFixed(2), y: +m.position.y.toFixed(2), z: +z.toFixed(2), yaw: +carYaw.toFixed(2) });
  px = x; pz = z; feet = m.position.y;

  // Камера сзади и чуть сверху, плавно догоняет поворот машины
  yaw += Math.atan2(Math.sin(carYaw - yaw), Math.cos(carYaw - yaw)) * Math.min(1, dt * 4);
  pitch = -0.2;
  const head = new THREE.Vector3(x, m.position.y + (bus ? 4.2 : 2.4), z), dist = bus ? 17 : 12;
  const back = new THREE.Vector3(Math.sin(yaw), 0.35, Math.cos(yaw)).normalize();
  camRay.set(head, back);
  camRay.far = dist;
  const hit = castSolids(camRay)[0];
  camera.position.copy(head).addScaledVector(back, hit ? Math.max(0.5, hit.distance - 0.3) : dist);
  scene.fog.near = FOG_NEAR; scene.fog.far = FOG_FAR;
  camera.rotation.set(pitch, yaw, 0);
}

function updateDrone(dt) {
  if (boom > 0) {
    boom -= dt;
    const t = 1 - Math.max(boom, 0) / BOOM_TIME;
    boomMesh.scale.setScalar(0.3 + t * 3);
    boomMesh.material.opacity = 1 - t;
    if (boom <= 0) endDrone();
  } else {
    const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;
    const strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
    const up = (keys.Space ? 1 : 0) - ((keys.ControlLeft || keys.ControlRight) ? 1 : 0);
    const look = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = look.multiplyScalar(forward).addScaledVector(right, strafe);
    move.y += up;
    move.multiplyScalar(DRONE_SPEED * dt);
    // Идём мелкими шагами, чтобы на скорости не пролететь сквозь тонкую стену
    const n = Math.max(1, Math.ceil(move.length() / 0.2));
    for (let i = 0; i < n && boom <= 0; i++) {
      const next = dronePos.clone().addScaledVector(move, 1 / n);
      if (droneHits(next)) {
        boom = BOOM_TIME;
        boomMesh.position.copy(dronePos);
        boomMesh.visible = true;
        explode(dronePos);
      } else dronePos.copy(next);
    }
  }
  camera.position.copy(dronePos);
  camera.rotation.set(pitch, yaw, 0);
}

function update(dt) {
  const crouchKey = keys.ControlLeft || keys.ControlRight;
  // Ходьба: W/S — вперёд-назад, A/D — вбок, относительно взгляда (или джойстик)
  const tm = trollMove();  // 0 — заморожен, -1 — управление наоборот
  const forward = trollOn("run") ? 1 : tm * ((keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y);
  const strafe = tm * ((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x);

  if (dead) {
    // Лежим на месте и ждём возрождения
    camera.position.set(px, feet + 0.3, pz);
    camera.rotation.set(0.9, yaw, 0.3);
    const left = Math.ceil((respawnAt - performance.now()) / 1000);
    deathEl.style.display = "block";
    deathEl.textContent = `ТЫ ПОГИБ\nвозрождение через ${Math.max(left, 0)}`;
    if (left <= 0) respawn();
    return;
  }
  if (camMode === "car") return drivingCart ? updateCartRide() : drivingTank ? updateTank(dt) : drivingPlane ? updatePlane(dt) : updateCar(dt);
  if (camMode === "drone") return updateDrone(dt);

  // Свободная камера разработчика летает сама по себе, а игрок стоит на месте:
  // W/S — туда, куда смотришь, A/D — вбок, пробел — вверх, Ctrl — вниз
  if (camMode === "free") {
    const look = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const k = FREECAM_SPEED * dt;
    freePos.addScaledVector(look, forward * k).addScaledVector(right, strafe * k);
    freePos.y += ((keys.Space ? 1 : 0) - (crouchKey ? 1 : 0)) * k;
    camera.position.copy(freePos);
    camera.rotation.set(pitch, yaw, 0);
    return;
  }

  // Присед: пока держишь Ctrl — ниже и медленнее. Встать можно, только если над головой свободно
  if (crouchKey && !flying) crouching = true;
  else if (crouching && !hitsSolid(px, feet, pz, HEIGHT)) crouching = false;
  bodyH = crouching ? CROUCH_HEIGHT : HEIGHT;
  eye += ((crouching ? CROUCH_EYE : EYE) - eye) * Math.min(1, dt * 12);  // камера опускается плавно

  // В главном меню камера просто медленно оборачивается вокруг
  if (!inGame) yaw += dt * 0.1;

  let mx = -Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
  let mz = -Math.cos(yaw) * forward - Math.sin(yaw) * strafe;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  const sprint = (keys.ShiftLeft || keys.ShiftRight) && !crouching && forward > 0 && !typing;  // бег на Shift
  const step = MOVE_SPEED * (crouching ? CROUCH_SPEED : flying ? 2 : sprint ? 1.7 : 1) * dt;
  // По каждой оси отдельно — так можно скользить вдоль стены.
  // Если уже застрял (например, упал вплотную к краю доски), даём выйти
  const stuck = hitsSolid(px, feet, pz);
  // Присевший не падает с края, как в Майнкрафте: шаг, после которого под ногами
  // не останется опоры (ниже, чем можно просто шагнуть), не делаем
  const safe = (x, z) => !(crouching && onGround) || groundHeight(x, feet, z) >= feet - STEP;
  // На льду скорость меняется плавно: разгоняешься и тормозишь не сразу
  let ex = mx * step, ez = mz * step;
  if (onIce && !flying && dt > 0) {
    iceVx += (ex / dt - iceVx) * Math.min(1, 1.2 * dt); iceVz += (ez / dt - iceVz) * Math.min(1, 1.2 * dt);
    ex = iceVx * dt; ez = iceVz * dt;
  } else { iceVx = dt > 0 ? ex / dt : 0; iceVz = dt > 0 ? ez / dt : 0; }
  if ((stuck || !hitsSolid(px + ex, feet, pz)) && safe(px + ex, pz)) px += ex; else iceVx = 0;
  if ((stuck || !hitsSolid(px, feet, pz + ez)) && safe(px, pz + ez)) pz += ez; else iceVz = 0;

  const prevFeet = feet;
  if (flying) {
    // Полёт разработчика: пробел — вверх, Ctrl — вниз, гравитации нет
    const up = ((keys.Space ? 1 : 0) - (crouchKey ? 1 : 0)) * FLY_SPEED * dt;
    if (up < 0 || !hitsSolid(px, feet + up, pz)) feet += up;
    feet = Math.max(feet, groundHeight(px, prevFeet, pz));
    vy = 0;
    onGround = false;
  } else {
    // Прыжок и гравитация
    if ((keys.Space || trollOn("dance")) && onGround) vy = JUMP_SPEED;
    vy -= GRAVITY * (trollOn("moon") ? 0.25 : 1) * dt;
    feet += vy * dt;
    if (vy > 0 && hitsSolid(px, feet, pz)) { feet = prevFeet; vy = 0; }  // ударился головой

    const ground = groundHeight(px, prevFeet, pz);
    onGround = feet <= ground;
    // Трамплин подбрасывает и игрока
    const jp = onGround ? blocks.get(key(Math.floor(px), Math.floor(feet + 0.2), Math.floor(pz))) : null;
    if (jp?.userData.edit.k === "jump" && feet - jp.userData.edit.y > 0.5) { vy = JUMP_SPEED * 1.5; onGround = false; feet = ground + 0.01; }
    const under = onGround ? blocks.get(key(Math.floor(px), Math.floor(ground - 0.05), Math.floor(pz)))?.userData.edit.k : null;
    if (under === "slime" && vy < -2) { vy = Math.min(16, -vy * 0.85); onGround = false; feet = ground + 0.01; }  // слизь подбрасывает
    if (under === "lava") damage(30 * dt, "лавы");  // лава жжёт
    if (onGround) onIce = under === "ice";
    if (onGround) {
      if (vy < -FALL_SAFE) damage((-vy - FALL_SAFE) * 6);  // удар о землю: чем быстрее падал, тем больнее
      feet = ground; vy = 0;
    }
  }

  // Упал с плиты — возвращаемся в центр
  if (feet < -DEPTH - 20) { px = pz = SIZE / 2; feet = 0; vy = 0; }

  camera.rotation.set(pitch, yaw, 0);
  camera.position.set(px, feet + eye, pz);
  // Вид от третьего лица: камера позади игрока, но не дальше первой стены за спиной
  if (camMode === "third") {
    const back = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
    camRay.set(camera.position, back);
    camRay.far = THIRD_DIST * size;
    const hit = castSolids(camRay)[0];
    camera.position.addScaledVector(back, hit ? Math.max(0.3, hit.distance - 0.2) : THIRD_DIST * size);
  }
}

// ---------- Прицел и строительство ----------

const aimRay = new THREE.Raycaster();
aimRay.far = REACH;

// Можно ли сейчас управлять: мышь захвачена (или это телефон) и палитра закрыта
const playing = () => inGame && !menuOpen && !typing && (TOUCH || !!document.pointerLockElement);

// Что под точкой экрана (по умолчанию — под прицелом в центре): точка, нормаль поверхности и объект.
// screen — координаты от -1 до 1, как у WebGL
const animalBox = new THREE.Box3();
function aim(screen = new THREE.Vector2(0, 0)) {
  aimRay.setFromCamera(screen, camera);
  // Плита над ямой — «призрак»: луч идёт сквозь неё
  const hit = castSolids(aimRay).find(h => h.object !== plate || (px <= HELL_BORDER && !topDug(Math.floor(h.point.x), Math.floor(h.point.z))));
  // Животные маленькие и двигаются: целимся по их коробке с запасом, иначе вместо курицы выкапывается пол
  let best = null, bestD = hit ? hit.distance : REACH;
  for (const m of animals.values()) {
    const h = ANIMALS[m.userData.edit.t].h;
    animalBox.setFromCenterAndSize(new THREE.Vector3(m.position.x, m.position.y + h / 2, m.position.z), new THREE.Vector3(1.1, h + 0.3, 1.1));
    const pt = aimRay.ray.intersectBox(animalBox, new THREE.Vector3());
    if (pt && pt.distanceTo(aimRay.ray.origin) < bestD) { bestD = pt.distanceTo(aimRay.ray.origin); best = { point: pt, normal: new THREE.Vector3(0, 1, 0), object: m }; }
  }
  if (best) return best;
  if (!hit) return null;
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  return { point: hit.point, normal, object: hit.object };
}

// Точка доски: куда попал луч из aim(), а если там пусто — в воздухе на этом луче
function plankPoint(hit) {
  if (hit) return hit.point.clone();
  return aimRay.ray.at(AIR_DIST, new THREE.Vector3());
}

// Клетка для предмета: для двери нужна ещё и свободная клетка над ней
function placeCell(hit, item) {
  const cell = blockCell(hit);
  if (!cell || item !== "Дверь") return cell;
  const [x, y, z] = cell;
  const headroom = !blocks.has(key(x, y + 1, z)) && !(x < px + RADIUS && x + 1 > px - RADIUS && z < pz + RADIUS && z + 1 > pz - RADIUS &&
                   y + 1 < feet + bodyH && y + 2 > feet);
  return headroom ? cell : null;
}

// Клетка, куда встанет новый блок: соседняя с поверхностью под прицелом
function blockCell(hit, allowSelf = false) {  // allowSelf — плоское (рельсы) можно класть и в свою клетку
  const p = hit.point.clone().addScaledVector(hit.normal, 0.5);
  const [x, y, z] = [Math.floor(p.x), Math.floor(p.y), Math.floor(p.z)];
  if (y < -DEPTH || (y < 0 && !dug.has(`${x},${y},${z}`))) return null;
  // Нельзя ставить блок внутрь себя
  const overlapsPlayer = x < px + RADIUS && x + 1 > px - RADIUS && z < pz + RADIUS && z + 1 > pz - RADIUS &&
                         y < feet + bodyH && y + 1 > feet;
  return overlapsPlayer && !allowSelf ? null : [x, y, z];
}

function updateGhosts() {
  // На телефоне строят касанием в любое место экрана, поэтому подсказки под прицелом не показываем
  const on = playing() && !TOUCH;
  const hit = on ? aim() : null;
  const [r, g, b] = COLORS[color].rgb;
  ghostMat.color.setRGB(r / 255, g / 255, b / 255);

  const item = HOTBAR[slot];
  const onDoor = ["door", "barrier"].includes(hit?.object.userData.edit?.k);  // по двери и шлагбауму кликают, чтобы открыть
  const cell = hit && !onDoor && Object.keys(KINDS).includes(item) ? placeCell(hit, item) : null;
  ghostBlock.visible = !!cell;
  if (cell) {
    const tall = item === "Дверь" ? 2 : 1, thin = item === "Палка" ? STICK_HALF * 2 : 1;
    ghostBlock.scale.set(thin, tall, thin);
    ghostBlock.position.set(cell[0] + 0.5, cell[1] + tall / 2, cell[2] + 0.5);
  }

  const plankMode = on && HOTBAR[slot] === "Доска";
  const point = plankMode ? plankPoint(hit) : null;
  ghostPoint.visible = plankMode || !!plankStart;
  if (ghostPoint.visible) ghostPoint.position.copy(plankStart || point);
  ghostPlank.visible = plankMode && !!plankStart;
  if (ghostPlank.visible) fitPlank(ghostPlank, plankStart, point);
}

// Действие предметом: "place" — ЛКМ или касание, "remove" — ПКМ или удержание пальца.
// screen — точка экрана, куда нажали (на компьютере — центр, где прицел)
// Какой предмет хотбара какой "вид" блока ставит
const KINDS = { "Блок": undefined, "Стекло": "glass", "Палка": "stick", "Дверь": "door", "Рампа": "ramp", "Стул": "chair", "Стол": "table", "Ступеньки": "stairs",
  "Бургер": "burger", "Пицца": "pizza", "Крылышки": "wings", "Шлагбаум": "barrier", "Лампа": "lamp", "Решётка": "grate", "Бочка": "barrel", "Кровать": "bed", "Диван": "sofa",
  "Поднос": "tray", "Стакан": "cup", "Картошка фри": "fries", "Прилавок": "counter", "Касса": "register", "Терминал": "terminal", "Витрина": "showcase", "Плита": "stove",
  "Холодильник": "fridge", "Урна": "bin", "Скамейка": "bench", "Фонарь": "streetlamp", "Светофор": "traffic", "Конус": "cone", "Знак": "sign", "Окно": "window",
  "Телевизор": "tv", "Раковина": "sink", "Камень": "stone", "Дерево": "wood", "Трава": "grass", "Песок": "sand", "Лёд": "ice", "Лава": "lava", "Металл": "metal", "Бетон": "concrete", "Листва": "leaves", "Золото": "gold", "Алмаз": "diamond", "Неон": "neon", "Слизь": "slime", "Плитка": "tiles", "Снег": "snow", "Обсидиан": "obsidian", "Мрамор": "marble", "Земля": "dirt", "Шерсть": "wool", "Терракота": "clay", "Трамплин": "jump", "Вывеска": "vitsign", "Адский камень": "netherrack", "Светокамень": "glowstone", "Портал": "portal", "ТНТ": "tnt", "Железная руда": "ore_iron", "Золотая руда": "ore_gold", "Доски": "planks", "Верстак": "crafting", "Печь": "furnace", "Шахматы": "chess", "Прочный блок": undefined, "Прочная решётка": "grate", "Прочный щит": "shield" };

// Действие игрока: поставить или сломать. Звук и расход вещей (в выживании) — по тому, что реально ушло в мир
function use(action, screen) {
  const n0 = shareN, m0 = shareMade, item = HOTBAR[slot];
  useInner(action, screen);
  if (shareMade > m0) { sfx("place"); if (bag && item && !NON_CONSUMABLE.has(item)) take(item); }
  else if (shareN > n0) sfx(action === "remove" ? "break" : "click");
}
function useInner(action, screen) {
  if (menuOpen || !inGame || camMode === "car" || dead || currentWeapon()) return;
  const hit = aim(screen);
  if(action==="place"&&HOTBAR[slot]==="Рулетка")return rulerPick(hit);
  if (action === "place" && hit?.object?.userData.edit?.k === "crafting") return openCrafting(3);
  if (action === "place" && hit?.object?.userData.edit?.k === "furnace") return openFurnace();

  // Убрать блок или доску под прицелом (или отменить начатую доску)
  if (action === "remove") {
    if (plankStart) plankStart = null;
    else if (hit && hit.object === plate) {
      // Копаем пол: клетка под плитой
      const dx = Math.floor(hit.point.x), dz = Math.floor(hit.point.z);
      if (!inDigArea(dx, dz)) addChat("* здесь копать нельзя: слишком далеко от старта");
      else { share({ op: "dig", x: dx, y: -1, z: dz }); if (bag) give(digDrop(-1)); burst(hit.point, 10, 8); }
    } else if (hit) {
      const t = hit.object.userData.edit;
      if (isTerr(t)) {  // земля: ломаем — значит копаем
        if (t.t === 2) addChat("* дальше бедрок, его не сломать");
        else if (t.t === 3) addChat("* в аду это не сломать");
        else { share({ op: "dig", x: t.x, y: t.y, z: t.z }); if (bag) give(harvest(t)); burst(hit.point, t.c, 8); }
        drawHotbar();
        return;
      }
      if (t.k === "rs_head") return;  // голову поршня не сломать
      if (t.p && online && !isDev) { addChat("* этот блок может сломать только разработчик"); return; }
      const eaten = DECOR[hit.object.userData.edit.k]?.[1];  // еду можно съесть
      if (eaten) {
        addChat(`* ты ${eaten}`);
        if (gameMode === "survival" && !dead) { hp = Math.min(MAX_HP, hp + 25); drawHp(); }  // еда лечит
      }
      if (t.op === "animal" && gameMode === "survival" && !dead) { hp = Math.min(MAX_HP, hp + 20); drawHp(); addChat("* ты съел животное"); }
      if (bag && !eaten) give(harvest(t),t.dim?Math.ceil(t.dim.reduce((v,x)=>v*x,1)):1);
      burst(hit.point, t.c ?? 11, 10);
      const portal = t.k === "obsidian" ? portalCellsNear(t.x, t.y, t.z) : [];
      share(undo(hit.object.userData.edit));
      if (portal.length) online?.sendEdits(portal.map(([x, y, z]) => ({ op: "unblock", x, y, z })));  // и из базы, чтобы новые игроки не увидели старый портал
    }
    drawHotbar();
    return;
  }

  // Дверь под прицелом — открываем или закрываем, чем бы ни кликнули
  const target = hit?.object.userData.edit;
  if (target?.k === "chess") return openChess(target);  // доска: меню партии
  if (target?.k === "door" || target?.k === "barrier") {
    if (!target.i) share({ ...target, open: !target.open }, true);  // железная дверь открывается только сигналом
    return;
  }
  if (target && rsInteract(target)) return;  // рычаг, кнопка, повторитель, нота
  if (bag && !have(HOTBAR[slot])) { if (HOTBAR[slot]) toast(`нет: ${HOTBAR[slot]}`); return; }  // выживание: ставить нечего
  if (ARMOR[HOTBAR[slot]]) return wear(HOTBAR[slot]);  // броню в руке — надеть
  if (itemBanned(HOTBAR[slot])) return;
  if (RS_ITEMS[HOTBAR[slot]] && hit) { rsPlace(RS_ITEMS[HOTBAR[slot]], hit); return; }
  if (HOTBAR[slot] === "Огниво") {  // поджигаем ТНТ под прицелом
    const t = hit?.object.userData.edit;
    if (t?.k === "tnt") igniteTnt(t, 3);
    else if (t?.k === "obsidian") lightPortal(t);
    return;
  }
  if (HOTBAR[slot] in KINDS && hit) {
    if (HOTBAR[slot].startsWith("Прочн") && online && !isDev) return addChat("* предметы разработчика может ставить только разработчик");
    const cell = placeCell(hit, HOTBAR[slot]);
    const e = { op: "block", x: cell?.[0], y: cell?.[1], z: cell?.[2], c: color };
    if (KINDS[HOTBAR[slot]]) e.k = KINDS[HOTBAR[slot]];
    else if (HOTBAR[slot] === "Блок" && flatBlock) e.k = "flat";
    if (e.k === "jump" && color === 0) e.c = 3;  // трамплин по умолчанию жёлтый
    // Дверь встаёт поперёк взгляда, чтобы через неё можно было пройти вперёд
    if (HOTBAR[slot].startsWith("Прочн")) e.p = true;  // такой блок сломает только разработчик
    if (["chess", "ramp", "jump", "vitsign", "chair", "stairs", "barrier", "grate", "bed", "sofa", "bench", ...Object.keys(KITCHEN), ...Object.keys(STREET), ...Object.keys(GLASSY), ...Object.keys(DECOR)].includes(e.k)) e.r = ((Math.round(yaw / (Math.PI / 2)) % 4) + 4) % 4;  // подъём — в ту сторону, куда смотришь
    if (e.k === "barrier") e.open = false;
    // Длинные предметы (шлагбаум, кровать, диван) не ставим, если их продолжение упирается в чужие блоки
    if (cell && extraCells(e).some(c => blocks.has(key(...c)))) return;
    if (e.k === "door") { e.r = ((Math.round(yaw / (Math.PI / 2)) % 4) + 4) % 4; e.open = false; }
    if (cell) share(e);
  }
  // Машина встаёт на пол или на блок под прицелом, носом туда, куда смотришь
  const ballType = Object.keys(BALL_TYPES).find(t => BALL_TYPES[t].item === HOTBAR[slot]);
  if (ballType && hit) {
    const p = hit.point.clone().addScaledVector(hit.normal, BALL_TYPES[ballType].r + 0.03);
    share({ op: "ball", id: `${myId}-${idCount++}`, t: ballType, x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2), yaw: +yaw.toFixed(2), o: myId });
  }
  if (ANIMAL_BY_ITEM[HOTBAR[slot]] && hit && hit.normal.y > 0.5) {
    if (animals.size >= 60) return addChat("* слишком много животных (до 60)");
    const [x, y, z] = hit.point.toArray().map(v => +v.toFixed(2));
    share({ op: "animal", id: `${myId}-${idCount++}`, t: ANIMAL_BY_ITEM[HOTBAR[slot]], x, y, z, yaw: +(yaw + Math.PI).toFixed(2), o: myId });  // мордой к игроку
  }
  if (HOTBAR[slot] === "Самолёт" && hit && hit.normal.y > 0.5) {
    const [x, y, z] = hit.point.toArray().map(v => +v.toFixed(2));
    share({ op: "plane", id: `${myId}-${idCount++}`, x, y: +(y + 0.8).toFixed(2), z, yaw: +yaw.toFixed(2), pt: 0, rl: 0 });
  }
  if ((HOTBAR[slot] === "Бот-боец" || HOTBAR[slot] === "Бот-строитель") && hit && hit.normal.y > 0.5)
    spawnBot(hit.point.clone(), HOTBAR[slot] === "Бот-боец" ? "fight" : "build");
  if (HOTBAR[slot] === "Танк" && hit && hit.normal.y > 0.5) {
    const [x, y, z] = hit.point.toArray().map(v => +v.toFixed(2));
    share({ op: "tank", id: `${myId}-${idCount++}`, x, y, z, yaw: +yaw.toFixed(2), tu: +yaw.toFixed(2), bp: 0 });
  }
  if (HOTBAR[slot] === "Автобус" && hit && hit.normal.y > 0.5) {
    const [x, y, z] = hit.point.toArray().map(v => +v.toFixed(2));
    share({ op: "car", id: `${myId}-${idCount++}`, x, y, z, yaw: +yaw.toFixed(2), c: color, bus: 1 });
  }
  if (HOTBAR[slot] === "Машина" && hit && hit.normal.y > 0.5) {
    const [x, y, z] = hit.point.toArray().map(v => +v.toFixed(2));
    share({ op: "car", id: `${myId}-${idCount++}`, x, y, z, yaw: +yaw.toFixed(2), c: color });
  }
  // Вагонетка встаёт на рельсы под прицелом (или на рельсы над блоком, в который целимся)
  if (HOTBAR[slot] === "Вагонетка" && hit) {
    const cell = target && [[target.x, target.y, target.z], [target.x, target.y + 1, target.z]].find(c => isRail(rsRec.get(key(...c))));
    if (!cell && hit.normal.y > 0.5) share({ op: "cart", id: `${myId}-${idCount++}`, x: +hit.point.x.toFixed(2), y: +hit.point.y.toFixed(2), z: +hit.point.z.toFixed(2), yaw: +(yaw + Math.PI).toFixed(2), o: myId });
    else if (cell) share({ op: "cart", id: `${myId}-${idCount++}`, x: cell[0] + 0.5, y: cell[1] + 0.06, z: cell[2] + 0.5, yaw: 0, o: myId });
  }
  // Текст: запоминаем, куда ставить, и спрашиваем, что написать
  if (HOTBAR[slot] === "Текст") {
    const place = textPlacement(hit);
    const c = color;
    ask("ТЕКСТ", "", 40).then(text => {
      if (text) { share({ op: "text", id: `${myId}-${idCount++}`, ...place, text, c }); sfx("place"); if (bag) take("Текст"); }
    });
  }
  // Доска: первое нажатие — начало, второе — конец
  if (HOTBAR[slot] === "Доска") {
    const point = plankPoint(hit);
    if (!plankStart) plankStart = point;
    else {
      // Примеряем доску на подсказке: нельзя ставить её внутрь себя
      fitPlank(ghostPlank, plankStart, point);
      if (plankStart.distanceTo(point) > 0.3 && !hitsPlank(ghostPlank, px, feet, pz)) {
        const ends = [...plankStart.toArray(), ...point.toArray()].map(v => +v.toFixed(3));
        share({ op: "plank", id: `${myId}-${idCount++}`, ends, c: color });
      }
      plankStart = null;
    }
    drawHotbar();
  }
}

// ---------- Управление с клавиатуры и мыши ----------

const HOLD_PAGE = 500;  // сколько держать, чтобы считалось долгим нажатием (мс)
// Блок: обычный — с текстурой кирпича, а если зажать слот 1 (клавишу 1 или палец на слоте), ставится гладкий, просто выбранного цвета. Зажать ещё раз — обратно
let flatBlock = false, flatTimer = 0;
function flatDown() {
  clearTimeout(flatTimer);
  flatTimer = setTimeout(() => {
    flatTimer = 0;
    if (HOTBAR[slot] !== "Блок") return;
    flatBlock = !flatBlock;
    drawHotbar();
  }, HOLD_PAGE);
}
const flatUp = () => { clearTimeout(flatTimer); flatTimer = 0; };

function selectSlot(n) {
  slot = n;
  plankStart = null;
  drawHotbar();
}

let lastJump = -Infinity;
function jumpTap() {  // два быстрых нажатия переключают полёт, в том числе в онлайн-лобби
  if (!inGame || menuOpen || typing || dead || gameMode !== "creative" || camMode !== "first" || drivingCar || drivingPlane || drivingTank || drivingCart) { lastJump = -Infinity; return; }
  const now = performance.now();
  if (now - lastJump <= 350) { flying = !flying; vy = 0; lastJump = -Infinity; addChat(flying ? "* полёт: пробел — вверх, Ctrl — вниз, два прыжка — выключить" : "* полёт выключен"); }
  else lastJump = now;
}
addEventListener("keydown", e => {
  if (typing || !inGame) return;
  if (e.code === "Space" && !menuOpen) { e.preventDefault(); if (!e.repeat) jumpTap(); }
  if (e.ctrlKey) e.preventDefault();  // Ctrl — присед, а не сочетания браузера вроде Ctrl+S или Ctrl+D
  keys[e.code] = true;
  if (e.code.startsWith("Digit")) {
    const n = Number(e.code.slice(5)) - 1;
    if (n >= 0 && n < BAR_SIZE) { selectSlot(n); if (!e.repeat) flatDown(); }
  }
  if (e.code === "Tab") e.preventDefault();
  if (e.code === "KeyM" && !e.repeat && (!menuOpen || panel === schemEl)) toggleSchem();
  if (e.code === "KeyE" && !e.repeat) {  // E: сесть в машину, если рядом есть; иначе инвентарь
    if (panel === inv) toggleInventory();
    else if (!menuOpen) { if (drivingCar || drivingPlane || drivingTank || drivingCart || (camMode === "first" && (nearestCart() || nearestCar() || nearestTank() || nearestPlane()))) toggleCar(); else toggleInventory(); }
  }
  if (e.code === "KeyT" && !e.repeat && !menuOpen && !typing && (isAdmin() || !online)) { e.preventDefault(); askTeleport(); }
  if (e.code === "KeyR" && !e.repeat) startReload();
  if (e.code === "KeyQ" && !e.repeat && !menuOpen) throwItem(e.ctrlKey);  // Q — выкинуть, как в майнкрафте; Ctrl+Q — всю стопку
  if (e.code === "KeyX" && !e.repeat) toggleWeaponPage();
  if (e.code === "KeyF" && !e.repeat) togglePalette();
  if (e.code === "KeyP" && !e.repeat) toggleAdmin();
  if (e.code === "KeyG" && !e.repeat && !menuOpen) throwItem(e.shiftKey);  // G — выкинуть один, Shift+G — всю стопку
  if (e.code === "KeyH" && !e.repeat && (!menuOpen || panel === gameEl)) {  // H — окно «Управление»
    if (panel === gameEl && gameScreen === "help") toggleGameMenu();
    else { gameScreen = "help"; if (panel === gameEl) drawGameMenu(); else togglePanel(gameEl, drawGameMenu); }
  }
  if (e.code === "Enter" && !menuOpen) openChat();
  // Esc — пауза: открытое меню закрывает, а в игре отпускает мышь (пауза откроется сама, см. ниже)
  if (e.code === "Escape" && !e.repeat) {
    if (panel) togglePanel(panel);
    else if (document.pointerLockElement) document.exitPointerLock();
    else toggleGameMenu();
  }
});
addEventListener("keyup", e => {
  keys[e.code] = false;
  if (e.code.startsWith("Digit")) flatUp();
});

// Захват клавиатуры: в полноэкранном режиме Chrome и Edge отдают игре даже Ctrl+W,
// поэтому присед на Ctrl не закрывает вкладку. Выйти из полного экрана — зажать Esc
async function lockKeyboard() {
  if (TOUCH || !navigator.keyboard?.lock) return;
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    await navigator.keyboard.lock();
  } catch {}
}

// Клик по экрану захватывает мышь; камера крутится полностью, вверх и вниз до упора
renderer.domElement.addEventListener("click", () => {
  if (!inGame || menuOpen || typing || TOUCH) return;
  lockKeyboard();
  lockMouse();
});

function turn(dx, dy, speed) {
  yaw -= dx * speed;
  pitch -= dy * speed;
  pitch = Math.max(-Math.PI / 2 + 0.001, Math.min(Math.PI / 2 - 0.001, pitch));
}

addEventListener("mousemove", e => {
  if (document.pointerLockElement) turn(e.movementX, e.movementY, MOUSE_SPEED * settings.mouse * camera.fov / FOV);
});
addEventListener("mousedown", e => {
  if (!document.pointerLockElement) return;
  // Обычно левая кнопка ставит, правая ломает; в настройках можно как в майнкрафте (левая ломает)
  const placeBtn = settings.swap ? 2 : 0, breakBtn = settings.swap ? 0 : 2;
  if (e.button === 0 && (drivingTank || currentWeapon())) { if (drivingTank) fireTank(); else { firing = true; tryFire(); } return; }
  if (e.button === 2 && currentWeapon()) return toggleScope();
  if (e.button === placeBtn) use("place");
  if (e.button === breakBtn) startBreak();
});
addEventListener("mouseup", e => { if (e.button === 0) firing = false; if (e.button === (settings.swap ? 0 : 2)) stopBreak(); });
addEventListener("contextmenu", e => e.preventDefault());

// ---------- Управление на телефоне ----------
// Левая половина экрана — джойстик для ходьбы, правая — поворот камеры пальцем.
// Короткое нажатие в любом месте ставит предмет туда, удержание — убирает то, что под пальцем.

const stickEl = document.getElementById("stick");
const knobEl = document.getElementById("knob");
let moveTouch = null, lookTouch = null;  // какой палец что делает
let press = null;  // палец, который пока может оказаться нажатием или удержанием

// Координаты касания → точка экрана от -1 до 1
function screenPoint(t) {
  const r = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2((t.clientX - r.left) / r.width * 2 - 1, -((t.clientY - r.top) / r.height * 2 - 1));
}

addEventListener("touchstart", e => {
  for (const t of e.changedTouches) {
    if (!inGame || menuOpen || t.target.closest(".button, #hotbar, #palette, #ask, #inv, #admin, #game, #schem, #chess, #menu, #p2p")) continue;  // пока открыто окно, камера и движение не работают: палец листает окно
    if (!press) {
      const screen = screenPoint(t);
      press = { id: t.identifier, x: t.clientX, y: t.clientY, screen, held: false };
      press.timer = setTimeout(() => {
        press.held = true;
        startBreak(screen);
        navigator.vibrate?.(30);
      }, HOLD_TIME);
    }
    if (t.clientX < innerWidth / 2 && !moveTouch) {
      moveTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
      for (const el of [stickEl, knobEl]) {
        el.style.display = "block";
        el.style.left = t.clientX + "px";
        el.style.top = t.clientY + "px";
      }
    } else if (t.clientX >= innerWidth / 2 && !lookTouch) {
      lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });

addEventListener("touchmove", e => {
  if (e.target.closest?.("#inv, #admin, #game, #schem, #chess, #palette, #menu, #p2p")) return;  // внутри окон палец листает список, а не крутит камеру
  e.preventDefault();
  for (const t of e.changedTouches) {
    // Палец заметно сдвинулся — значит, это ходьба или поворот, а не нажатие
    if (press && t.identifier === press.id && Math.hypot(t.clientX - press.x, t.clientY - press.y) > TAP_MOVE) {
      clearTimeout(press.timer);
      press.moved = true;
    }
    if (moveTouch && t.identifier === moveTouch.id) {
      let dx = t.clientX - moveTouch.x, dy = t.clientY - moveTouch.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
      stick.x = dx / STICK_RADIUS;
      stick.y = dy / STICK_RADIUS;
      knobEl.style.left = moveTouch.x + dx + "px";
      knobEl.style.top = moveTouch.y + dy + "px";
    }
    if (lookTouch && t.identifier === lookTouch.id) {
      turn(t.clientX - lookTouch.x, t.clientY - lookTouch.y, TOUCH_SPEED * settings.touch);
      lookTouch.x = t.clientX;
      lookTouch.y = t.clientY;
    }
  }
}, { passive: false });

function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (press && t.identifier === press.id) {
      clearTimeout(press.timer);
      if (press.held) stopBreak();
      if (!press.moved && !press.held && e.type === "touchend") use("place", press.screen);
      press = null;
    }
    if (moveTouch && t.identifier === moveTouch.id) {
      moveTouch = null;
      stick.x = stick.y = 0;
      stickEl.style.display = knobEl.style.display = "none";
    }
    if (lookTouch && t.identifier === lookTouch.id) lookTouch = null;
  }
}
addEventListener("touchend", touchEnd);
addEventListener("touchcancel", touchEnd);

// Полный экран (на iPhone браузер его не поддерживает — там кнопка скрыта)
const root = document.documentElement;
const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
// Если сайт уже открыт с экрана «Домой» (как приложение), кнопка не нужна
const standalone = navigator.standalone || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
if (standalone) document.querySelector('[data-action="fullscreen"]').style.display = "none";

async function toggleFullscreen() {
  // На iPhone Safari не умеет полный экран для сайтов — зато сайт можно поставить на экран «Домой»,
  // тогда он открывается как приложение, без строки адреса
  if (!requestFullscreen) {
    addChat("* Полный экран на iPhone: Поделиться → «На экран „Домой“», потом открой игру оттуда");
    return;
  }
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    screen.orientation?.unlock?.();
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    await requestFullscreen.call(root);
    // Поворот в альбомную ориентацию работает только в полноэкранном режиме
    try { await screen.orientation.lock("landscape"); } catch {}
  }
}

// Кнопки справа: прыжок держится, пока палец на кнопке
for (const button of document.querySelectorAll("#touch .button")) {
  const action = button.dataset.action;
  button.addEventListener("touchstart", e => {
    e.preventDefault();
    button.classList.add("active");
    if (action === "jump") { keys.Space = true; jumpTap(); }
    if (action === "crouch") keys.ControlLeft = true;
    if (action === "nitro") keys.ShiftLeft = true;
    if (action === "color") togglePalette();
    if (action === "inv") toggleInventory();
    if (action === "drop") throwItem(false);
    if (action === "fullscreen") toggleFullscreen();
    if (action === "chat") openChat();
    if (action === "admin") toggleAdmin();
    if (action === "game") toggleGameMenu();
    if (action === "car") toggleCar();
    if (action === "fire") { firing = true; tryFire(); }
    if (action === "reload") startReload();
    if (action === "scope") toggleScope();
    if (action === "zoom") {  // нажатия по кругу: 25° → 12° → 6° → выкл
      const next = !keys.KeyC ? ZOOM_FOV : zoomFov > 20 ? 12 : zoomFov > 9 ? 6 : 0;
      keys.KeyC = !!next;
      if (next) zoomFov = next;
      button.classList.toggle("active", !!next);
    }
  });
  button.addEventListener("touchend", () => {
    if (action !== "zoom") button.classList.remove("active");
    if (action === "jump") keys.Space = false;
    if (action === "crouch") keys.ControlLeft = false;
    if (action === "nitro") keys.ShiftLeft = false;
    if (action === "fire") firing = false;
  });
}

// ---------- ASCII-интерфейс: панель предметов и палитра ----------

const ICON_PX = 96;
const iconCache = new Map(), iconQueue = [], iconPending = new Set();
let iconBusy = false, iconR = null, iconScene = null, iconCam = null;
const iconUsesColor = name => name in KINDS || name === "Блок" || name === "Доска" || name === "Текст" || name === "Машина" || name === "Автобус";
const iconKey = name => name + "|" + (iconUsesColor(name) ? color : "");
function iconModel(name, c) {
  const fake = (k, ex = {}) => ({ op: "block", x: 0, y: 0, z: 0, c, ...(k ? { k } : {}), ...ex });
  const plain = () => vmaterial(plainTex, 0);
  let m = null;
  if (name === "Блок") m = blockMesh(fake());
  else if (name === "Доска") { m = new THREE.Mesh(plankGeo, material(woodTex, c)); m.scale.set(1, 1, 2.2); }
  else if (name === "Текст") m = textMesh("Aa", c);
  else if (RS_ITEMS[name]) { const it = RS_ITEMS[name]; m = blockMesh(it.k === "door" ? fake("door", { c: 12, r: 0, open: false, i: 1 }) : fake(it.k, { a: 3, f: 0, d: 1, on: false })); }
  else if (name.startsWith("Прочн") && name !== "Прочный щит" && name !== "Прочная решётка") m = blockMesh(fake("flat", { c: 16 }));
  else if (name === "Прочная решётка") m = blockMesh(fake("grate"));
  else if (name === "Прочный щит") m = blockMesh(fake("shield"));
  else if (name in KINDS) m = blockMesh(fake(KINDS[name], { r: 0 }));
  else if (name === "Машина") m = new THREE.Mesh(carGeo, [material(foodTex, c), glassMaterial(c), carDarkMat, carHeadMat, carTailMat]);
  else if (name === "Автобус") m = new THREE.Mesh(busGeo, [material(foodTex, c), glassMaterial(c), carDarkMat, carHeadMat, carTailMat]);
  else if (name === "Самолёт") m = new THREE.Mesh(planeGeo, plain());
  else if (name === "Танк") {
    m = new THREE.Mesh(tankHullGeo, plain());
    const turret = new THREE.Mesh(tankTurretGeo, plain()), barrel = new THREE.Mesh(tankBarrelGeo, plain());
    turret.position.y = 1.55; barrel.position.set(0, 0.05, -1.3);
    turret.add(barrel); m.add(turret);
  }
  else if (ANIMAL_BY_ITEM[name]) { m = new THREE.Mesh(ANIMALS[ANIMAL_BY_ITEM[name]].geo, plain()); m.rotation.y = 2.4; }
  else if (Object.values(BALL_TYPES).some(t => t.item === name)) m = new THREE.Mesh(Object.values(BALL_TYPES).find(t => t.item === name).geo, plain());
  else if (name === "Бот-боец" || name === "Бот-строитель") {
    m = new THREE.Group();
    const [r, g, b] = COLORS[name === "Бот-боец" ? 1 : 6].rgb;
    m.add(new THREE.Mesh(avatarGeo, new THREE.MeshLambertMaterial({ color: new THREE.Color(r / 255, g / 255, b / 255) })));
    const eyes = new THREE.Mesh(avatarEyes, eyesMat);
    eyes.position.set(0, 1.5, -0.205);
    m.add(eyes);
    m.rotation.y = Math.PI * 0.8;
  }
  else if (name === "Вагонетка") m = new THREE.Mesh(cartGeo, plain());
  else if (name === "Рулетка") m = new THREE.Mesh(mergeParts([...P(0xf1b832, box(.5,.4,.2,0,0,0)),...P(0x3b3d42,box(.28,.2,.22,0,0,0)),...P(0xd8d9d0,box(.7,.08,.12,.4,-.13,0))]),plain());
  else if (name === TOTEM) m = new THREE.Mesh(totemGeo, plain());
  else if (PICKS[name]) { m = new THREE.Mesh(pickGeos[PICKS[name]], plain()); m.rotation.z = 0.6; }
  else if (ARMOR[name]) m = new THREE.Mesh(ARMOR_GEO[ARMOR[name][0]], armorMats[ARMOR[name][1]]);
  else if (WEAPON_GEO[name]) { m = new THREE.Mesh(WEAPON_GEO[name], weaponMats); m.rotation.y = -Math.PI / 2; }
  return m;
}
function iconRender(obj, portrait = false) {
  if (!iconR) {
    iconR = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    iconR.setPixelRatio(1);
    iconR.setSize(ICON_PX, ICON_PX);
    iconR.outputColorSpace = renderer.outputColorSpace;
    iconScene = new THREE.Scene();
    iconScene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 0.65 * Math.PI));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8 * Math.PI);
    sun.position.set(2, 3, 1.5);
    iconScene.add(sun);
    iconCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 200);
  }
  const wrap = new THREE.Group();
  wrap.add(obj);
  iconScene.add(wrap);
  wrap.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(wrap), center = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2 * 1.02;
  obj.position.sub(center);
  wrap.updateMatrixWorld(true);
  iconR.setSize(ICON_PX, portrait ? ICON_PX*2 : ICON_PX);
  iconCam.left = portrait ? -r*.55 : -r; iconCam.right = portrait ? r*.55 : r; iconCam.top = r; iconCam.bottom = -r;
  iconCam.position.set(...(portrait ? [-0.2,0.1,-1] : [1,0.8,1.2])).normalize().multiplyScalar(r * 4);
  iconCam.lookAt(0, 0, 0);
  iconCam.updateProjectionMatrix();
  iconR.setClearColor(0x000000, 0);
  iconR.render(iconScene, iconCam);
  const url = iconR.domElement.toDataURL("image/png");
  iconScene.remove(wrap);
  return url;
}
const iconImg = name => { const u = iconCache.get(iconKey(name)); return u ? `<img src="${u}" alt="">` : `<span class="ph" data-ph="${name}">${ICONS[name] ?? ""}</span>`; };
function iconStep() {
  const job = iconQueue.shift();
  if (job) {
    const [name, c, k] = job;
    let url = "";
    try {
      const m = iconModel(name, c);
      if (m) { url = iconRender(m); for (const set of [barriers, lamps, tvs, shields]) set.delete(m); }  // blockMesh записывает модели в общие списки — значку там не место
    } catch {}
    iconCache.set(k, url);
    iconPending.delete(k);
    if (url) for (const el of document.querySelectorAll(".ph")) if (el.dataset.ph === name && iconKey(name) === k) el.outerHTML = `<img src="${url}" alt="">`;
  }
  if (iconQueue.length) requestAnimationFrame(iconStep); else iconBusy = false;
}
function wantIcons(names) {
  for (const name of names) {
    if (!name) continue;
    const k = iconKey(name);
    if (iconCache.has(k) || iconPending.has(k)) continue;
    iconPending.add(k);
    iconQueue.push([name, color, k]);
  }
  if (iconQueue.length && !iconBusy) { iconBusy = true; requestAnimationFrame(iconStep); }
}

// Хотбар и инвентарь из 9 клеток должны помещаться в ширину экрана
function fitBars() {
  const root = document.documentElement.style;
  // Шрифт окон и размер клеток подбираем по размеру экрана: на телефоне всё мельче и помещается
  root.setProperty("--fs", Math.max(11, Math.min(16, Math.round(Math.min(innerHeight / 27, innerWidth / 42)))) + "px");
  root.setProperty("--slot", Math.max(26, Math.min(54, Math.floor((innerWidth - 40) / 9), Math.floor((innerHeight - 80) / 9))) + "px");
}

function smelt(name) {
  if (!bag || !SMELTING[name]) return;
  const k=Math.min(8,bag[name]||0), fuel=(bag["Уголь"]||0)>=1?"Уголь":(bag["Доски"]||0)>=2?"Доски":null;
  if (!k || !fuel || (name===fuel && (bag[name]||0)<k+(fuel==="Уголь"?1:2))) return toast("Нужны материал и топливо");
  if (furnaceJobs.size) return toast("Дождись окончания плавки");
  inventoryBatch=true; take(name,k); take(fuel,fuel==="Уголь"?1:2); inventoryBatch=false; drawHotbar();
  const owner=bag, id=Date.now(), out=SMELTING[name];
  furnaceJobs.set(id,{n:out,k,owner,readyAt:Date.now()+10000});
  worldDirty=true;
  setTimeout(()=>finishSmelt(id),10000);
  drawGameMenu();

// Выживание: слева броня и фигурка, справа сетка крафта 2×2 (у верстака 3×3) и результат, ниже 27 ячеек вещей и хотбар.
// Творческий: вкладки со значками сверху и снизу, поиск, все предметы; клик кладёт предмет в выбранный слот хотбара

// Вернуть то, что лежит в сетке, обратно в вещи (окно закрыли)
function returnGrid() {
  inventoryBatch = true;
  for (let i = 0; i < 9; i++) if (craftGrid[i]) { const c = craftGrid[i]; craftGrid[i] = null; give(c.n, c.k, true); }
  inventoryBatch = false;
  cursorItem = null;
}
function openCrafting(size) {

// Что получится из сетки: рецепты с формой (можно и зеркально) или без формы (что угодно где угодно, сколько нужно)
function gridMatch() {
  const n = craftSize, cells = Array.from({ length: n * n }, (_, i) => craftGrid[Math.floor(i / n) * 3 + i % n]?.n || null);
  let r0 = n, r1 = -1, c0 = n, c1 = -1;
  cells.forEach((v, i) => { if (v) { r0 = Math.min(r0, Math.floor(i / n)); r1 = Math.max(r1, Math.floor(i / n)); c0 = Math.min(c0, i % n); c1 = Math.max(c1, i % n); } });
  if (r1 < 0) return null;
  const rows = [];
  for (let r = r0; r <= r1; r++) rows.push(cells.slice(r * n + c0, r * n + c1 + 1));
  const counts = {};
  for (const v of cells) if (v) counts[v] = (counts[v] || 0) + 1;
  for (const rc of RECIPES) {
    if (rc.shape) {
      const h = rc.shape.length, w = Math.max(...rc.shape.map(s => s.length));
      if (h !== rows.length || w !== rows[0].length) continue;
      const fits = mir => rows.every((row, r) => row.every((v, c) => { const ch = rc.shape[r][mir ? w - 1 - c : c] || " "; return ch === " " ? !v : v === rc.key[ch]; }));
      if (fits(false) || fits(true)) return rc;
    } else {
      const ks = Object.keys(rc.need);
      if (Object.keys(counts).length === ks.length && ks.every(k => counts[k] === rc.need[k])) return rc;
    }
  }
  return null;
}
// Скрафтить из сетки: из каждой занятой ячейки уходит по одному. all — сколько получится (Shift)
function craftGridOut(all) {
  let made = 0, name = gridMatch()?.out;
  inventoryBatch = true;
  for (let rc = gridMatch(); rc && made < 64; rc = all ? gridMatch() : null) {
    for (let i = 0; i < 9; i++) if (craftGrid[i]) { craftGrid[i].k--; if (!craftGrid[i].k) craftGrid[i] = null; }
    give(rc.out, rc.n, true);
    made += rc.n;
  }
  inventoryBatch = false;
  drawHotbar();
  if (made) { sfx("craft"); toast(`+${made} ${name}`); }
  drawInventory();
}
const canCraft = rc => !!bag && Object.entries(recipeNeed(rc)).every(([n, k]) => (bag[n] || 0) >= k);
const recipeNeed = rc => { if (rc.need) return rc.need; const need = {}; for (const row of rc.shape) for (const ch of row) if (ch !== " ") need[rc.key[ch]] = (need[rc.key[ch]] || 0) + 1; return need; };
const recipeFits = rc => rc.shape ? (rc.shape.length <= craftSize && Math.max(...rc.shape.map(s => s.length)) <= craftSize) : Object.values(rc.need).reduce((n,k)=>n+k,0)<=craftSize*craftSize;
// Книга рецептов (зелёная книжка): клик — скрафтить сразу, если всё есть и рецепт помещается в сетку
function craftFromBook(i) {
  const rc = RECIPES[i];
  if (!rc || !canCraft(rc)) return sfx("click");
  if (!recipeFits(rc)) return toast("этот рецепт — только на верстаке (3×3)");
  for (const [n, k] of Object.entries(recipeNeed(rc))) take(n, k);
  give(rc.out, rc.n, true);
  sfx("craft");
  toast(`+${rc.n} ${rc.out}`);
  drawInventory();
}
function bookHtml() {
  const order = RECIPES.map((r, i) => i).sort((a, b) => (canCraft(RECIPES[b]) && recipeFits(RECIPES[b])) - (canCraft(RECIPES[a]) && recipeFits(RECIPES[a])));
  wantIcons(RECIPES.map(r => r.out));
  return `<div class="crafts">${order.map(i => {
    const rc = RECIPES[i], need = recipeNeed(rc), ok = canCraft(rc) && recipeFits(rc);
    const shape = rc.shape ? `<span class="shape">${rc.shape.map(r => esc(r.padEnd(3).replace(/ /g, "·"))).join("<br>")}</span>` : "";
    const list = Object.entries(need).map(([k, c]) => `<span class="${(bag[k] || 0) >= c ? "" : "miss"}">${k} ${bag[k] || 0}/${c}</span>`).join(", ");
    return `<div class="craft${ok ? " ok" : ""}" data-craft="${i}">${iconImg(rc.out)}<div><b>${rc.out}${rc.n > 1 ? " ×" + rc.n : ""}</b>${recipeFits(rc) ? "" : " · верстак"}<br>${list}</div>${shape}</div>`;
  }).join("")}</div>`;
}

// Показывает окошко с заголовком и ждёт: вернёт введённую строку или null, если отменили
function ask(title, value = "", maxLength = 40, secret = false) {
  typing = true;
  for (const k in keys) keys[k] = false;  // чтобы игрок не продолжил идти сам

// ---------- ASCII-шейдер: сцена рисуется в маленькую картинку, каждый её пиксель — один символ ----------

// Картинка сцены вместе с глубиной: по глубине шейдер находит грани и рисует контуры
const sceneTarget = new THREE.WebGLRenderTarget(1, 1, { depthTexture: new THREE.DepthTexture(1, 1) });
const fontTex = new THREE.CanvasTexture(document.createElement("canvas"));
fontTex.flipY = false;
fontTex.generateMipmaps = false;
fontTex.minFilter = fontTex.magFilter = THREE.NearestFilter;  // символ 1 в 1 с пикселями экрана — резко, без размытия

const asciiMat = new THREE.ShaderMaterial({
  uniforms: {
    sceneTex: { value: sceneTarget.texture },
    depthTex: { value: sceneTarget.depthTexture },
    fontTex: { value: fontTex },
    grid: { value: new THREE.Vector2() },
    rampLen: { value: SHADES },
    glyphs: { value: SHADES + 4 },
    gain: { value: 0.6 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D sceneTex;
    uniform sampler2D depthTex;
    uniform sampler2D fontTex;
    uniform vec2 grid;
    uniform float rampLen;
    uniform float glyphs;
    uniform float gain;
    varying vec2 vUv;

    // 1 / расстояние до камеры. На ровной поверхности оно меняется равномерно,
    // поэтому всплеск в разнице с соседями означает грань или край предмета
    float invDepth(vec2 cell) {
      float d = texture2D(depthTex, (cell + 0.5) / grid).r * 2.0 - 1.0;
      float z = 2.0 * ${NEAR.toFixed(2)} * ${FAR.toFixed(1)} / (${(FAR + NEAR).toFixed(2)} - d * ${(FAR - NEAR).toFixed(2)});
      return 1.0 / z;
    }

    void main() {
      vec2 cell = floor(vUv * grid);
      vec2 inCell = fract(vUv * grid);
      // Сцена отрисована в 2 раза крупнее сетки: в центре клетки берётся среднее 4 пикселей
      vec3 c = texture2D(sceneTex, (cell + 0.5) / grid).rgb;
      float b = max(c.r, max(c.g, c.b));            // яркость → какой символ
      vec3 tint = b > 0.0 ? c / b : vec3(0.0);      // оттенок → цвет символа

      float w  = invDepth(cell);
      float wl = invDepth(cell + vec2(-1.0, 0.0));
      float wr = invDepth(cell + vec2( 1.0, 0.0));
      float wd = invDepth(cell + vec2(0.0, -1.0));
      float wu = invDepth(cell + vec2(0.0,  1.0));
      float edge = -(wl + wr + wd + wu - 4.0 * w) / w;  // > 0 на ближней стороне грани

      float g;
      if (edge > 0.12 && w > 1.0 / 40.0) {
        // Контур: символ | \\ - / по направлению грани, чуть ярче самой поверхности
        float a = atan(wu - wd, wr - wl);
        g = rampLen + mod(floor(a / 3.14159 * 4.0 + 0.5), 4.0);
        b = max(b, 0.6);
      } else {
        // Дизеринг (шум, не дающий полос): соседние клетки с одинаковой яркостью чуть расходятся по знакам, градиенты выходят плавными
        float ign = fract(52.9829189 * fract(dot(cell, vec2(0.06711056, 0.00583715))));
        g = clamp(floor(pow(b, 0.6) * (rampLen - 1.0) + ign), 0.0, rampLen - 1.0);  // pow — средние тона берут более плотные знаки
      }
      float ink = texture2D(fontTex, vec2((g + inCell.x) / glyphs, 1.0 - inCell.y)).r;
      gl_FragColor = vec4(tint * ink * (0.3 + 0.7 * b) * gain, 1.0);  // gain — общая яркость: на компьютере темнее, чем на телефоне
    }
  `,
});

function resize() {
  const dpr = window.devicePixelRatio || 1;
  applyLook();
  if (is3d()) {
    // Обычная 3D-картинка без символов и без второго прохода: рисуем сцену прямо на экран, разрешение подстраивается под тяжесть
    const cap = !TOUCH ? 1.25 : VERY_WEAK_GPU ? 1.0 : WEAK_GPU ? 1.15 : LOWEND ? 1.25 : 1.5;  // потолок разрешения: пикселей сцены на css-пиксель

    renderer.setPixelRatio(k);
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.domElement.style.width = innerWidth + "px";
    renderer.domElement.style.height = innerHeight + "px";

    const w = Math.floor(innerWidth * k), h = Math.floor(innerHeight * k), samples = quality <= 1 ? (LOWEND ? 0 : TOUCH ? 2 : 4) : 0;  // сглаживание: слабым телефонам не включаем
    if (!samples) { target3d?.dispose(); target3d = null; }

  // Всё считаем в настоящих пикселях экрана и рисуем 1 в 1: если холст растягивается браузером
  // (дробный масштаб экрана, как на многих компьютерах), символы расплываются
  const cols = Math.floor(innerWidth * dpr / CELL_W);
  const rows = Math.floor(innerHeight * dpr / CELL_H);

  renderer.setSize(cols * CELL_W, rows * CELL_H, false);

  sceneTarget.setSize(cols * ss, rows * ss);

  fontTex.image = buildFont(CELL_W, CELL_H);

}

// Шрифт в одну строку: SHADES символов заливки от тёмного к яркому, потом символы контуров
function buildFont(cw, ch) {
  const font = document.createElement("canvas");
  font.width = cw * (SHADES + 4);
  font.height = ch;
  const ctx = font.getContext("2d", { willReadFrequently: true });
  // Блочные символы рисуем сами, прямоугольниками: так они одинаковые на любом устройстве,
  // без швов и не зависят от того, есть ли такой знак в шрифте
  // четверти клетки: [столбец, строка]
  const quads = (...list) => list.map(q => ["rect", q[0] / 2, q[1] / 2, (q[0] + 1) / 2, (q[1] + 1) / 2]);
  const SHAPES = {
    " ": [], "█": [["rect", 0, 0, 1, 1]], "▀": [["rect", 0, 0, 1, 0.5]],
    "▁": [["rect", 0, 7 / 8, 1, 1]], "▂": [["rect", 0, 6 / 8, 1, 1]], "▃": [["rect", 0, 5 / 8, 1, 1]], "▄": [["rect", 0, 0.5, 1, 1]],
    "▆": [["rect", 0, 2 / 8, 1, 1]], "▇": [["rect", 0, 1 / 8, 1, 1]],
    "▉": [["rect", 0, 0, 7 / 8, 1]], "▊": [["rect", 0, 0, 6 / 8, 1]], "▋": [["rect", 0, 0, 5 / 8, 1]], "▌": [["rect", 0, 0, 0.5, 1]], "▍": [["rect", 0, 0, 3 / 8, 1]],
    "▘": quads([0, 0]), "▝": quads([1, 0]), "▖": quads([0, 1]), "▗": quads([1, 1]),
    "▚": quads([0, 0], [1, 1]), "▞": quads([1, 0], [0, 1]),
    "▙": quads([0, 0], [0, 1], [1, 1]), "▛": quads([0, 0], [1, 0], [0, 1]), "▜": quads([0, 0], [1, 0], [1, 1]), "▟": quads([1, 0], [0, 1], [1, 1]),
    "░": [["dots", 4]], "▒": [["dots", 2]], "▓": [["dots", 3]],
    "▮": [["rect", 0.3, 0.1, 0.7, 0.9]], "▬": [["rect", 0.1, 0.4, 0.9, 0.6]], "∎": [["rect", 0.3, 0.35, 0.7, 0.65]],
    "▯": [["frame", 0.3, 0.1, 0.7, 0.9]], "▭": [["frame", 0.1, 0.3, 0.9, 0.7]],
    "▣": [["frame", 0.1, 0.2, 0.9, 0.8], ["rect", 0.4, 0.4, 0.6, 0.6]],
    "❚": [["rect", 0.35, 0.1, 0.65, 0.9]], "❙": [["rect", 0.4, 0.1, 0.6, 0.9]], "❘": [["rect", 0.45, 0.1, 0.55, 0.9]],
    "𖣯": [["ring"]],
    "◢": [["poly", 1, 0, 1, 1, 0, 1]], "◿": [["poly", 1, 0, 1, 1, 0, 1]], "⊿": [["poly", 1, 0, 1, 1, 0, 1]],
    "◣": [["poly", 0, 0, 0, 1, 1, 1]], "◺": [["poly", 0, 0, 0, 1, 1, 1]],
    "◤": [["poly", 0, 0, 1, 0, 0, 1]], "◸": [["poly", 0, 0, 1, 0, 0, 1]],
    "◥": [["poly", 0, 0, 1, 0, 1, 1]], "◹": [["poly", 0, 0, 1, 0, 1, 1]],
    "▲": [["poly", 0.5, 0.1, 0.9, 0.9, 0.1, 0.9]], "▴": [["poly", 0.5, 0.25, 0.8, 0.75, 0.2, 0.75]], "∆": [["poly", 0.5, 0.1, 0.9, 0.9, 0.1, 0.9]],
    "▼": [["poly", 0.1, 0.1, 0.9, 0.1, 0.5, 0.9]], "▾": [["poly", 0.2, 0.25, 0.8, 0.25, 0.5, 0.75]], "∇": [["poly", 0.1, 0.1, 0.9, 0.1, 0.5, 0.9]],
    "►": [["poly", 0.1, 0.1, 0.9, 0.5, 0.1, 0.9]], "▸": [["poly", 0.2, 0.25, 0.8, 0.5, 0.2, 0.75]],
    "◄": [["poly", 0.9, 0.1, 0.1, 0.5, 0.9, 0.9]], "◂": [["poly", 0.8, 0.25, 0.2, 0.5, 0.8, 0.75]],
  };
  // Остальные знаки рисуем шрифтом, если он есть на устройстве; недостающие просто пропускаются
  const FONT = '"JetBrains Mono", Consolas, "Courier New", "Noto Sans Symbols 2", "Noto Sans Symbols", "Segoe UI Symbol", "Noto Sans Egyptian Hieroglyphs", "Noto Sans Bamum", "Noto Sans Math", "DejaVu Sans", "Apple Symbols", "Arial Unicode MS", monospace';
  const probe = document.createElement("canvas");
  probe.width = probe.height = 32;
  const pctx = probe.getContext("2d", { willReadFrequently: true });
  const look = c => {
    pctx.clearRect(0, 0, 32, 32);
    pctx.font = `24px ${FONT}`;
    pctx.textAlign = "center";
    pctx.textBaseline = "middle";
    pctx.fillStyle = "#000";
    pctx.fillText(c + "\uFE0E", 16, 16);
    return pctx.getImageData(0, 0, 32, 32).data;
  };
  const missing = look("\u{10FFFE}").join();  // как выглядит "нет такого знака"
  const hasGlyph = c => {
    if (SHAPES[c]) return true;
    const d = look(c);
    let ink = 0;
    for (let i = 3; i < d.length; i += 4) ink += d[i];
    return ink > 0 && d.join() !== missing;
  };

  const R = (v, n) => Math.round(v * n);
  function draw(c, i) {
    const x0 = i * cw;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, 0, cw, ch);  // символ не вылезает за свою клетку
    ctx.clip();
    ctx.fillStyle = "#000";
    ctx.fillRect(x0, 0, cw, ch);
    ctx.fillStyle = "#fff";
    if (!SHAPES[c]) {
      ctx.font = `${Math.round(ch * 0.9)}px ${FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(c + "\uFE0E", x0 + cw / 2, ch / 2);
    }
    for (const [kind, ...v] of SHAPES[c] || []) {
      if (kind === "rect") ctx.fillRect(x0 + R(v[0], cw), R(v[1], ch), Math.max(1, R(v[2], cw) - R(v[0], cw)), Math.max(1, R(v[3], ch) - R(v[1], ch)));
      if (kind === "frame") {
        const [x1, y1, x2, y2] = [x0 + R(v[0], cw), R(v[1], ch), x0 + R(v[2], cw), R(v[3], ch)];
        ctx.fillRect(x1, y1, x2 - x1, 1); ctx.fillRect(x1, y2 - 1, x2 - x1, 1);
        ctx.fillRect(x1, y1, 1, y2 - y1); ctx.fillRect(x2 - 1, y1, 1, y2 - y1);
      }
      if (kind === "dots") {  // тени ░▒▓ — шахматка: каждая 4-я, 2-я или 3 из 4 точек
        for (let py = 0; py < ch; py++) for (let px = 0; px < cw; px++) {
          const on = v[0] === 4 ? px % 2 === 0 && py % 2 === 0 : v[0] === 2 ? (px + py) % 2 === 0 : !(px % 2 === 1 && py % 2 === 1);
          if (on) ctx.fillRect(x0 + px, py, 1, 1);
        }
      }
      if (kind === "poly") {
        ctx.beginPath();
        ctx.moveTo(x0 + v[0] * cw, v[1] * ch);
        ctx.lineTo(x0 + v[2] * cw, v[3] * ch);
        ctx.lineTo(x0 + v[4] * cw, v[5] * ch);
        ctx.closePath();
        ctx.fill();
      }
      if (kind === "ring") {
        ctx.beginPath();
        ctx.arc(x0 + cw / 2, ch / 2, Math.min(cw, ch) * 0.35, 0, Math.PI * 2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Сколько "чернил" у каждого символа: рисуем его и считаем среднюю яркость
  const measured = [...new Set(gfxMode === "ascii" ? ASCII_CHARS : CHARS)].filter(hasGlyph).map(c => {
    draw(c, 0);
    const data = ctx.getImageData(0, 0, cw, ch).data;
    let sum = 0;
    for (let i = 0; i < data.length; i += 4) sum += data[i];
    return { c, ink: sum / (cw * ch * 255) };
  });
  const maxInk = Math.max(...measured.map(m => m.ink));

  // В каждую ступень яркости кладём символ, у которого чернил ближе всего к нужному
  for (let i = 0; i < SHADES; i++) {
    const want = i / (SHADES - 1) * maxInk;
    let best = measured[0];
    for (const m of measured) if (Math.abs(m.ink - want) < Math.abs(best.ink - want)) best = m;
    // Ровные символы (пусто, ░▒▓, █) берём, если они почти так же подходят: иначе поверхности выходят полосатыми
    if (gfxMode !== "ascii") for (const m of measured) if (" ░▒▓█".includes(m.c) && Math.abs(m.ink - want) <= 0.07) best = m;
    draw(best.c, i);
  }
  [...EDGES_BY_MODE[gfxMode]].forEach((c, i) => draw(c, SHADES + i));
  return font;
}

// Все данные идут через серверы Google, поэтому игра работает в любой сети, даже на мобильном
// интернете. Постройки лобби хранятся в базе и не пропадают, когда все выходят.

//   players/{код}/{id игрока}  — где стоит игрок, куда смотрит, его цвет, ник и присел ли он
//   world/{код}/{id предмета}  — блоки, доски и надписи (те же объекты, что получает edit())

// Firebase загружается, только когда он нужен: одиночная игра работает и без него
let firebase = null;
async function loadFirebase() {
  if (firebase) return firebase;
  const [{ initializeApp }, fb, fa] = await Promise.all([import("firebase/app"), import("firebase/database"), import("firebase/auth")]);
  const app = initializeApp(FIREBASE_CONFIG);
  // Вход по аккаунту работает, только если в настройках есть apiKey
  firebase = { ...fb, ...fa, db: fb.getDatabase(app), auth: FIREBASE_CONFIG.apiKey ? fa.getAuth(app) : null };
  return firebase;
}

// Вход в Firebase перед сетевой игрой. Обычные игроки входят анонимно (незаметно для них),
// а ник xreamm требует пароль: его проверяет сервер Google, поэтому стать разработчиком,
// просто назвавшись xreamm, нельзя. Возвращает id игрока
async function signIn() {
  const { auth, signInAnonymously, signInWithEmailAndPassword, signOut } = await loadFirebase();
  const wantDev = nick.toLowerCase() === DEV_NICK;
  if (!auth) {
    if (wantDev) throw new Error("вход разработчика ещё не настроен");
    return myId;  // без apiKey — как раньше, без входа
  }
  await auth.authStateReady();
  let user = auth.currentUser;
  if (user && !!user.email !== wantDev) { await signOut(auth); user = null; }
  if (!user && wantDev) {
    const pass = await ask("ПАРОЛЬ РАЗРАБОТЧИКА", "", 64, true);
    if (!pass) throw new Error("этот ник только для разработчика");
    try {
      user = (await signInWithEmailAndPassword(auth, DEV_EMAIL, pass)).user;
    } catch {
      throw new Error("неверный пароль");
    }
  }
  if (!user) user = (await signInAnonymously(auth)).user;
  isDev = !!user.email;
  return user.uid;
}

  const looks = group.userData.looks ??= {};
  if (type && !looks[type]) { const m = new THREE.Mesh(BALL_TYPES[type].geo, vmaterial(plainTex, 0)); m.position.y = BALL_TYPES[type].r; group.add(m); looks[type] = m; }
  for (const c of group.children) if (!Object.values(looks).includes(c)) c.visible = !type;
  for (const t in looks) looks[t].visible = t === type;
  group.userData.look = type ? looks[type] : null;
  group.userData.lookType = type;
}
function rollFigure(group, dx, dz) {
  const ball = group.userData.look, len = Math.hypot(dx, dz);
  if (!ball || len < 1e-5) return;
  const c = Math.cos(-group.rotation.y), sn = Math.sin(-group.rotation.y), ax = dz, az = -dx;
  ball.rotateOnWorldAxis(new THREE.Vector3(ax * c + az * sn, 0, -ax * sn + az * c).normalize(), len / (BALL_TYPES[group.userData.lookType].r * group.scale.x));
}

const isNpc = id => id.startsWith("vit-") || id.startsWith("bot-");  // помощники и боты — не настоящие игроки
function avatar(id) {
  if (others.has(id)) return others.get(id);
  const mat = new THREE.MeshLambertMaterial();
  const group = makeFigure(mat);
  // Ник над головой — обычный текст поверх картинки, чтобы читался чётко
  const label = document.createElement("pre");
  label.className = "nick";
  labels.append(label);
  const a = { group, mat, label, nick: "", target: new THREE.Vector3(), yaw: 0, fresh: true };
  others.set(id, a);
  return a;
}

function updateAvatar(id, p) {
  const dev = p.dev === true;
  const a = avatar(id);
  a.target.set(p.x, p.f, p.z);
  a.yaw = p.yaw;
  a.size = Math.min(4, Math.max(0.25, +p.s || 1));
  a.group.scale.set(a.size, a.size * (p.cr ? 0.7 : 1), a.size);  // присел — фигурка ниже
  a.invis = p.i === 1;
  a.group.visible = !p.dd && !a.invis;  // погибший и невидимый пропадают
  setHand(a.group, typeof p.w === "string" ? p.w : null);
  setBallLook(a.group, p.v === 1 ? "verity" : BALL_TYPES[p.v] ? p.v : null);
  setArmorLook(a.group, typeof p.ar === "string" ? p.ar.slice(0, 4) : "");
  const [r, g, b] = (COLORS[p.c] || COLORS[0]).rgb;
  a.mat.color.setRGB(r / 255, g / 255, b / 255);
  a.nick = String(p.nick).slice(0, 24);
  a.dev = dev;
  // Дрон другого игрока: модель летает там, где он
  if (Array.isArray(p.d)) {
    a.drone ??= makeDrone();
    a.droneTarget = new THREE.Vector3(p.d[0], p.d[1], p.d[2]);
    a.drone.rotation.y = +p.d[3] || 0;
    if (a.drone.visible === false || !a.drone.userData.placed) { a.drone.position.copy(a.droneTarget); a.drone.userData.placed = true; }
    a.drone.visible = true;
  } else if (a.drone) a.drone.visible = false;
  a.label.textContent = devPrefix(dev, prefixes[id]) + a.nick;  // textContent: чужой ник выводится только как текст
  a.label.classList.toggle("dev", dev);
  a.label.style.color = `rgb(${r},${g},${b})`;
  if (a.fresh) {
    a.group.position.copy(a.target);
    a.fresh = false;
    if (!isNpc(id)) addChat(`* ${a.nick} зашёл`);
  }
}

function removeAvatar(id) {
  const a = others.get(id);
  if (!a) return;
  scene.remove(a.group);
  if (a.drone) scene.remove(a.drone);
  a.label.remove();
  others.delete(id);
  if (!isNpc(id)) addChat(`* ${a.nick} вышел`);
}

// Под каким ключом изменение лежит в базе: блок — по клетке, доска и надпись — по своему id
const worldKey = e => e.op.endsWith("block") ? `b${e.x}_${e.y}_${e.z}` : e.op.endsWith("dig") ? `d${e.x}_${e.y}_${e.z}` : e.op === "mined" ? `m${e.x}_${e.y}_${e.z}` : e.id;
// Обратное изменение: что сделать, когда предмет удалили из базы
// Блок природы в базе не лежит (он у всех получается из seed), поэтому его поломку записываем отдельно — «mined»
const undo = e => e.op === "block" && e.g ? { op: "mined", x: e.x, y: e.y, z: e.z } : e.op === "block" ? { op: "unblock", x: e.x, y: e.y, z: e.z } : e.op === "dig" ? { op: "undig", x: e.x, y: e.y, z: e.z } : { op: "un" + e.op, id: e.id };

async function joinLobby(code, me) {
  const { db, ref, get, set, push, remove, update, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, query, limitToLast, serverTimestamp, goOffline, goOnline } = await loadFirebase();
  // Часы на устройствах расходятся, поэтому время сообщений берём у сервера:
  // serverOffset — насколько часы этого устройства отстают от часов сервера
  let serverOffset = 0;
  onValue(ref(db, ".info/serverTimeOffset"), s => serverOffset = s.val() || 0);
  const serverNow = () => Date.now() + serverOffset;
  // Если правила базы ещё старые и бан не прочитать — просто входим
  const banned = await get(ref(db, `bans/${code}/${me}`)).then(s => s.exists(), () => false);
  if (banned) return leave("тебя забанили в этом лобби");

  const myPlayer = ref(db, `players/${code}/${me}`);
  const presence = ref(db, `lobbyInfo/${code}/online/${me}`);
  // Закрыл вкладку или пропал интернет — сервер сам уберёт игрока из лобби
  onDisconnect(myPlayer).remove();
  onDisconnect(presence).remove();
  set(presence, true);

  const world = ref(db, `world/${code}`);
  onChildAdded(world, s => netEdit(s.val()));
  onChildChanged(world, s => netEdit(s.val(), true));  // открыли или закрыли дверь
  onChildRemoved(world, s => { if (validEdit(s.val())) netEdit(undo(s.val())); });

  const players = ref(db, `players/${code}`);
  const onPlayer = s => { if (s.key !== me && !bots.has(s.key) && !(helpers && s.key.startsWith("vit-"))) try { updateAvatar(s.key, s.val()); } catch {} };
  onChildAdded(players, onPlayer);
  onChildChanged(players, onPlayer);
  onChildRemoved(players, s => removeAvatar(s.key));

  // Показываем только свежие сообщения, старые уже исчезли бы сами
  onChildAdded(query(ref(db, `chat/${code}`), limitToLast(10)), s => {
    const m = s.val();
    if (serverNow() - m.t < CHAT_TIME) addChat(`${devPrefix(m.dev === true, m.pre)}${String(m.nick).slice(0, 16)}: ${String(m.text).slice(0, 100)}`);
    if (serverNow() - m.t < 3000) memeCheck(m.text);
  });

  // Разработчик кикнул или забанил — выходим в главное меню
  const kick = ref(db, `kicks/${code}/${me}`);
  onValue(kick, s => { if (s.val()) remove(kick).finally(() => leave("тебя кикнул разработчик")); });
  onValue(ref(db, `bans/${code}/${me}`), s => { if (s.val()) leave("тебя забанили в этом лобби"); });
  onValue(ref(db, `lobbyInfo/${code}/name`), s => {
    if (!s.exists()) return leave("лобби удалено разработчиком");
    lobbyName = String(s.val()).slice(0, 22);
    drawLobbyLabel();
  });
  // Доступ поменяли: тех, кому он закрыт, выводим в меню. Админов проверяем, когда их список уже загружен
  let adminsLoaded = false;
  const checkAccess = () => {
    if (adminsLoaded && !isDev && (lobbyAccess === "dev" || (lobbyAccess === "admins" && !adminGranted))) leave("доступ к лобби закрыт");
  };
  onValue(ref(db, `lobbyInfo/${code}/ban`), s => setBan(typeof s.val() === "string" ? s.val().split(",") : []));
  onValue(ref(db, `lobbyInfo/${code}/access`), s => {
    lobbyAccess = ACCESS.includes(s.val()) ? s.val() : "all";
    checkAccess();
    if (panel === gameEl) drawGameMenu();
  });
  // Объявление разработчика — крупно сверху экрана
  onValue(ref(db, `announce/${code}`), s => {
    const a = s.val();
    if (a && serverNow() - a.t < 10000) showAnnouncement(String(a.text).slice(0, 80), String(a.by || "").slice(0, 16));
  });
  meId = me;
  // Мне нанесли урон: читаем и стираем запись
  onChildAdded(ref(db, `hits/${code}/${me}`), s => {
    const h = s.val();
    remove(s.ref);
    if (h && h.by !== me && Number.isFinite(h.dmg) && serverNow() - h.t < 8000)
      damage(Math.min(h.dmg, 250), `${String(h.nick).slice(0, 16)} (${String(h.w).slice(0, 10)}${h.h ? ", в голову" : ""})`);
  });
  // Выстрелы и ракеты других игроков — только картинка
  onChildAdded(query(ref(db, `fx/${code}`), limitToLast(20)), s => {
    const f = s.val();
    if (f && f.by !== me && serverNow() - f.t < 3000) try { handleFx(f); } catch {}
  });
  // Разработчик поменял мой размер
  onValue(ref(db, `sizes/${code}/${me}`), s => {
    const k = s.val();
    if (SIZES.includes(k)) setSize(k);
  });
  const tp = ref(db, `tp/${code}/${me}`);
  onValue(tp, s => {
    const v = s.val();
    if (!v) return;
    if ([v.x, v.y, v.z].every(Number.isFinite)) { px = v.x; feet = v.y; pz = v.z; vy = 0; addChat("* тебя телепортировал разработчик"); }
    remove(tp);
  });
  // Шутка от разработчика: показываем и стираем запись
  const trollRef = ref(db, `troll/${code}/${me}`);
  onValue(trollRef, s => {
    const v = s.val();
    if (!v) return;
    remove(trollRef);
    if (typeof v.type === "string" && Math.abs(serverNow() - v.t) < 60000) runTroll(v.type, typeof v.text === "string" ? v.text : "");
  });
  onValue(ref(db, `prefixes/${code}`), s => {
    prefixes = s.val() || {};
    for (const [id, a] of others) a.label.textContent = devPrefix(a.dev, prefixes[id]) + a.nick;
    if (panel === adminEl) drawAdmin();
  });
  // Разработчик выдал или забрал режим бога
  onValue(ref(db, `gods/${code}`), s => {
    const was = isGod();
    godIds = s.val() || {};
    godGranted = !!godIds[me];
    if (!was && isGod()) { hp = MAX_HP; addChat("* тебе выдали режим бога: тебя нельзя убить"); }
    if (was && !isGod()) addChat("* режим бога у тебя забрали");
    drawHp();
    if (panel === adminEl) drawAdmin();
  });
  // Разработчик выдал или забрал админ-панель
  onValue(ref(db, `admins/${code}`), s => {
    const was = isAdmin();
    adminIds = s.val() || {};
    adminGranted = !!adminIds[me];
    adminsLoaded = true;
    checkAccess();
    showAdminButton();
    if (!was && isAdmin()) addChat(TOUCH ? "* тебе выдали админ-панель (кнопка АДМИН)" : "* тебе выдали админ-панель (P)");
    if (was && !isAdmin()) {
      addChat("* у тебя забрали админ-панель");
      asBall = null;
      asInvis = false;
      flying = false;
      setSize(1);
      endDrone();
      if (camMode !== "first") camMode = "first";
      if (panel === adminEl) togglePanel(adminEl);
    } else if (panel === adminEl) drawAdmin();
  });

  const helperSeen = new Set(), botSeen = new Set();
  online = {
    // Несколько изменений уходят одним запросом (взрывы, воронки, импорт), а не сотней отдельных
    sendEdits: list => {
      if (idle) return;  // отключились за бездействием: копить запросы до возвращения незачем
      if (list.length <= 2) {
        for (const e of list) { const r = ref(db, `world/${code}/${worldKey(e)}`); if (e.op.startsWith("un")) remove(r); else set(r, e); }
        return;
      }
      for (let i = 0; i < list.length; i += 400) {
        const up = {};
        for (const e of list.slice(i, i + 400)) up[worldKey(e)] = e.op.startsWith("un") ? null : e;
        update(ref(db, `world/${code}`), up).catch(() => {});
      }
    },
    // Позицию шлём, только если она изменилась, и только изменившиеся поля: ник, цвет и прочее почти не меняются,
    // а база рассылает остальным игрокам тоже только изменения. Первый раз (и после возвращения из «сна») — целиком
    sendPose: () => {
      const p = buildPose(), diff = {};
      for (const k in p) if (JSON.stringify(p[k]) !== JSON.stringify(sentPose[k])) diff[k] = p[k];
      for (const k in sentPose) if (!(k in p)) diff[k] = null;  // поле пропало (убрал оружие, вышел из дрона)
      if (!Object.keys(diff).length) return;
      (sentPose.nick === undefined ? set(myPlayer, p) : update(myPlayer, diff)).catch(() => {});
      sentPose = p;
    },
    // Неактивный игрок (5 минут без действий или свёрнутая вкладка) отключается от базы: сервер сам убирает
    // его из лобби, трафик не тратится. Вернулся — подключаемся снова и заново отмечаемся в лобби
    sleep: () => { goOffline(db); },
    wake: () => {
      goOnline(db);
      onDisconnect(myPlayer).remove();
      onDisconnect(presence).remove();
      set(presence, true);
      sentPose = {};
      helperSeen.clear(); botSeen.clear();  // их onDisconnect тоже сработал — зарегистрируем заново при следующей отправке
    },
    sendChat: text => push(ref(db, `chat/${code}`), { nick, text, t: serverTimestamp(), dev: isDev, pre: prefixes[me] || null }),
    // Только для разработчика: правила базы не дадут сделать это никому другому
    // Заодно стираем запись игрока: если его вкладка давно мертва, сам он её уже не уберёт
    kick: id => Promise.all([set(ref(db, `kicks/${code}/${id}`), true), remove(ref(db, `players/${code}/${id}`)), remove(ref(db, `lobbyInfo/${code}/online/${id}`))])
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    ban: id => Promise.all([set(ref(db, `bans/${code}/${id}`), { nick: others.get(id)?.nick || "", t: Date.now() }), remove(ref(db, `players/${code}/${id}`)), remove(ref(db, `lobbyInfo/${code}/online/${id}`))])
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    // Убирает тех, кто числится в игре, но не в сети (вкладку закрыли, а запись осталась)
    // Сначала пробуем убрать весь раздел разом; если база не берёт (слишком много данных) — стираем по частям
    clearWorld: async keys => {
      try { await remove(ref(db, `world/${code}`)); return; } catch {}
      try {
        for (let i = 0; i < keys.length; i += 500) await update(ref(db, `world/${code}`), Object.fromEntries(keys.slice(i, i + 500).map(k => [k, null])));
      } catch (err) { addChat(`* очистка не вышла: ${err.code || err.message}`); }
    },
    cleanGhosts: async () => {
      const [players, onSnap] = await Promise.all([get(ref(db, `players/${code}`)), get(ref(db, `lobbyInfo/${code}/online`))]);
      const on = onSnap.val() || {};
      const ghosts = [];
      players.forEach(p => { if (p.key !== me && !(p.key in on) && !bots.has(p.key) && !(helpers && p.key.startsWith("vit-"))) ghosts.push(p.key); });
      await Promise.all(ghosts.map(id => remove(ref(db, `players/${code}/${id}`))));
      addChat(`* убрано застрявших игроков: ${ghosts.length}`);
    },
    // Если правила базы не дают записать — говорим об этом, а не молчим
    setPrefix: (id, text) => (text ? set(ref(db, `prefixes/${code}/${id}`), text) : remove(ref(db, `prefixes/${code}/${id}`)))
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    // Вызвать игрока к себе: его клиент сам прочитает точку и сотрёт её
    summon: id => set(ref(db, `tp/${code}/${id}`), { x: px, y: feet, z: pz })
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    // Урон и эффекты оружия. Урон считает стрелявший, а жертва сама вычитает его у себя из HP
    hit: (id, dmg, w, head, who) => {
      if (gameMode !== "survival") return;
      push(ref(db, `hits/${code}/${id}`), { by: me, nick: who || nick, dmg: Math.round(Math.min(dmg, 250)), w, h: !!head, t: serverTimestamp() }).catch(() => {});
    },
    fx: f => push(ref(db, `fx/${code}`), { ...f, by: me, t: serverTimestamp() }).then(r => setTimeout(() => remove(r), 4000)).catch(() => {}),
    setSize: (id, k) => set(ref(db, `sizes/${code}/${id}`), k)
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    grant: (id, on) => (on ? set(ref(db, `admins/${code}/${id}`), true) : remove(ref(db, `admins/${code}/${id}`)))
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    // Помощники «Вкусно и точка» летают как игроки: пишем их позиции, чтобы их видели все
    setGod: (id, on) => (on ? set(ref(db, `gods/${code}/${id}`), true) : remove(ref(db, `gods/${code}/${id}`)))
      .catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    troll: (id, type, text) => set(ref(db, `troll/${code}/${id}`), { type, t: Date.now(), ...(text ? { text: String(text).slice(0, 60) } : {}) }).catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    setHelpers: list => list.forEach((h, i) => {
      const r = ref(db, `players/${code}/vit-${i}`);
      if (!helperSeen.has(i)) { helperSeen.add(i); onDisconnect(r).remove(); }
      set(r, h).catch(() => {});
    }),
    setBots: list => list.forEach(({ id, p }) => {
      const r = ref(db, `players/${code}/${id}`);
      if (!botSeen.has(id)) { botSeen.add(id); onDisconnect(r).remove(); }
      set(r, p).catch(() => {});
    }),
    removeBot: id => { botSeen.delete(id); remove(ref(db, `players/${code}/${id}`)).catch(() => {}); },
    setBan: list => update(ref(db, `lobbyInfo/${code}`), { ban: list.join(",") }).catch(() => addChat("* не вышло: обнови правила базы в Firebase")),
    clearHelpers: () => { for (const i of helperSeen) remove(ref(db, `players/${code}/vit-${i}`)).catch(() => {}); helperSeen.clear(); },
    announce: text => set(ref(db, `announce/${code}`), { text, by: nick, t: serverTimestamp() })
      .catch(() => addChat("* объявление не отправилось: обнови правила базы в Firebase")),
  };
}

// Выход в главное меню: проще всего перезагрузить страницу, а причину показать в меню
function leave(note) {
  try {
    sessionStorage.setItem("note", note);
    if (document.fullscreenElement) sessionStorage.setItem("fs", "1");
  } catch {}
  location.reload();
}

// ---------- Объявления ----------

const announceEl = document.getElementById("announce");
let announceTimer = 0;
function showAnnouncement(text, by) {
  announceEl.innerHTML = `<div class="ann"><b>ОБЪЯВЛЕНИЕ${by ? " ОТ " + esc(by.toUpperCase()) : ""}</b>${esc(text)}</div>`;
  announceEl.style.display = "block";
  addChat(`[Объявление${by ? " от " + by : ""}] ${text}`);
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => announceEl.style.display = "none", 8000);
}

// ---------- Координаты в углу экрана (админам) и телепорт по ним ----------
// Высота как в майнкрафте: плита (поверхность) — Y 60, ниже Y 0 — глубинный сланец, дно (бедрок) — Y −41
const Y_SHOW = 60;
const coordsEl = Object.assign(document.createElement("pre"), { id: "coords" });
coordsEl.style.cssText = "position:fixed;left:16px;top:60px;z-index:20;margin:0;display:none;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px";
document.body.append(coordsEl);
let lastCoords = "";
function updateCoords() {
  const show = inGame && (isAdmin() || !online) && camMode !== "drone";
  const text = show ? `X ${px.toFixed(1)}  Y ${(feet + Y_SHOW).toFixed(1)}  Z ${pz.toFixed(1)}\n${TOUCH ? "нажми" : "T"} — телепорт` : "";
  if (text !== lastCoords) { lastCoords = text; coordsEl.textContent = text; coordsEl.style.display = show ? "block" : "none"; }
}
// Принимает «x y z» или «x z» (тогда встаём на землю)
function askTeleport() {
  if (!isAdmin() && online) return;
  ask("ТЕЛЕПОРТ: x y z", `${Math.round(px)} ${Math.round(feet + Y_SHOW)} ${Math.round(pz)}`, 40).then(text => {
    const n = String(text || "").split(/[\s,;]+/).filter(Boolean).map(Number);
    if (n.length < 2 || n.length > 3 || !n.every(v => Number.isFinite(v) && Math.abs(v) < 5000)) return text && addChat("* не понял координаты: нужно x y z");
    px = n[0]; pz = n[n.length - 1];
