<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ASCII Baseplate</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  pre {
    position: absolute;
    margin: 0;
    color: #fff;
    font: 16px/1 Consolas, "Courier New", monospace;
  }
  #crosshair {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #hotbar {
    left: 16px;
    bottom: 16px;
  }
  #hotbar .slot { display: inline-block; cursor: pointer; }
  #palette {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
  }
  #palette .option { cursor: pointer; }
  #palette .option:hover { background: #333; }

  /* Управление для телефона: видно только на сенсорных экранах */
  #touch { display: none; }
  #touch .button { right: 16px; }
  #touch .button.active { color: #000; background: #fff; }
  #stick, #knob {
    display: none;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  @media (pointer: coarse) {
    pre { font-size: 13px; }
    #touch { display: block; }
    #crosshair { display: none; }  /* на телефоне строят касанием, прицел не нужен */
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "trystero": "https://cdn.jsdelivr.net/npm/trystero@0.25.4/+esm"
    }
  }
</script>
</head>
<body>
<pre id="crosshair">+</pre>
<pre id="hotbar"></pre>
<pre id="palette"></pre>
<div id="touch">
  <pre class="button" data-action="fullscreen" style="top: 16px">┌─────────┐
│  ЭКРАН  │
└─────────┘</pre>
  <pre class="button" data-action="color"  style="bottom: 150px">┌─────────┐
│  ЦВЕТ   │
└─────────┘</pre>
  <pre class="button" data-action="jump"   style="bottom: 90px">┌─────────┐
│ ПРЫЖОК  │
└─────────┘</pre>
  <pre id="stick">  .---.
 /     \
|       |
 \     /
  '---'</pre>
  <pre id="knob">@</pre>
</div>
<script type="module">
import * as THREE from "three";

// Цвета палитры
const COLORS = [
  { name: "Белый",      rgb: [255, 255, 255] },
  { name: "Красный",    rgb: [255,  60,  60] },
  { name: "Оранжевый",  rgb: [255, 150,  40] },
  { name: "Жёлтый",     rgb: [255, 230,  60] },
  { name: "Зелёный",    rgb: [ 70, 230,  90] },
  { name: "Голубой",    rgb: [ 70, 220, 255] },
  { name: "Синий",      rgb: [ 70, 110, 255] },
  { name: "Фиолетовый", rgb: [190,  90, 255] },
  { name: "Розовый",    rgb: [255, 110, 200] },
];

// Панель предметов: блок, доска, остальные слоты пустые
const HOTBAR = ["Блок", "Доска", null, null, null];

const TOUCH = matchMedia("(pointer: coarse)").matches;  // телефон или планшет

const SIZE = 64;           // размер плиты в блоках
const CELL_W = 4;          // ширина одного символа в пикселях (меньше — детальнее)
const CELL_H = 7;          // высота одного символа в пикселях
const MOVE_SPEED = 5;      // блоков в секунду
const MOUSE_SPEED = 0.0025;
const TOUCH_SPEED = 0.006; // поворот камеры пальцем
const STICK_RADIUS = 50;   // радиус джойстика в пикселях
const TAP_MOVE = 10;       // если палец сдвинулся больше — это не нажатие, а движение
const HOLD_TIME = 500;     // столько миллисекунд держать палец, чтобы убрать блок
const RADIUS = 0.3;        // половина ширины игрока
const HEIGHT = 1.75;       // рост игрока
const EYE = 1.5;           // высота глаз
const STEP = 0.3;          // на такую высоту можно зайти без прыжка (доски, пандусы)
const GRAVITY = 25;
const JUMP_SPEED = Math.sqrt(2 * GRAVITY * 1.25);  // прыжок на 1.25 блока
const REACH = 8;           // как далеко можно строить
const AIR_DIST = 4;        // точка доски в воздухе — на таком расстоянии перед глазами
const PLANK_W = 1;         // ширина доски
const PLANK_T = 0.15;      // толщина доски
const NEAR = 0.1, FAR = 150;

// Символы для заливки. Порядок не важен: при запуске каждый измеряется по количеству
// "чернил" и раскладывается по SHADES ступеням яркости
const CHARS = " .'`^\",:;Il!i><~+?][}{1)(tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$░▒▓█";
const SHADES = 64;
// Символы для контуров — по направлению грани
const EDGES = "|\\-/";

// ---------- Состояние игрока и интерфейса ----------

let px = SIZE / 2, pz = SIZE / 2, feet = 0;  // позиция (feet — высота ступней)
let vy = 0, onGround = true;
let yaw = 0, pitch = 0;
let slot = 0, color = 0, menuOpen = false;
let plankStart = null;  // первая точка доски, пока не выбрана вторая

const keys = {};
const stick = { x: 0, y: 0 };  // наклон джойстика на телефоне, от -1 до 1

// ---------- Сцена ----------

THREE.ColorManagement.enabled = false;  // цвета как есть, без гамма-преобразований

const renderer = new THREE.WebGLRenderer();
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 20, 70);  // дальше — темнее

const camera = new THREE.PerspectiveCamera(70, 1, NEAR, FAR);
camera.rotation.order = "YXZ";

// В three.js яркость света делится на π, поэтому умножаем на π
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 1.0 * Math.PI);
sun.position.set(SIZE / 2 + 30, 50, SIZE / 2 + 15);
sun.target.position.set(SIZE / 2, 0, SIZE / 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 150 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// Текстуры рисуем сами на canvas — так ничего не надо загружать
function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// Плита: серые плитки с кружком-шипом, как baseplate в Роблоксе
const plateTex = canvasTexture(64, 64, ctx => {
  ctx.fillStyle = "#5a5a5a"; ctx.fillRect(0, 0, 64, 64);
  ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, 64, 64);
  ctx.strokeStyle = "#7a7a7a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(32, 32, 14, 0, Math.PI * 2); ctx.stroke();
});
plateTex.wrapS = plateTex.wrapT = THREE.RepeatWrapping;
plateTex.repeat.set(SIZE, SIZE);

const plate = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE, SIZE),
  new THREE.MeshLambertMaterial({ map: plateTex })
);
plate.rotation.x = -Math.PI / 2;
plate.position.set(SIZE / 2, 0, SIZE / 2);
plate.receiveShadow = true;
scene.add(plate);

// Блок: кирпичи с тёмной рамкой по краю, чтобы были видны грани
const brickTex = canvasTexture(64, 64, ctx => {
  ctx.fillStyle = "#e0e0e0"; ctx.fillRect(0, 0, 64, 64);
  ctx.fillStyle = "#808080";
  for (let row = 0; row < 4; row++) {
    ctx.fillRect(0, row * 16, 64, 2);
    const shift = row % 2 ? 16 : 0;
    for (let x = shift; x < 64; x += 32) ctx.fillRect(x, row * 16, 2, 16);
  }
  ctx.strokeStyle = "#555"; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 64, 64);
});

// Доска: продольные волокна дерева
const woodTex = canvasTexture(32, 128, ctx => {
  ctx.fillStyle = "#d8d8d8"; ctx.fillRect(0, 0, 32, 128);
  ctx.fillStyle = "#9a9a9a";
  for (let x = 3; x < 32; x += 6) ctx.fillRect(x, 0, 1, 128);
  ctx.strokeStyle = "#666"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, 32, 128);
});

// Один материал на каждую пару "текстура + цвет"
const materials = {};
function material(tex, c) {
  const key = tex.uuid + c;
  const [r, g, b] = COLORS[c].rgb;
  return materials[key] ??= new THREE.MeshLambertMaterial({ map: tex, color: new THREE.Color(r / 255, g / 255, b / 255) });
}

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const plankGeo = new THREE.BoxGeometry(PLANK_W, PLANK_T, 1);  // длина задаётся масштабом по Z

const blocks = new Map();  // "x,y,z" → меш блока
const planks = new Map();  // id доски → её меш
const solids = [plate];    // всё, во что можно целиться

const key = (x, y, z) => `${x},${y},${z}`;
const myId = Math.random().toString(36).slice(2, 10);  // чтобы id досок не совпали с чужими
let plankCount = 0;

// Все изменения мира проходят через edit() — так их легко повторить у других игроков.
// Изменение — это объект: { op: "block", x, y, z, c }, { op: "unblock", x, y, z },
// { op: "plank", id, ends: [ax, ay, az, bx, by, bz], c } или { op: "unplank", id }
function edit(e) {
  if (e.op === "block" && !blocks.has(key(e.x, e.y, e.z))) {
    const mesh = new THREE.Mesh(boxGeo, material(brickTex, e.c));
    mesh.position.set(e.x + 0.5, e.y + 0.5, e.z + 0.5);
    addSolid(mesh, e);
    blocks.set(key(e.x, e.y, e.z), mesh);
  }
  if (e.op === "plank" && !planks.has(e.id)) {
    const mesh = new THREE.Mesh(plankGeo, material(woodTex, e.c));
    fitPlank(mesh, new THREE.Vector3(...e.ends.slice(0, 3)), new THREE.Vector3(...e.ends.slice(3)));
    addSolid(mesh, e);
    planks.set(e.id, mesh);
  }
  if (e.op === "unblock") removeSolid(blocks.get(key(e.x, e.y, e.z)));
  if (e.op === "unplank") removeSolid(planks.get(e.id));
}

// Своё изменение: применяем у себя и рассылаем остальным игрокам
function share(e) {
  edit(e);
  online?.sendEdits([e]);
}

function addSolid(mesh, e) {
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.edit = e;  // чем предмет был создан: нужно, чтобы его убрать и чтобы отправить новичкам
  solids.push(mesh);
  scene.add(mesh);
}

function removeSolid(mesh) {
  if (!mesh) return;
  scene.remove(mesh);
  solids.splice(solids.indexOf(mesh), 1);
  const e = mesh.userData.edit;
  if (e.op === "block") blocks.delete(key(e.x, e.y, e.z));
  else planks.delete(e.id);
}

// Кладёт доску между точками a и b (поверх поверхности, а не внутрь неё)
function fitPlank(mesh, a, b) {
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.position.y += PLANK_T / 2;
  mesh.scale.set(1, 1, a.distanceTo(b));
  mesh.lookAt(b.x, b.y + PLANK_T / 2, b.z);
}

// Подсказки: прозрачный блок там, куда он встанет, и прозрачная доска при выборе второй точки
const ghostMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.35, depthWrite: false });
const ghostBlock = new THREE.Mesh(new THREE.BoxGeometry(1.01, 1.01, 1.01), ghostMat);
const ghostPlank = new THREE.Mesh(plankGeo, ghostMat);
const ghostPoint = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), ghostMat);
scene.add(ghostBlock, ghostPlank, ghostPoint);

// ---------- Физика игрока ----------

const inside = (x, z) => x >= 0 && z >= 0 && x < SIZE && z < SIZE;

// Пересекается ли тело игрока (стоящего ступнями на высоте f) с каким-нибудь блоком
function hitsBlock(x, f, z) {
  for (let cx = Math.floor(x - RADIUS); cx <= Math.floor(x + RADIUS); cx++)
    for (let cz = Math.floor(z - RADIUS); cz <= Math.floor(z + RADIUS); cz++)
      for (let cy = Math.floor(f + 0.01); cy <= Math.floor(f + HEIGHT - 0.01); cy++)
        if (blocks.has(key(cx, cy, cz))) return true;
  return false;
}

// Пересекает ли отрезок a → a+d коробку с центром в нуле и полуразмерами half
function segmentHitsBox(a, d, half) {
  let t0 = 0, t1 = 1;
  for (const k of ["x", "y", "z"]) {
    if (Math.abs(d[k]) < 1e-9) {
      if (Math.abs(a[k]) > half[k]) return false;
      continue;
    }
    let ta = (-half[k] - a[k]) / d[k], tb = (half[k] - a[k]) / d[k];
    if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta);
    t1 = Math.min(t1, tb);
    if (t0 > t1) return false;
  }
  return true;
}

// Пересекается ли тело игрока с доской. Тело — вертикальный отрезок от колен (feet + STEP,
// чтобы на низкие доски можно было заходить) до макушки. Переводим его в систему координат
// доски, где она — обычная коробка, и расширяем коробку на толщину игрока
const invQ = new THREE.Quaternion();
function hitsPlank(mesh, x, f, z) {
  invQ.copy(mesh.quaternion).invert();
  const a = new THREE.Vector3(x, f + STEP, z).sub(mesh.position).applyQuaternion(invQ);
  const d = new THREE.Vector3(0, HEIGHT - STEP, 0).applyQuaternion(invQ);
  const half = new THREE.Vector3(PLANK_W / 2 + RADIUS, PLANK_T / 2, mesh.scale.z / 2 + RADIUS);
  return segmentHitsBox(a, d, half);
}

function hitsSolid(x, f, z) {
  return hitsBlock(x, f, z) || [...planks.values()].some(p => hitsPlank(p, x, f, z));
}

// Высота самой верхней опоры под игроком, на которую можно встать с высоты f
const downRay = new THREE.Raycaster();
function groundHeight(x, f, z) {
  let g = inside(x, z) ? 0 : -Infinity;  // за краем плиты — пустота
  for (let cx = Math.floor(x - RADIUS); cx <= Math.floor(x + RADIUS); cx++)
    for (let cz = Math.floor(z - RADIUS); cz <= Math.floor(z + RADIUS); cz++)
      for (let cy = Math.floor(f + STEP) - 1; cy >= 0; cy--)
        if (blocks.has(key(cx, cy, cz))) { g = Math.max(g, cy + 1); break; }

  downRay.set(new THREE.Vector3(x, f + STEP, z), new THREE.Vector3(0, -1, 0));
  const hit = downRay.intersectObjects([...planks.values()])[0];
  if (hit) g = Math.max(g, f + STEP - hit.distance);
  return g;
}

function update(dt) {
  // Ходьба: W/S — вперёд-назад, A/D — вбок, относительно взгляда (или джойстик)
  const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stick.y;
  const strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stick.x;
  let mx = -Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
  let mz = -Math.cos(yaw) * forward - Math.sin(yaw) * strafe;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  const step = MOVE_SPEED * dt;
  // По каждой оси отдельно — так можно скользить вдоль стены.
  // Если уже застрял (например, упал вплотную к краю доски), даём выйти
  const stuck = hitsSolid(px, feet, pz);
  if (stuck || !hitsSolid(px + mx * step, feet, pz)) px += mx * step;
  if (stuck || !hitsSolid(px, feet, pz + mz * step)) pz += mz * step;

  // Прыжок и гравитация
  if (keys.Space && onGround) vy = JUMP_SPEED;
  vy -= GRAVITY * dt;
  const prevFeet = feet;
  feet += vy * dt;
  if (vy > 0 && hitsSolid(px, feet, pz)) { feet = prevFeet; vy = 0; }  // ударился головой

  const ground = groundHeight(px, prevFeet, pz);
  onGround = feet <= ground;
  if (onGround) { feet = ground; vy = 0; }

  // Упал с плиты — возвращаемся в центр
  if (feet < -30) { px = pz = SIZE / 2; feet = 0; vy = 0; }

  camera.position.set(px, feet + EYE, pz);
  camera.rotation.set(pitch, yaw, 0);
}

// ---------- Прицел и строительство ----------

const aimRay = new THREE.Raycaster();
aimRay.far = REACH;

// Можно ли сейчас управлять: мышь захвачена (или это телефон) и палитра закрыта
const playing = () => !menuOpen && (TOUCH || !!document.pointerLockElement);

// Что под точкой экрана (по умолчанию — под прицелом в центре): точка, нормаль поверхности и объект.
// screen — координаты от -1 до 1, как у WebGL
function aim(screen = new THREE.Vector2(0, 0)) {
  aimRay.setFromCamera(screen, camera);
  const hit = aimRay.intersectObjects(solids)[0];
  if (!hit) return null;
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  return { point: hit.point, normal, object: hit.object };
}

// Точка доски: куда попал луч из aim(), а если там пусто — в воздухе на этом луче
function plankPoint(hit) {
  if (hit) return hit.point.clone();
  return aimRay.ray.at(AIR_DIST, new THREE.Vector3());
}

// Клетка, куда встанет новый блок: соседняя с поверхностью под прицелом
function blockCell(hit) {
  const p = hit.point.clone().addScaledVector(hit.normal, 0.5);
  const [x, y, z] = [Math.floor(p.x), Math.floor(p.y), Math.floor(p.z)];
  if (y < 0 || !inside(x, z)) return null;
  // Нельзя ставить блок внутрь себя
  const overlapsPlayer = x < px + RADIUS && x + 1 > px - RADIUS && z < pz + RADIUS && z + 1 > pz - RADIUS &&
                         y < feet + HEIGHT && y + 1 > feet;
  return overlapsPlayer ? null : [x, y, z];
}

function updateGhosts() {
  // На телефоне строят касанием в любое место экрана, поэтому подсказки под прицелом не показываем
  const on = playing() && !TOUCH;
  const hit = on ? aim() : null;
  const [r, g, b] = COLORS[color].rgb;
  ghostMat.color.setRGB(r / 255, g / 255, b / 255);

  const cell = hit && HOTBAR[slot] === "Блок" ? blockCell(hit) : null;
  ghostBlock.visible = !!cell;
  if (cell) ghostBlock.position.set(cell[0] + 0.5, cell[1] + 0.5, cell[2] + 0.5);

  const plankMode = on && HOTBAR[slot] === "Доска";
  const point = plankMode ? plankPoint(hit) : null;
  ghostPoint.visible = plankMode || !!plankStart;
  if (ghostPoint.visible) ghostPoint.position.copy(plankStart || point);
  ghostPlank.visible = plankMode && !!plankStart;
  if (ghostPlank.visible) fitPlank(ghostPlank, plankStart, point);
}

// Действие предметом: "place" — ЛКМ или касание, "remove" — ПКМ или удержание пальца.
// screen — точка экрана, куда нажали (на компьютере — центр, где прицел)
function use(action, screen) {
  if (menuOpen) return;
  const hit = aim(screen);

  // Убрать блок или доску под прицелом (или отменить начатую доску)
  if (action === "remove") {
    if (plankStart) plankStart = null;
    else if (hit && hit.object !== plate) {
      const e = hit.object.userData.edit;
      share(e.op === "block" ? { op: "unblock", x: e.x, y: e.y, z: e.z } : { op: "unplank", id: e.id });
    }
    drawHotbar();
    return;
  }

  if (HOTBAR[slot] === "Блок" && hit) {
    const cell = blockCell(hit);
    if (cell) share({ op: "block", x: cell[0], y: cell[1], z: cell[2], c: color });
  }
  // Доска: первое нажатие — начало, второе — конец
  if (HOTBAR[slot] === "Доска") {
    const point = plankPoint(hit);
    if (!plankStart) plankStart = point;
    else {
      // Примеряем доску на подсказке: нельзя ставить её внутрь себя
      fitPlank(ghostPlank, plankStart, point);
      if (plankStart.distanceTo(point) > 0.3 && !hitsPlank(ghostPlank, px, feet, pz)) {
        const ends = [...plankStart.toArray(), ...point.toArray()].map(v => +v.toFixed(3));
        share({ op: "plank", id: `${myId}-${plankCount++}`, ends, c: color });
      }
      plankStart = null;
    }
    drawHotbar();
  }
}

// ---------- Управление с клавиатуры и мыши ----------

function selectSlot(n) {
  slot = n;
  plankStart = null;
  drawHotbar();
}

addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code.startsWith("Digit")) {
    const n = Number(e.code.slice(5)) - 1;
    if (n >= 0 && n < HOTBAR.length) selectSlot(n);
  }
  if (e.code === "KeyF" && !e.repeat) togglePalette();
});
addEventListener("keyup", e => keys[e.code] = false);

// Клик по экрану захватывает мышь; камера крутится полностью, вверх и вниз до упора
renderer.domElement.addEventListener("click", () => {
  if (!menuOpen && !TOUCH) renderer.domElement.requestPointerLock();
});

function turn(dx, dy, speed) {
  yaw -= dx * speed;
  pitch -= dy * speed;
  pitch = Math.max(-Math.PI / 2 + 0.001, Math.min(Math.PI / 2 - 0.001, pitch));
}

addEventListener("mousemove", e => {
  if (document.pointerLockElement) turn(e.movementX, e.movementY, MOUSE_SPEED);
});
addEventListener("mousedown", e => {
  if (!document.pointerLockElement) return;
  if (e.button === 0) use("place");
  if (e.button === 2) use("remove");
});
addEventListener("contextmenu", e => e.preventDefault());

// ---------- Управление на телефоне ----------
// Левая половина экрана — джойстик для ходьбы, правая — поворот камеры пальцем.
// Короткое нажатие в любом месте ставит предмет туда, удержание — убирает то, что под пальцем.

const stickEl = document.getElementById("stick");
const knobEl = document.getElementById("knob");
let moveTouch = null, lookTouch = null;  // какой палец что делает
let press = null;  // палец, который пока может оказаться нажатием или удержанием

// Координаты касания → точка экрана от -1 до 1
function screenPoint(t) {
  const r = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2((t.clientX - r.left) / r.width * 2 - 1, -((t.clientY - r.top) / r.height * 2 - 1));
}

addEventListener("touchstart", e => {
  for (const t of e.changedTouches) {
    if (t.target.closest(".button, #hotbar, #palette")) continue;
    if (!press) {
      const screen = screenPoint(t);
      press = { id: t.identifier, x: t.clientX, y: t.clientY, screen, held: false };
      press.timer = setTimeout(() => {
        press.held = true;
        use("remove", screen);
        navigator.vibrate?.(30);
      }, HOLD_TIME);
    }
    if (t.clientX < innerWidth / 2 && !moveTouch) {
      moveTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
      for (const el of [stickEl, knobEl]) {
        el.style.display = "block";
        el.style.left = t.clientX + "px";
        el.style.top = t.clientY + "px";
      }
    } else if (t.clientX >= innerWidth / 2 && !lookTouch) {
      lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });

addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    // Палец заметно сдвинулся — значит, это ходьба или поворот, а не нажатие
    if (press && t.identifier === press.id && Math.hypot(t.clientX - press.x, t.clientY - press.y) > TAP_MOVE) {
      clearTimeout(press.timer);
      press.moved = true;
    }
    if (moveTouch && t.identifier === moveTouch.id) {
      let dx = t.clientX - moveTouch.x, dy = t.clientY - moveTouch.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
      stick.x = dx / STICK_RADIUS;
      stick.y = dy / STICK_RADIUS;
      knobEl.style.left = moveTouch.x + dx + "px";
      knobEl.style.top = moveTouch.y + dy + "px";
    }
    if (lookTouch && t.identifier === lookTouch.id) {
      turn(t.clientX - lookTouch.x, t.clientY - lookTouch.y, TOUCH_SPEED);
      lookTouch.x = t.clientX;
      lookTouch.y = t.clientY;
    }
  }
}, { passive: false });

function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (press && t.identifier === press.id) {
      clearTimeout(press.timer);
      if (!press.moved && !press.held && e.type === "touchend") use("place", press.screen);
      press = null;
    }
    if (moveTouch && t.identifier === moveTouch.id) {
      moveTouch = null;
      stick.x = stick.y = 0;
      stickEl.style.display = knobEl.style.display = "none";
    }
    if (lookTouch && t.identifier === lookTouch.id) lookTouch = null;
  }
}
addEventListener("touchend", touchEnd);
addEventListener("touchcancel", touchEnd);

// Полный экран (на iPhone браузер его не поддерживает — там кнопка скрыта)
const root = document.documentElement;
const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
if (!requestFullscreen) document.querySelector('[data-action="fullscreen"]').style.display = "none";

async function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    screen.orientation?.unlock?.();
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    await requestFullscreen.call(root);
    // Поворот в альбомную ориентацию работает только в полноэкранном режиме
    try { await screen.orientation.lock("landscape"); } catch {}
  }
}

// Кнопки справа: прыжок держится, пока палец на кнопке
for (const button of document.querySelectorAll("#touch .button")) {
  const action = button.dataset.action;
  button.addEventListener("touchstart", e => {
    e.preventDefault();
    button.classList.add("active");
    if (action === "jump") keys.Space = true;
    if (action === "color") togglePalette();
    if (action === "fullscreen") toggleFullscreen();
  });
  button.addEventListener("touchend", () => {
    button.classList.remove("active");
    if (action === "jump") keys.Space = false;
  });
}

// ---------- ASCII-интерфейс: панель предметов и палитра ----------

const hotbar = document.getElementById("hotbar");
const palette = document.getElementById("palette");
const ICONS = { "Блок": "████", "Доска": "▄▄▄▄" };

function rgb(c) {
  return `rgb(${COLORS[c].rgb.join(",")})`;
}

function drawHotbar() {
  const slots = HOTBAR.map((item, i) => {
    const [tl, h, tr, v, bl, br] = i === slot ? "╔═╗║╚╝" : "┌─┐│└┘";
    const icon = item ? `<span style="color:${rgb(color)}">${ICONS[item]}</span>` : "    ";
    const style = i === slot ? "" : ' style="color:#666"';
    return `<span class="slot" data-slot="${i}"${style}>${tl}${h.repeat(4)}${tr}\n${v}${icon}${v}\n${bl}${h}${i + 1}${h}${h}${br}</span>`;
  });
  let label = HOTBAR[slot] || "—";
  if (plankStart) label += " — выбери вторую точку";
  hotbar.innerHTML = label + "\n" + slots.join("");
}

hotbar.addEventListener("click", e => {
  const s = e.target.closest(".slot");
  if (s) selectSlot(Number(s.dataset.slot));
});

function drawPalette() {
  const W = 22;  // ширина внутри рамки
  let html = "╔" + "═".repeat(W) + "╗\n";
  html += "║" + "ПАЛИТРА".padStart(14).padEnd(W) + "║\n";
  html += "╟" + "─".repeat(W) + "╢\n";
  COLORS.forEach((c, i) => {
    const text = ` ${i === color ? "►" : " "} ${c.name}`.padEnd(W - 4);
    html += `║ <span class="option" data-color="${i}"><span style="color:${rgb(i)}">██</span>${text}</span> ║\n`;
  });
  html += "╟" + "─".repeat(W) + "╢\n";
  html += "║" + (TOUCH ? " ЦВЕТ — закрыть" : " F — закрыть").padEnd(W) + "║\n";
  html += "╚" + "═".repeat(W) + "╝";
  palette.innerHTML = html;
}

function togglePalette() {
  menuOpen = !menuOpen;
  if (menuOpen) {
    document.exitPointerLock();
    drawPalette();
  } else if (!TOUCH) {
    renderer.domElement.requestPointerLock();
  }
  palette.style.display = menuOpen ? "block" : "none";
}

palette.addEventListener("click", e => {
  const option = e.target.closest(".option");
  if (!option) return;
  color = Number(option.dataset.color);
  drawHotbar();
  togglePalette();
});

drawHotbar();

// ---------- ASCII-шейдер: сцена рисуется в маленькую картинку, каждый её пиксель — один символ ----------

// Картинка сцены вместе с глубиной: по глубине шейдер находит грани и рисует контуры
const sceneTarget = new THREE.WebGLRenderTarget(1, 1, { depthTexture: new THREE.DepthTexture(1, 1) });
const fontTex = new THREE.CanvasTexture(document.createElement("canvas"));
fontTex.flipY = false;
fontTex.generateMipmaps = false;
fontTex.minFilter = THREE.LinearFilter;

const asciiMat = new THREE.ShaderMaterial({
  uniforms: {
    sceneTex: { value: sceneTarget.texture },
    depthTex: { value: sceneTarget.depthTexture },
    fontTex: { value: fontTex },
    grid: { value: new THREE.Vector2() },
    rampLen: { value: SHADES },
    glyphs: { value: SHADES + EDGES.length },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D sceneTex;
    uniform sampler2D depthTex;
    uniform sampler2D fontTex;
    uniform vec2 grid;
    uniform float rampLen;
    uniform float glyphs;
    varying vec2 vUv;

    // 1 / расстояние до камеры. На ровной поверхности оно меняется равномерно,
    // поэтому всплеск в разнице с соседями означает грань или край предмета
    float invDepth(vec2 cell) {
      float d = texture2D(depthTex, (cell + 0.5) / grid).r * 2.0 - 1.0;
      float z = 2.0 * ${NEAR.toFixed(2)} * ${FAR.toFixed(1)} / (${(FAR + NEAR).toFixed(2)} - d * ${(FAR - NEAR).toFixed(2)});
      return 1.0 / z;
    }

    void main() {
      vec2 cell = floor(vUv * grid);
      vec2 inCell = fract(vUv * grid);
      // Сцена отрисована в 2 раза крупнее сетки: в центре клетки берётся среднее 4 пикселей
      vec3 c = texture2D(sceneTex, (cell + 0.5) / grid).rgb;
      float b = max(c.r, max(c.g, c.b));            // яркость → какой символ
      vec3 tint = b > 0.0 ? c / b : vec3(0.0);      // оттенок → цвет символа

      float w  = invDepth(cell);
      float wl = invDepth(cell + vec2(-1.0, 0.0));
      float wr = invDepth(cell + vec2( 1.0, 0.0));
      float wd = invDepth(cell + vec2(0.0, -1.0));
      float wu = invDepth(cell + vec2(0.0,  1.0));
      float edge = -(wl + wr + wd + wu - 4.0 * w) / w;  // > 0 на ближней стороне грани

      float g;
      if (edge > 0.12 && w > 1.0 / 40.0) {
        // Контур: символ | \\ - / по направлению грани, чуть ярче самой поверхности
        float a = atan(wu - wd, wr - wl);
        g = rampLen + mod(floor(a / 3.14159 * 4.0 + 0.5), 4.0);
        b = max(b, 0.6);
      } else {
        g = floor(b * (rampLen - 1.0) + 0.5);
      }
      float ink = texture2D(fontTex, vec2((g + inCell.x) / glyphs, 1.0 - inCell.y)).r;
      gl_FragColor = vec4(tint * ink * (0.3 + 0.7 * b), 1.0);
    }
  `,
});
const asciiScene = new THREE.Scene();
const asciiQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), asciiMat);
asciiQuad.frustumCulled = false;
asciiScene.add(asciiQuad);
const asciiCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Подгоняем сетку под окно и заново рисуем шрифт под плотность пикселей экрана
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cols = Math.floor(innerWidth / CELL_W);
  const rows = Math.floor(innerHeight / CELL_H);
  renderer.setPixelRatio(dpr);
  renderer.setSize(cols * CELL_W, rows * CELL_H);
  sceneTarget.setSize(cols * 2, rows * 2);
  asciiMat.uniforms.grid.value.set(cols, rows);
  camera.aspect = (cols * CELL_W) / (rows * CELL_H);
  camera.updateProjectionMatrix();

  fontTex.image = buildFont(Math.round(CELL_W * dpr), Math.round(CELL_H * dpr));
  fontTex.needsUpdate = true;
}

// Шрифт в одну строку: SHADES символов заливки от тёмного к яркому, потом символы контуров
function buildFont(cw, ch) {
  const font = document.createElement("canvas");
  font.width = cw * (SHADES + EDGES.length);
  font.height = ch;
  const ctx = font.getContext("2d", { willReadFrequently: true });
  ctx.font = Math.min(ch, cw / 0.6) + "px Consolas, 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  function draw(c, i) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(i * cw, 0, cw, ch);  // символ не вылезает за свою клетку
    ctx.clip();
    ctx.fillStyle = "#000";
    ctx.fillRect(i * cw, 0, cw, ch);
    ctx.fillStyle = "#fff";
    if (c === "█") ctx.fillRect(i * cw, 0, cw, ch);  // сплошной блок без щелей
    else ctx.fillText(c, i * cw + cw / 2, ch / 2);
    ctx.restore();
  }

  // Сколько "чернил" у каждого символа: рисуем его и считаем среднюю яркость
  const measured = [...CHARS].map(c => {
    draw(c, 0);
    const data = ctx.getImageData(0, 0, cw, ch).data;
    let sum = 0;
    for (let i = 0; i < data.length; i += 4) sum += data[i];
    return { c, ink: sum / (cw * ch * 255) };
  });
  const maxInk = Math.max(...measured.map(m => m.ink));

  // В каждую ступень яркости кладём символ, у которого чернил ближе всего к нужному
  for (let i = 0; i < SHADES; i++) {
    const want = i / (SHADES - 1) * maxInk;
    let best = measured[0];
    for (const m of measured) if (Math.abs(m.ink - want) < Math.abs(best.ink - want)) best = m;
    draw(best.c, i);
  }
  [...EDGES].forEach((c, i) => draw(c, SHADES + i));
  return font;
}
addEventListener("resize", resize);
resize();

// ---------- Онлайн: игроки соединяются напрямую друг с другом (WebRTC через Trystero) ----------
// Сервер не нужен: публичные узлы только знакомят игроков, дальше данные идут напрямую.
// Мир живёт, пока в игре кто-то есть: новичок получает его от тех, кто уже играет.

let online = null;          // появится, когда библиотека загрузится
const others = new Map();   // id игрока → его фигурка
let poseTimer = 0;

const avatarBody = new THREE.BoxGeometry(0.6, 1.2, 0.35);
const avatarHead = new THREE.BoxGeometry(0.45, 0.45, 0.45);
const avatarEyes = new THREE.BoxGeometry(0.3, 0.08, 0.02);
const eyesMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

// Фигурка другого игрока: туловище и голова его цвета, глаза показывают, куда он смотрит
function avatar(id) {
  if (others.has(id)) return others.get(id);
  const mat = new THREE.MeshLambertMaterial();
  const body = new THREE.Mesh(avatarBody, mat);
  const head = new THREE.Mesh(avatarHead, mat);
  const eyes = new THREE.Mesh(avatarEyes, eyesMat);
  body.position.y = 0.6;
  head.position.y = 1.45;
  eyes.position.set(0, 1.5, -0.235);
  const group = new THREE.Group();
  for (const m of [body, head, eyes]) { m.castShadow = true; group.add(m); }
  scene.add(group);
  const a = { group, mat, target: new THREE.Vector3(), yaw: 0, fresh: true };
  others.set(id, a);
  return a;
}

import("trystero").then(({ joinRoom }) => {
  const room = joinRoom({ appId: "xreamm1-ascii-baseplate" }, "baseplate");
  const edits = room.makeAction("edits");
  const pose = room.makeAction("pose");

  // Новичку отправляем всё, что уже построено
  room.onPeerJoin = id => edits.send(solids.slice(1).map(m => m.userData.edit), { target: id });
  room.onPeerLeave = id => {
    scene.remove(others.get(id)?.group);
    others.delete(id);
  };

  edits.onMessage = list => list.forEach(e => { try { edit(e); } catch {} });
  pose.onMessage = ([x, f, z, yaw, c], { peerId }) => {
    const a = avatar(peerId);
    a.target.set(x, f, z);
    a.yaw = yaw;
    const [r, g, b] = (COLORS[c] || COLORS[0]).rgb;
    a.mat.color.setRGB(r / 255, g / 255, b / 255);
    if (a.fresh) { a.group.position.copy(a.target); a.fresh = false; }
  };

  online = {
    sendEdits: list => edits.send(list),
    sendPose: () => pose.send([px, feet, pz, yaw, color].map(v => +v.toFixed(2))),
  };
}).catch(err => console.warn("Онлайн недоступен:", err));

// Плавно двигаем чужие фигурки к последним присланным позициям и 15 раз в секунду шлём свою
function updateOnline(dt) {
  const k = Math.min(1, dt * 12);
  for (const a of others.values()) {
    a.group.position.lerp(a.target, k);
    const turn = Math.atan2(Math.sin(a.yaw - a.group.rotation.y), Math.cos(a.yaw - a.group.rotation.y));
    a.group.rotation.y += turn * k;
  }
  poseTimer += dt;
  if (online && poseTimer > 1 / 15) {
    poseTimer = 0;
    online.sendPose();
  }
}

// ---------- Главный цикл ----------

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  update(dt);
  updateGhosts();
  updateOnline(dt);

  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(asciiScene, asciiCamera);
});
</script>
</body>
</html>
